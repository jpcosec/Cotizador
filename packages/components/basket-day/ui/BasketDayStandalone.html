<section class="basket-day-shell">
  <header class="panel controls-panel">
    <div class="controls-row">
      <label class="ship-control">
        <span>Catalog item</span>
        <select :value="selectedItemId" @change="selectItem($event.target.value)">
          <template x-for="item in itemOptions" :key="item.id">
            <option :value="item.id" x-text="`${item.nombre} (${item.categoria})`"></option>
          </template>
        </select>
      </label>

      <button class="btn btn-small btn-primary" @click="shipSelectedItem()">
        <i class="fa-solid fa-box-open"></i>
        Ship to day basket
      </button>
    </div>

    <div class="context-grid">
      <label>
        <span>Pax Global</span>
        <input type="number" min="0" :value="globalContext.paxGlobal" @input="setContextField('paxGlobal', $event.target.value)" />
      </label>
      <label>
        <span>Dia</span>
        <input type="number" min="1" :value="globalContext.dia" @input="setContextField('dia', $event.target.value)" />
      </label>
      <label>
        <span>Hora</span>
        <input type="time" :value="globalContext.hora" @input="setContextField('hora', $event.target.value)" />
      </label>
      <label>
        <span>Duracion Min</span>
        <input type="number" min="0" step="15" :value="globalContext.duracionMin" @input="setContextField('duracionMin', $event.target.value)" />
      </label>
    </div>
  </header>

  <section class="panel day-summary-panel">
    <h2>Day Basket State</h2>
    <div class="summary-grid">
      <article>
        <p class="label">Day</p>
        <p class="value" x-text="dayState.dayIndex || globalContext.dia || 1"></p>
      </article>
      <article>
        <p class="label">Entries</p>
        <p class="value" x-text="dayState.entryCount || 0"></p>
      </article>
      <article>
        <p class="label">Warnings</p>
        <p class="value" x-text="(dayState.ruleWarnings || []).length"></p>
      </article>
      <article>
        <p class="label">Errors</p>
        <p class="value" x-text="(dayState.ruleErrors || []).length"></p>
      </article>
    </div>
  </section>

  <section class="panel basket-items-panel">
    <h2>Day Entries</h2>
    <div class="item-list">
      <!-- BASKET_RUNTIME -->
    </div>
  </section>
</section>
