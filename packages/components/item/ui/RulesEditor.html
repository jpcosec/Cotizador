<div class="rules-editor-container">
  <!-- Header -->
  <div class="rules-editor-header">
    <div>
      <h3 class="rules-title">⚡ Rule Inspector</h3>
      <p class="rules-subtitle">JSON-Logic conditions that control item availability</p>
    </div>
    <button @click="toggleAddRuleForm()" class="btn-add-rule" :class="formExpanded && 'active'">
      <i class="fa-solid fa-plus"></i>
      <span>New Rule</span>
    </button>
  </div>

  <!-- Add Rule Form (Expandable) -->
  <template x-if="formExpanded">
    <div class="rule-form-panel" x-transition>
      <div class="form-grid">
        <div class="form-column">
          <div class="form-group">
            <label class="form-label">Rule Name</label>
            <input type="text" x-model="newRuleForm.Nombre" class="form-input" placeholder="e.g., Max pax exceeded">
          </div>
          <div class="form-group">
            <label class="form-label">Action Type</label>
            <div class="action-selector">
              <button @click="newRuleForm.Tipo_Accion = 'ERROR'" 
                      :class="['action-btn', newRuleForm.Tipo_Accion === 'ERROR' && 'active']">
                <i class="fa-solid fa-circle-xmark"></i> Block
              </button>
              <button @click="newRuleForm.Tipo_Accion = 'WARNING'" 
                      :class="['action-btn', newRuleForm.Tipo_Accion === 'WARNING' && 'active']">
                <i class="fa-solid fa-triangle-exclamation"></i> Warn
              </button>
            </div>
          </div>
        </div>

        <div class="form-column">
          <div class="form-group">
            <label class="form-label">Condition (JSON-Logic)</label>
            <textarea x-model="newRuleForm.Condicion_JSON" class="condition-textarea" 
                      placeholder='{ ">": [{"var":"pax"}, 100] }' rows="4"></textarea>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button @click="addRule()" class="btn-submit">
          <i class="fa-solid fa-check"></i> Add Rule
        </button>
        <button @click="toggleAddRuleForm()" class="btn-cancel">
          Cancel
        </button>
      </div>
    </div>
  </template>

  <!-- Rules List -->
  <div class="rules-list">
    <template x-if="rules && rules.length > 0">
      <template x-for="(rule, idx) in rules" :key="rule.ID_Regla">
        <div class="rule-card" :class="!rule.Activo && 'inactive'">
          <!-- Card Header -->
          <div class="rule-card-header" @click="toggleRuleExpanded(idx)">
            <div class="rule-header-left">
              <!-- Status Indicator -->
              <div class="status-indicator" :class="rule.Tipo_Accion.toLowerCase()">
                <i class="fa-solid" :class="rule.Tipo_Accion === 'ERROR' ? 'fa-circle-xmark' : 'fa-triangle-exclamation'"></i>
              </div>

              <!-- Rule Info -->
              <div class="rule-info">
                <div class="rule-name" x-text="rule.Nombre || 'Unnamed Rule'"></div>
                <div class="rule-meta">
                  <span class="rule-id" x-text="'ID: ' + rule.ID_Regla"></span>
                  <span class="rule-action" :class="rule.Tipo_Accion.toLowerCase()">
                    <i class="fa-solid fa-circle-dot"></i>
                    <span x-text="rule.Tipo_Accion"></span>
                  </span>
                </div>
              </div>
            </div>

            <!-- Toggle Arrow -->
            <div class="expand-toggle" :class="expandedRules[idx] && 'expanded'">
              <i class="fa-solid fa-chevron-down"></i>
            </div>
          </div>

          <!-- Condition Preview (Summary) -->
          <div class="rule-preview">
            <span class="preview-label">Condition:</span>
            <code class="preview-code" x-text="formatConditionPreview(rule.Condicion_JSON)"></code>
          </div>

          <!-- Expanded Details -->
          <template x-if="expandedRules[idx]">
            <div class="rule-card-details" x-transition.in.duration.300ms>
              <!-- Humanized Condition -->
              <div class="condition-humanized">
                <div class="detail-label">📖 Readable Format</div>
                <div class="humanized-text" x-text="humanizeCondition(rule.Condicion_JSON)"></div>
              </div>

              <!-- Full JSON-Logic Tree -->
              <div class="condition-tree">
                <div class="detail-label">🌳 Full Logic Tree</div>
                <pre class="tree-display" x-html="renderConditionTree(rule.Condicion_JSON, 0)"></pre>
              </div>

              <!-- Rule Metadata -->
              <div class="rule-metadata">
                <div class="metadata-row">
                  <span class="meta-key">Scope:</span>
                  <span class="meta-value" x-text="rule.Scope || 'ITEM'"></span>
                </div>
                <div class="metadata-row">
                  <span class="meta-key">Priority:</span>
                  <span class="meta-value" x-text="rule.Prioridad || '—'"></span>
                </div>
                <div class="metadata-row">
                  <span class="meta-key">Created:</span>
                  <span class="meta-value" x-text="rule.Updated_At || 'Now'"></span>
                </div>
              </div>

              <!-- Actions -->
              <div class="rule-actions">
                <button @click="toggleRuleActive(idx)" 
                        class="btn-action"
                        :class="rule.Activo ? 'active' : 'inactive'">
                  <i class="fa-solid" :class="rule.Activo ? 'fa-toggle-on' : 'fa-toggle-off'"></i>
                  <span x-text="rule.Activo ? 'Active' : 'Inactive'"></span>
                </button>
                <button @click="removeRule(idx)" class="btn-action danger">
                  <i class="fa-solid fa-trash"></i>
                  <span>Delete</span>
                </button>
              </div>
            </div>
          </template>
        </div>
      </template>
    </template>

    <!-- Empty State -->
    <template x-if="!rules || rules.length === 0">
      <div class="rules-empty">
        <div class="empty-icon">📋</div>
        <div class="empty-text">No rules yet</div>
        <div class="empty-hint">Click "New Rule" to add your first business rule</div>
      </div>
    </template>
  </div>
</div>
