<section x-data="itemStandaloneComponent()" x-init="init()">
  <h2>Step 03 - Item Standalone (no DB)</h2>

  <div class="item-step-layout">
    <div>
      <article>
        <h3>Definition + Mode</h3>
        <p><strong x-text="state.definition.name"></strong></p>
        <p>Category: <span x-text="state.definition.category"></span></p>
        <p x-text="state.definition.description"></p>
        <p>Pricing profile: <strong x-text="state.pricingHuman"></strong></p>
        <p>Mode: <strong x-text="state.mode"></strong></p>
        <p>Total: <strong x-text="'$' + Number(state.total ?? 0).toLocaleString('es-CL')"></strong></p>
        <div>
          <button class="btn-small btn-primary" type="button"
                  x-show="state.mode === 'catalog'"
                  @click="addToBasket()">Add to basket</button>
          <button class="btn-small btn-secondary" type="button"
                  x-show="state.mode === 'basket'"
                  @click="removeFromBasket()">Remove from basket</button>
          <button class="btn-small btn-secondary" type="button"
                  x-show="state.mode === 'basket'"
                  @click="resetOverrides()">Reset overrides</button>
        </div>
      </article>

      <article>
        <h3>Global Context</h3>
        <div class="form-group">
          <label>Pax Global</label>
          <input type="number" :value="state.externalContext.paxGlobal"
                 @input="setContext('paxGlobal', $event.target.value)">
        </div>
        <div class="form-group">
          <label>Duracion Global (min)</label>
          <input type="number" :value="state.externalContext.duracionMin"
                 @input="setContext('duracionMin', $event.target.value)">
        </div>
        <div class="form-group">
          <label>Dia Global</label>
          <input type="number" :value="state.externalContext.dia"
                 @input="setContext('dia', $event.target.value)">
        </div>
        <div class="form-group mb-0">
          <label>Hora Global</label>
          <input type="time" :value="state.externalContext.hora"
                 @input="setContext('hora', $event.target.value)">
        </div>
      </article>
    </div>

    <div>
      <article>
        <h3>Pricing Profile</h3>
        <div class="form-group">
          <label>Base fijo</label>
          <input type="number" :value="state.definition.pricingProfile.baseFijo ?? 0"
                 @input="setProfileValue('baseFijo', $event.target.value)">
        </div>
        <div class="form-group">
          <label>Por persona</label>
          <input type="number" :value="state.definition.pricingProfile.porPersona ?? 0"
                 @input="setProfileValue('porPersona', $event.target.value)">
        </div>
        <div class="form-group">
          <label>Por unidad</label>
          <input type="number" :value="state.definition.pricingProfile.porUnidad ?? 0"
                 @input="setProfileValue('porUnidad', $event.target.value)">
        </div>
        <div class="form-group mb-0">
          <label>Por minuto</label>
          <input type="number" :value="state.definition.pricingProfile.porMinuto ?? 0"
                 @input="setProfileValue('porMinuto', $event.target.value)">
        </div>
        <p style="margin-top:8px; font-size:0.85rem; color:#64748b;">
          Preview: <strong x-text="state.pricingHuman"></strong>
        </p>
      </article>

      <article>
        <h3>Default Initialization</h3>
        <div class="form-group">
          <label>Pax default</label>
          <input type="number" :value="state.definition.defaultQuantities.pax ?? ''"
                 @input="setDefaultQuantity('pax', $event.target.value)">
        </div>
        <div class="form-group">
          <label>Cantidad fija default</label>
          <input type="number" :value="state.definition.defaultQuantities.cantidad ?? ''"
                 @input="setDefaultQuantity('cantidad', $event.target.value)">
        </div>
        <div class="form-group">
          <label>Duracion fija default (min)</label>
          <input type="number" :value="state.definition.defaultQuantities.duracionMin ?? ''"
                 @input="setDefaultQuantity('duracionMin', $event.target.value)">
        </div>
        <div class="form-group">
          <label>Unidades por usuario</label>
          <input type="number" :value="state.definition.defaultQuantities.unidadesPorUsuario ?? ''"
                 @input="setDefaultQuantity('unidadesPorUsuario', $event.target.value)">
        </div>
        <div class="form-group">
          <label>Unidades por hora</label>
          <input type="number" :value="state.definition.defaultQuantities.unidadesPorHora ?? ''"
                 @input="setDefaultQuantity('unidadesPorHora', $event.target.value)">
        </div>
        <div class="form-group mb-0">
          <label>Minutos por usuario</label>
          <input type="number" :value="state.definition.defaultQuantities.minutosPorUsuario ?? ''"
                 @input="setDefaultQuantity('minutosPorUsuario', $event.target.value)">
        </div>
        <p style="margin-top:8px; font-size:0.85rem; color:#64748b;">
          Kind: <strong x-text="state.pricingKind"></strong>
          | Mode: <strong x-text="state.initializationMode"></strong>
          <span x-show="state.initPolicyHuman"> | <span x-text="state.initPolicyHuman"></span></span>
        </p>
      </article>

      <article x-show="state.mode === 'basket'">
        <h3>Basket Overrides</h3>
        <p x-text="state.basketLegend"></p>
        <div class="form-group" x-show="state.showPaxControl">
          <label>Override Pax</label>
          <input type="number" :value="state.quantities.pax"
                 @input="setOverride('pax', Number($event.target.value))">
        </div>
        <div class="form-group" x-show="state.showUnitsControl">
          <label>Override Unidades</label>
          <input type="number" :value="state.quantities.cantidad"
                 @input="setOverride('cantidad', Number($event.target.value))">
        </div>
        <div class="form-group" x-show="state.showTimeControl">
          <label>Override Duracion (min)</label>
          <input type="number" :value="state.quantities.duracionMin"
                 @input="setOverride('duracionMin', Number($event.target.value))">
        </div>
        <p x-show="state.isOverridden" style="color: #f59e0b; font-size: 0.85rem;">
          Quantity is overridden
        </p>
        <p style="font-size:0.8rem; color:#64748b;" x-text="state.appliedRules.join(' | ') || 'No active rules'"></p>
      </article>

      <article x-show="lastAction">
        <strong>Action:</strong> <span x-text="lastAction"></span>
      </article>

      <article>
        <h3>State Debug</h3>
        <details>
          <summary>Show JSON</summary>
          <pre style="max-height: 400px; overflow: auto; font-size: 0.75rem;" x-text="prettyState()"></pre>
        </details>
      </article>
    </div>
  </div>
</section>
