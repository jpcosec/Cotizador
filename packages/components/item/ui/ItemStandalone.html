<section x-data="itemStandaloneComponent()" x-init="init()" class="item-standalone">

  <main class="main">

    <!-- ═══ TOP CONFIG PANEL ═══ -->
    <div class="config-panel">
      <div class="config-row">
        <h2><i class="fa-solid fa-sliders"></i> Item Playground</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <button @click="addToBasket()" x-show="state.mode === 'catalog'" class="btn-small btn-primary">
            <i class="fa-solid fa-plus"></i> Add to Basket
          </button>
          <button @click="removeFromBasket()" x-show="state.mode === 'basket'" class="btn-small btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Back to Catalog
          </button>
        </div>
      </div>

      <!-- Item selector -->
      <div class="config-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
        <div class="form-group mb-0" style="grid-column: span 2;">
          <label>Item</label>
          <select :value="selectedItemId" @change="changeItem($event.target.value)">
            <template x-for="opt in itemOptions" :key="opt.id">
              <option :value="opt.id" :selected="opt.id === selectedItemId" x-text="opt.name"></option>
            </template>
          </select>
        </div>
        <div class="form-group mb-0">
          <label>PAX Global</label>
          <input type="number" :value="state.externalContext?.paxGlobal || 0"
                 @input="setContext('paxGlobal', $event.target.value)" min="0">
        </div>
        <div class="form-group mb-0">
          <label>Hora</label>
          <input type="time" :value="state.externalContext?.hora || '09:00'"
                 @input="setContext('hora', $event.target.value)">
        </div>
      </div>

      <!-- Read-only DB info: category + pricing profile -->
      <div class="db-info-strip" x-show="state.categoria || state.perfil">
        <span class="db-chip" x-show="state.categoria">
          <i class="fa-solid fa-tag"></i>
          <span x-text="state.categoria?.Nombre"></span>
        </span>
        <span class="db-chip db-chip-secondary" x-show="state.perfil">
          <i class="fa-solid fa-coins"></i>
          <span x-text="state.perfil?.Nombre"></span>
        </span>
        <span class="db-chip db-chip-price" x-show="state.perfil?.Costo_Base_Fijo > 0">
          Base: $<span x-text="Number(state.perfil?.Costo_Base_Fijo || 0).toLocaleString('es-CL')"></span>
        </span>
        <span class="db-chip db-chip-price" x-show="state.perfil?.Costo_Unitario_Pax > 0">
          $<span x-text="Number(state.perfil?.Costo_Unitario_Pax || 0).toLocaleString('es-CL')"></span>/pax
        </span>
        <span class="db-chip db-chip-price" x-show="state.perfil?.Costo_Unitario_Item > 0">
          $<span x-text="Number(state.perfil?.Costo_Unitario_Item || 0).toLocaleString('es-CL')"></span>/unidad
        </span>
        <span class="db-chip db-chip-price" x-show="state.perfil?.Costo_Unitario_Tiempo > 0">
          $<span x-text="Number(state.perfil?.Costo_Unitario_Tiempo || 0).toLocaleString('es-CL')"></span>/min
        </span>
      </div>
    </div>

    <!-- ═══ ITEM DISPLAY ═══ -->
    <div style="padding-top:15px;">

      <!-- CATALOG VIEW -->
      <template x-if="state.mode === 'catalog'">
        <div class="timeline-container" style="max-width:520px;">
          <div class="mini-card" @click="addToBasket()">
            <div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                <span class="category-badge" x-text="state.definition?.category || 'Uncategorized'"></span>
                <span x-show="!state.available" class="unavailable-badge">No disponible</span>
              </div>
              <h5 x-text="state.definition?.name || 'Item'"></h5>
              <p class="catalog-formula" x-text="state.catalogFormulaHuman || '—'"></p>
              <p x-show="state.initPolicyHuman" class="catalog-hint" x-text="state.initPolicyHuman"></p>
            </div>
            <i class="fa-solid fa-plus add-icon"></i>
          </div>

          <!-- Catalog rule errors/warnings -->
          <template x-if="state.ruleErrors?.length > 0">
            <div class="rule-alerts">
              <template x-for="e in state.ruleErrors">
                <div class="rule-alert error"><i class="fa-solid fa-circle-xmark"></i> <span x-text="e.message"></span></div>
              </template>
            </div>
          </template>
          <template x-if="state.ruleWarnings?.length > 0">
            <div class="rule-alerts">
              <template x-for="w in state.ruleWarnings">
                <div class="rule-alert warning"><i class="fa-solid fa-triangle-exclamation"></i> <span x-text="w.message"></span></div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <!-- BASKET VIEW -->
      <template x-if="state.mode === 'basket'">
        <div class="timeline-container">
          <div class="accordion-item" x-data="{ expanded: true }">
            <div class="accordion-header" @click="expanded = !expanded">
              <div class="acc-time" x-show="state.showHora">
                <input type="time" :value="state.overrides?.hora || state.externalContext?.hora || '09:00'"
                       @click.stop @change="setOverride('hora', $event.target.value)"
                       class="time-input-small">
              </div>
              <div class="acc-info">
                <div class="acc-title" x-text="state.definition?.name || 'Item'"></div>
                <div class="acc-subtitle">
                  <span x-text="'$' + Number(state.total ?? 0).toLocaleString('es-CL')"></span>
                  <span style="margin:0 5px;">•</span>
                  <span x-text="state.basketLegend || '—'"></span>
                  <span x-show="!state.available" class="unavailable-badge" style="margin-left:8px;">No disponible</span>
                </div>
              </div>
              <div class="acc-toggle">
                <i class="fa-solid" :class="expanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
              </div>
            </div>

            <div class="accordion-body" x-show="expanded">
              <div class="accordion-layout">

                <!-- Quantities -->
                <div class="accordion-col-left">
                  <div class="control-group" x-show="state.showPax || state.showPaxControl"
                       :class="state.isUserSetPax ? 'field-user-set' : ''">
                    <label>Pax <span x-show="state.isUserSetPax" class="manual-badge">manual</span></label>
                    <input type="number" :value="state.quantities?.pax || 0"
                           @change="setOverride('pax', $event.target.value)"
                           :class="state.isUserSetPax ? 'user-set-border' : ''" min="1">
                  </div>
                  <div class="control-group" x-show="state.showCantidad || state.showUnitsControl"
                       :class="state.isUserSetCantidad ? 'field-user-set' : ''">
                    <label>Unidades <span x-show="state.isUserSetCantidad" class="manual-badge">manual</span></label>
                    <input type="number" :value="state.quantities?.cantidad || 0"
                           @change="setOverride('cantidad', $event.target.value)"
                           :class="state.isUserSetCantidad ? 'user-set-border' : ''" min="0">
                  </div>
                  <div class="control-group" x-show="state.showDuracion || state.showTimeControl"
                       :class="state.isUserSetDuracion ? 'field-user-set' : ''">
                    <label>Duración (min) <span x-show="state.isUserSetDuracion" class="manual-badge">manual</span></label>
                    <input type="number" :value="state.quantities?.duracionMin || 0"
                           @change="setOverride('duracionMin', $event.target.value)"
                           :class="state.isUserSetDuracion ? 'user-set-border' : ''" min="0" step="15">
                  </div>
                  <button @click="resetOverrides()" class="btn-small btn-secondary" style="margin-top:4px;">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                  </button>

                  <div class="line-price-box">
                    <div class="line-price-row">
                      <span x-text="state.lineRateLabel || 'Rate'"></span>
                      <strong x-text="'$' + Number(state.lineRateValue ?? 0).toLocaleString('es-CL')"></strong>
                    </div>
                    <div class="line-price-row" x-show="state.lineBaseValue > 0">
                      <span>Base fija</span>
                      <strong x-text="'$' + Number(state.lineBaseValue ?? 0).toLocaleString('es-CL')"></strong>
                    </div>
                    <div class="line-price-row" style="border-top:1px solid #cbd5e1;padding-top:6px;margin-top:4px;">
                      <span>Total</span>
                      <strong style="font-size:1.1rem;" x-text="'$' + Number(state.total ?? 0).toLocaleString('es-CL')"></strong>
                    </div>
                  </div>
                </div>

                <!-- Comments -->
                <div class="accordion-col-middle">
                  <div class="form-group mb-0">
                    <label>Comentario</label>
                    <textarea class="line-comment-input"
                              :value="state.overrides?.comentarios || ''"
                              @change="setOverride('comentarios', $event.target.value)"
                              rows="5" placeholder="Notas..."></textarea>
                  </div>
                </div>

                <!-- Actions -->
                <div class="accordion-col-actions">
                  <button class="icon-action danger" @click="removeFromBasket()" title="Quitar">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>

              <!-- Basket rule alerts -->
              <template x-if="state.ruleErrors?.length > 0 || state.ruleWarnings?.length > 0">
                <div class="rule-alerts" style="margin-top:12px;">
                  <template x-for="e in state.ruleErrors">
                    <div class="rule-alert error"><i class="fa-solid fa-circle-xmark"></i> <span x-text="e.message"></span></div>
                  </template>
                  <template x-for="w in state.ruleWarnings">
                    <div class="rule-alert warning"><i class="fa-solid fa-triangle-exclamation"></i> <span x-text="w.message"></span></div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- ═══ RULE INSPECTOR ═══ -->
    <div style="padding-top:15px;">
      <div class="rules-editor-container">
        <div class="rules-editor-header">
          <div>
            <h3 class="rules-title">⚡ Rule Inspector</h3>
            <p class="rules-subtitle">
              DB rules for this item —
              <span x-text="(state.definition?.rules?.length || 0) + ' loaded'"></span>
            </p>
          </div>
        </div>

        <div class="rules-list">
          <template x-if="state.definition?.rules?.length > 0">
            <template x-for="(rule, idx) in state.definition.rules" :key="rule.ID_Regla">
              <div class="rule-card" :class="{ fired: state.appliedRules?.some(r => r.id === rule.ID_Regla) }">
                <div class="rule-card-header" @click="toggleRuleExpanded(idx)">
                  <div class="rule-header-left">
                    <div class="status-indicator" :class="rule.Tipo_Accion?.toLowerCase()">
                      <i class="fa-solid"
                         :class="rule.Tipo_Accion === 'ERROR' ? 'fa-circle-xmark' : 'fa-triangle-exclamation'"></i>
                    </div>
                    <div class="rule-info">
                      <div class="rule-name" x-text="rule.Nombre || 'Unnamed Rule'"></div>
                      <div class="rule-meta">
                        <span class="rule-id" x-text="rule.ID_Regla"></span>
                        <span class="rule-action" :class="rule.Tipo_Accion?.toLowerCase()" x-text="rule.Tipo_Accion"></span>
                        <span x-show="state.appliedRules?.some(r => r.id === rule.ID_Regla)"
                              class="rule-fired-badge">FIRED</span>
                      </div>
                    </div>
                  </div>
                  <div class="expand-toggle" :class="expandedRules[idx] && 'expanded'">
                    <i class="fa-solid fa-chevron-down"></i>
                  </div>
                </div>

                <div class="rule-preview">
                  <span class="preview-label">Condition:</span>
                  <code class="preview-code" x-text="formatConditionPreview(rule.Condicion_JSON)"></code>
                </div>

                <template x-if="expandedRules[idx]">
                  <div class="rule-card-details">
                    <div class="condition-humanized">
                      <div class="detail-label">Readable</div>
                      <div class="humanized-text" x-text="humanizeCondition(rule.Condicion_JSON)"></div>
                    </div>
                    <div class="rule-metadata">
                      <div class="metadata-row">
                        <span class="meta-key">Prioridad</span>
                        <span class="meta-value" x-text="rule.Prioridad"></span>
                      </div>
                      <div class="metadata-row">
                        <span class="meta-key">Acumulable</span>
                        <span class="meta-value" x-text="rule.Acumulable ? 'Sí' : 'No'"></span>
                      </div>
                      <div class="metadata-row">
                        <span class="meta-key">Payload</span>
                        <span class="meta-value" x-text="rule.Payload_JSON?.message || '—'"></span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </template>

          <template x-if="!state.definition?.rules?.length">
            <div class="rules-empty">
              <div class="empty-icon">📋</div>
              <div class="empty-text">No rules for this item</div>
            </div>
          </template>
        </div>
      </div>
    </div>

  </main>

  <style>
    * { box-sizing: border-box; }

    .item-standalone { background: #f8fafc; min-height: 100vh; }
    .main { max-width: 900px; margin: 0 auto; padding: 20px 20px 40px; }

    /* ── CONFIG PANEL ─────────────────────────────── */
    .config-panel {
      background: white; border: 1px solid #cbd5e1; border-radius: 8px;
      padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05); margin-bottom: 0;
    }
    .config-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0;
    }
    .config-row h2 { margin: 0; color: #2d5a27; font-size: 1.1rem; }
    .config-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .form-group.mb-0 { margin-bottom: 0; }
    .form-group label { font-size: .82rem; font-weight: 600; color: #64748b; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: .9rem;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #0066cc; }

    /* ── DB INFO STRIP ────────────────────────────── */
    .db-info-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #e2e8f0; }
    .db-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: #e8f5e9; color: #2d5a27; padding: 4px 10px; border-radius: 20px;
      font-size: .78rem; font-weight: 600;
    }
    .db-chip-secondary { background: #e3f2fd; color: #1565c0; }
    .db-chip-price { background: #f3f4f6; color: #374151; font-variant-numeric: tabular-nums; }

    /* ── CARDS ────────────────────────────────────── */
    .timeline-container { background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }

    .mini-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px; cursor: pointer; transition: all .2s;
      border: 1px solid #e2e8f0; border-radius: 8px;
    }
    .mini-card:hover { border-color: #0066cc; box-shadow: 0 4px 12px rgba(0,102,204,.15); transform: translateY(-2px); }
    .mini-card h5 { margin: 0; font-size: 1.1rem; color: #1a1a2e; font-weight: 700; }
    .catalog-formula { margin: 6px 0 0; color: #475569; font-size: .95rem; }
    .catalog-hint    { margin: 4px 0 0; color: #94a3b8; font-size: .82rem; }
    .add-icon { font-size: 1.8rem; color: #0066cc; flex-shrink: 0; margin-left: 20px; }

    /* ── RULE ALERTS ──────────────────────────────── */
    .rule-alerts { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 6px; }
    .rule-alert {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border-radius: 6px; font-size: .88rem; font-weight: 500;
    }
    .rule-alert.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .rule-alert.warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

    /* ── UNAVAILABLE BADGE ────────────────────────── */
    .unavailable-badge {
      background: #fee2e2; color: #b91c1c; padding: 2px 8px; border-radius: 4px;
      font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    }

    /* ── ACCORDION ────────────────────────────────── */
    .accordion-item { border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; }
    .accordion-header {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      cursor: pointer; background: #f8fafc; border-bottom: 1px solid #e2e8f0; transition: background .2s;
    }
    .accordion-header:hover { background: #f1f5f9; }
    .acc-time { flex-shrink: 0; }
    .time-input-small { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: .9rem; }
    .acc-info { flex: 1; }
    .acc-title { font-weight: 700; color: #1a1a2e; font-size: 1rem; }
    .acc-subtitle { font-size: .88rem; color: #64748b; margin-top: 3px; }
    .acc-toggle { color: #64748b; flex-shrink: 0; }
    .accordion-body { padding: 18px; background: white; }
    .accordion-layout { display: grid; grid-template-columns: 190px 1fr 56px; gap: 18px; }
    .accordion-col-left { display: flex; flex-direction: column; gap: 10px; }
    .accordion-col-middle { display: flex; flex-direction: column; }
    .accordion-col-actions { display: flex; flex-direction: column; gap: 8px; }

    .control-group { display: flex; flex-direction: column; gap: 3px; }
    .control-group label { font-size: .8rem; font-weight: 600; color: #64748b; }
    .control-group input { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: .9rem; }
    .field-user-set label { display: flex; align-items: center; gap: 6px; }
    .control-group.field-user-set input.user-set-border { border-color: #f97316; background: #fff7ed; }
    .manual-badge {
      background: #f97316; color: white; padding: 1px 5px; border-radius: 3px;
      font-size: .65rem; font-weight: 700; letter-spacing: .5px;
    }

    .line-price-box { margin-top: 8px; padding: 10px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; }
    .line-price-row { display: flex; justify-content: space-between; font-size: .88rem; padding: 4px 0; }
    .line-price-row strong { color: #0066cc; font-weight: 700; }

    .line-comment-input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: .85rem; font-family: inherit; resize: vertical; width: 100%; }

    .icon-action {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      padding: 0; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; transition: all .2s;
    }
    .icon-action.danger { color: #d32f2f; border-color: #fecaca; }
    .icon-action.danger:hover { background: #fef2f2; border-color: #d32f2f; }

    /* ── BUTTONS ──────────────────────────────────── */
    .btn-small { padding: 6px 12px; font-size: .85rem; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer; transition: all .2s; }
    .btn-primary { background: #2d5a27; color: white; border-color: #2d5a27; }
    .btn-primary:hover { background: #1e3f1a; }
    .btn-secondary { background: white; color: #64748b; }
    .btn-secondary:hover { background: #f1f5f9; }

    /* ── CATEGORY BADGE ───────────────────────────── */
    .category-badge {
      background: #e8f5e9; color: #2d5a27; padding: 3px 8px; border-radius: 4px;
      font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    }

    /* ── RULE INSPECTOR ───────────────────────────── */
    .rules-editor-container {
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
      border-radius: 12px; overflow: hidden; border: 1px solid rgba(16,185,129,.2);
    }
    .rules-editor-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 24px; border-bottom: 1px solid rgba(16,185,129,.1);
    }
    .rules-title { margin: 0; font-size: 1.3rem; font-weight: 700; color: #10b981; }
    .rules-subtitle { margin: 4px 0 0; font-size: .88rem; color: #94a3b8; }
    .rules-list { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }

    .rule-card {
      background: rgba(30,41,59,.6); border: 1px solid rgba(16,185,129,.15);
      border-radius: 8px; overflow: hidden; transition: all .3s;
    }
    .rule-card.fired { border-color: rgba(239,68,68,.5); background: rgba(127,29,29,.15); }
    .rule-card:hover { border-color: rgba(16,185,129,.4); }
    .rule-card-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; background: rgba(15,23,42,.4); cursor: pointer; transition: background .2s;
    }
    .rule-card-header:hover { background: rgba(15,23,42,.6); }
    .rule-header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .status-indicator {
      width: 30px; height: 30px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
    }
    .status-indicator.error   { background: rgba(239,68,68,.15); color: #ef4444; }
    .status-indicator.warning { background: rgba(245,158,11,.15); color: #f59e0b; }
    .rule-info { flex: 1; }
    .rule-name { font-size: .95rem; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
    .rule-meta { display: flex; align-items: center; gap: 10px; font-size: .78rem; }
    .rule-id   { color: #94a3b8; font-family: monospace; }
    .rule-action {
      padding: 2px 7px; border-radius: 3px; font-weight: 700; text-transform: uppercase; font-size: .7rem;
      background: rgba(16,185,129,.1); color: #10b981;
    }
    .rule-action.error   { background: rgba(239,68,68,.15); color: #ef4444; }
    .rule-action.warning { background: rgba(245,158,11,.15); color: #f59e0b; }
    .rule-fired-badge {
      background: #ef4444; color: white; padding: 2px 6px; border-radius: 3px;
      font-size: .68rem; font-weight: 700; letter-spacing: .5px;
    }
    .expand-toggle { color: #64748b; transition: transform .3s; }
    .expand-toggle.expanded { transform: rotate(180deg); }

    .rule-preview {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      background: rgba(15,23,42,.2); border-top: 1px solid rgba(16,185,129,.05);
    }
    .preview-label { font-size: .75rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; white-space: nowrap; }
