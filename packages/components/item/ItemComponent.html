<!-- ItemComponent.html -->
<!-- Clean, semantic template for reusable Item component -->

<article class=\"item-component\" x-data=\"ItemComponent.create(definition, context)\" x-init=\"init()\">
  <!-- NAVIGATION HEADER -->
  <header class=\"item-header\">
    <nav class=\"breadcrumb\">
      <a href=\"/\" class=\"breadcrumb-link\">← Back to Quotations</a>\n    </nav>
    <div class=\"header-actions\">
      <template x-if=\"mode === 'catalog'\">\n        <button @click=\"addToBasket()\" class=\"btn btn-primary\">\n          <svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"1\"></circle><path d=\"M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 0l4.24-4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08 0l4.24 4.24\"></path></svg>\n          Add to Basket\n        </button>\n      </template>\n      <template x-if=\"mode === 'basket'\">\n        <button @click=\"removeFromBasket()\" class=\"btn btn-secondary\">\n          <svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"15 19l-7-7 7-7\"></polyline></svg>\n          Back to Catalog\n        </button>\n      </template>\n    </div>\n  </header>\n\n  <!-- MAIN CONTENT -->\n  <main class=\"item-main\">\n    <!-- LEFT PANEL: Configuration -->\n    <aside class=\"config-sidebar\">\n      <section class=\"config-section\">\n        <h3 class=\"section-title\">Event Context</h3>\n        <div class=\"control-stack\">\n          <label class=\"control\">\n            <span class=\"control-label\">Guests (PAX)</span>\n            <input type=\"number\" :value=\"state.externalContext.paxGlobal || 0\" @input=\"setContext('paxGlobal', $event.target.value)\" class=\"control-input\" min=\"0\">\n          </label>\n          <label class=\"control\">\n            <span class=\"control-label\">Duration (minutes)</span>\n            <input type=\"number\" :value=\"state.externalContext.duracionMin || 0\" @input=\"setContext('duracionMin', $event.target.value)\" class=\"control-input\" min=\"0\" step=\"15\">\n          </label>\n          <label class=\"control\">\n            <span class=\"control-label\">Start Time</span>\n            <input type=\"time\" :value=\"state.externalContext.hora || '09:00'\" @input=\"setContext('hora', $event.target.value)\" class=\"control-input\">\n          </label>\n          <label class=\"control\">\n            <span class=\"control-label\">Date</span>\n            <input type=\"date\" :value=\"state.externalContext.dia || '2026-02-24'\" @input=\"setContext('dia', $event.target.value)\" class=\"control-input\">\n          </label>\n        </div>\n      </section>\n\n      <hr class=\"config-divider\">\n\n      <details class=\"config-collapsible\">\n        <summary class=\"config-summary\">💰 Pricing Profile</summary>\n        <div class=\"control-stack\">\n          <label class=\"control\">\n            <span class=\"control-label\">Base Fixed Price</span>\n            <input type=\"number\" :value=\"state.profile?.baseFijo || 0\" @input=\"setProfileValue('baseFijo', $event.target.value)\" class=\"control-input\" min=\"0\">\n          </label>\n          <label class=\"control\">\n            <span class=\"control-label\">Per Person</span>\n            <input type=\"number\" :value=\"state.profile?.porPersona || 0\" @input=\"setProfileValue('porPersona', $event.target.value)\" class=\"control-input\" min=\"0\">\n          </label>\n          <label class=\"control\">\n            <span class=\"control-label\">Per Unit</span>\n            <input type=\"number\" :value=\"state.profile?.porUnidad || 0\" @input=\"setProfileValue('porUnidad', $event.target.value)\" class=\"control-input\" min=\"0\">\n          </label>\n          <label class=\"control\">\n            <span class=\"control-label\">Per Minute</span>\n            <input type=\"number\" :value=\"state.profile?.porMinuto || 0\" @input=\"setProfileValue('porMinuto', $event.target.value)\" class=\"control-input\" min=\"0\" step=\"0.01\">\n          </label>\n        </div>\n      </details>\n\n      <details class=\"config-collapsible\">\n        <summary class=\"config-summary\">📋 Default Quantities</summary>\n        <div class=\"control-stack\">\n          <label class=\"control\">\n            <span class=\"control-label\">Units per User</span>\n            <input type=\"number\" :value=\"state.externalContext.unidadesPorUsuario || 0\" @input=\"setDefaultQuantity('unidadesPorUsuario', $event.target.value)\" class=\"control-input\" min=\"0\">\n          </label>\n          <label class=\"control\">\n            <span class=\"control-label\">Units per Hour</span>\n            <input type=\"number\" :value=\"state.externalContext.unidadesPorHora || 0\" @input=\"setDefaultQuantity('unidadesPorHora', $event.target.value)\" class=\"control-input\" min=\"0\">\n          </label>\n        </div>\n      </details>\n    </aside>\n\n    <!-- CENTER PANEL: Item Display -->\n    <section class=\"item-display\">\n      <!-- CATALOG VIEW -->\n      <template x-if=\"mode === 'catalog'\">\n        <div class=\"catalog-view\">\n          <article class=\"item-card\" @click=\"addToBasket()\">\n            <!-- Category Badge -->\n            <div class=\"card-meta\">\n              <span class=\"badge\" x-text=\"state.definition.category || 'General'\"></span>\n            </div>\n\n            <!-- Item Name -->\n            <h2 class=\"card-title\" x-text=\"state.definition.name || 'Item'\"></h2>\n\n            <!-- Description -->\n            <template x-if=\"state.definition.description\">\n              <p class=\"card-description\" x-text=\"state.definition.description\"></p>\n            </template>\n\n            <!-- Pricing Formula -->\n            <div class=\"card-pricing\">\n              <div class=\"pricing-row\">\n                <span class=\"pricing-label\">Base:</span>\n                <span class=\"pricing-value\" x-text=\"'$' + (state.profile?.baseFijo || 0).toLocaleString('es-CL')\"></span>\n              </div>\n              <div class=\"pricing-row\" x-show=\"state.profile?.porPersona > 0\">\n                <span class=\"pricing-label\">Per Person:</span>\n                <span class=\"pricing-value\" x-text=\"'$' + (state.profile?.porPersona || 0).toLocaleString('es-CL')\"></span>\n              </div>\n              <div class=\"pricing-row\" x-show=\"state.profile?.porUnidad > 0\">\n                <span class=\"pricing-label\">Per Unit:</span>\n                <span class=\"pricing-value\" x-text=\"'$' + (state.profile?.porUnidad || 0).toLocaleString('es-CL')\"></span>\n              </div>\n              <div class=\"pricing-row\" x-show=\"state.profile?.porMinuto > 0\">\n                <span class=\"pricing-label\">Per Minute:</span>\n                <span class=\"pricing-value\" x-text=\"'$' + (state.profile?.porMinuto || 0).toLocaleString('es-CL')\"></span>\n              </div>\n            </div>\n\n            <!-- Policy Hint -->\n            <div class=\"card-policy\">\n              <p class=\"policy-text\" x-text=\"state.initPolicyHuman || 'Configure quantities as needed'\"></p>\n            </div>\n\n            <!-- CTA -->\n            <div class=\"card-cta\">\n              <span class=\"cta-text\">Click to add to basket</span>\n              <svg class=\"cta-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"5 12 19 12M12 5l7 7-7 7\"></polyline></svg>\n            </div>\n          </article>\n        </div>\n      </template>\n\n      <!-- BASKET VIEW -->\n      <template x-if=\"mode === 'basket'\">\n        <div class=\"basket-view\" x-data=\"{ expanded: false }\">\n          <!-- Header Bar -->\n          <div class=\"basket-header\" @click=\"expanded = !expanded\">\n            <div class=\"header-time\">\n              <svg class=\"icon-small\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><polyline points=\"12 6 12 12 16 14\"></polyline></svg>\n              <input type=\"time\" :value=\"state.externalContext.hora || '09:00'\" @click.stop @input=\"setContext('hora', $event.target.value)\" class=\"header-time-input\">\n            </div>\n            <div class=\"header-info\">\n              <h3 class=\"header-title\" x-text=\"state.definition.name || 'Item'\"></h3>\n              <p class=\"header-subtitle\" x-text=\"'$' + (state.total || 0).toLocaleString('es-CL')\"></p>\n            </div>\n            <div class=\"header-toggle\" :class=\"expanded && 'expanded'\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"6 9l6 6 6-6\"></polyline></svg>\n            </div>\n          </div>\n\n          <!-- Expanded Details -->\n          <template x-if=\"expanded\">\n            <div class=\"basket-details\" x-transition.in.duration.200ms>\n              <!-- Quantity Controls -->\n              <div class=\"details-section\">\n                <h4 class=\"details-heading\">Quantities</h4>\n                <div class=\"quantities-grid\">\n                  <template x-if=\"state.showPaxControl\">\n                    <div class=\"quantity-control\" :class=\"state.isUserSetPax && 'user-set'\">\n                      <label class=\"quantity-label\">\n                        Guests\n                        <span class=\"user-badge\" x-show=\"state.isUserSetPax\">Manual</span>\n                      </label>\n                      <input type=\"number\" :value=\"state.quantities?.pax || 0\" @change=\"setOverride('pax', $event.target.value)\" class=\"quantity-input\" min=\"1\">\n                    </div>\n                  </template>\n                  <template x-if=\"state.showUnitsControl\">\n                    <div class=\"quantity-control\" :class=\"state.isUserSetCantidad && 'user-set'\">\n                      <label class=\"quantity-label\">\n                        Units\n                        <span class=\"user-badge\" x-show=\"state.isUserSetCantidad\">Manual</span>\n                      </label>\n                      <input type=\"number\" :value=\"state.quantities?.cantidad || 0\" @change=\"setOverride('cantidad', $event.target.value)\" class=\"quantity-input\" min=\"0\">\n                    </div>\n                  </template>\n                  <template x-if=\"state.showTimeControl\">\n                    <div class=\"quantity-control\" :class=\"state.isUserSetDuracion && 'user-set'\">\n                      <label class=\"quantity-label\">\n                        Minutes\n                        <span class=\"user-badge\" x-show=\"state.isUserSetDuracion\">Manual</span>\n                      </label>\n                      <input type=\"number\" :value=\"state.quantities?.duracionMin || 0\" @change=\"setOverride('duracionMin', $event.target.value)\" class=\"quantity-input\" min=\"0\" step=\"15\">\n                    </div>\n                  </template>\n                </div>\n              </div>\n\n              <!-- Pricing Breakdown -->\n              <div class=\"details-section\">\n                <h4 class=\"details-heading\">Pricing</h4>\n                <div class=\"pricing-breakdown\">\n                  <div class=\"breakdown-row\">\n                    <span class=\"breakdown-label\">Base Fixed:</span>\n                    <span class=\"breakdown-value\" x-text=\"'$' + (state.profile?.baseFijo || 0).toLocaleString('es-CL')\"></span>\n                  </div>\n                  <template x-if=\"state.lineRateSubtotal > 0\">\n                    <div class=\"breakdown-row\">\n                      <span class=\"breakdown-label\" x-text=\"state.lineRateLabel + ' (' + (state.quantities.pax + state.quantities.cantidad + state.quantities.duracionMin) + '):\"></span>\n                      <span class=\"breakdown-value\" x-text=\"'$' + (state.lineRateSubtotal || 0).toLocaleString('es-CL')\"></span>\n                    </div>\n                  </template>\n                  <hr class=\"breakdown-divider\">\n                  <div class=\"breakdown-row total\">\n                    <span class=\"breakdown-label\">Total:</span>\n                    <span class=\"breakdown-value-total\" x-text=\"'$' + (state.total || 0).toLocaleString('es-CL')\"></span>\n                  </div>\n                </div>\n              </div>\n\n              <!-- Comments -->\n              <div class=\"details-section\">\n                <h4 class=\"details-heading\">Notes</h4>\n                <textarea class=\"comments-input\" :value=\"state.overrides.comentarios || ''\" @change=\"setOverride('comentarios', $event.target.value)\" placeholder=\"Add special requests or notes...\"></textarea>\n              </div>\n\n              <!-- Actions -->\n              <div class=\"details-actions\">\n                <button @click=\"removeFromBasket()\" class=\"btn btn-danger\">\n                  <svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"3 6 5 6 21 6\"></polyline><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6\"></path></svg>\n                  Remove Item\n                </button>\n              </div>\n            </div>\n          </template>\n        </div>\n      </template>\n    </section>\n\n    <!-- RIGHT PANEL: Rules -->\n    <aside class=\"rules-sidebar\">\n      <section class=\"rules-section\">\n        <h3 class=\"section-title\">Business Rules</h3>\n\n        <!-- Rules List -->\n        <div class=\"rules-list\">\n          <template x-if=\"rules && rules.length > 0\">\n            <template x-for=\"(rule, idx) in rules\" :key=\"rule.ID_Regla\">\n              <div class=\"rule-item\" :class=\"!rule.Activo && 'inactive'\">\n                <div class=\"rule-header\" @click=\"toggleRuleExpanded(idx)\">\n                  <div class=\"rule-icon\" :class=\"rule.Tipo_Accion.toLowerCase()\">\n                    <template x-if=\"rule.Tipo_Accion === 'ERROR'\">\n                      <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"M8 8h8v8H8z\" fill=\"white\"></path></svg>\n                    </template>\n                    <template x-if=\"rule.Tipo_Accion === 'WARNING'\">\n                      <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2L2 20h20z\"></path></svg>\n                    </template>\n                  </div>\n                  <div class=\"rule-name\" x-text=\"rule.Nombre || 'Rule'\"></div>\n                  <div class=\"rule-toggle\" :class=\"expandedRules[idx] && 'expanded'\">\n                    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"6 9l6 6 6-6\"></polyline></svg>\n                  </div>\n                </div>\n\n                <!-- Expanded Content -->\n                <template x-if=\"expandedRules[idx]\">\n                  <div class=\"rule-details\" x-transition.in.duration.200ms>\n                    <div class=\"rule-condition\">\n                      <p class=\"condition-text\" x-text=\"humanizeCondition(rule.Condicion_JSON)\"></p>\n                    </div>\n                    <button @click=\"toggleRuleActive(idx)\" class=\"rule-action-btn\" :class=\"rule.Activo ? 'active' : 'inactive'\">\n                      <svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"1\" y=\"5\" width=\"22\" height=\"14\" rx=\"7\"></rect><circle :cx=\"rule.Activo ? '17' : '7'\" cy=\"12\" r=\"5\" fill=\"white\"></circle></svg>\n                      <span x-text=\"rule.Activo ? 'Active' : 'Inactive'\"></span>\n                    </button>\n                  </div>\n                </template>\n              </div>\n            </template>\n          </template>\n          <template x-if=\"!rules || rules.length === 0\">\n            <div class=\"rules-empty\">\n              <p class=\"empty-text\">No rules configured</p>\n            </div>\n          </template>\n        </div>\n      </section>\n    </aside>\n  </main>\n</article>\n\n<style>\n  /* ╔════════════════════════════════════════════════════════════════════╗ */\n  /* ║ ITEMCOMPONENT - PROFESSIONAL LUXURY MINIMALISM                     ║ */\n  /* ║ Refined serif + clean sans-serif, deep navy + warm gold palette   ║ */\n  /* ╚════════════════════════════════════════════════════════════════════╝ */\n\n  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');\n\n  :root {\n    /* ─── COLOR SYSTEM ─── */\n    --color-navy: #1a1f3a;\n    --color-navy-light: #2d3561;\n    --color-navy-lighter: #3d4578;\n    --color-gold: #d4af37;\n    --color-gold-light: #e8d4a8;\n    --color-white: #fafafa;\n    --color-gray-50: #f8f8f8;\n    --color-gray-100: #f0f0f0;\n    --color-gray-200: #e8e8e8;\n    --color-gray-300: #d0d0d0;\n    --color-gray-500: #808080;\n    --color-success: #10b981;\n    --color-warning: #f59e0b;\n    --color-danger: #ef4444;\n\n    /* ─── TYPOGRAPHY ─── */\n    --font-display: 'Playfair Display', serif;\n    --font-body: 'Outfit', sans-serif;\n    --font-mono: 'Courier New', monospace;\n\n    /* ─── SPACING ─── */\n    --sp-xs: 4px;\n    --sp-sm: 8px;\n    --sp-md: 16px;\n    --sp-lg: 24px;\n    --sp-xl: 32px;\n\n    /* ─── TRANSITIONS ─── */\n    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);\n  }\n\n  * {\n    box-sizing: border-box;\n  }\n\n  .item-component {\n    background: var(--color-white);\n    font-family: var(--font-body);\n    color: var(--color-navy);\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* ════════ HEADER ════════ */\n  .item-header {\n    background: var(--color-navy);\n    color: var(--color-white);\n    padding: var(--sp-lg);\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    border-bottom: 2px solid var(--color-gold);\n  }\n\n  .breadcrumb {\n    font-size: 0.95rem;\n  }\n\n  .breadcrumb-link {\n    color: var(--color-gold);\n    text-decoration: none;\n    font-weight: 500;\n    transition: var(--transition);\n  }\n\n  .breadcrumb-link:hover {\n    color: var(--color-gold-light);\n  }\n\n  .header-actions {\n    display: flex;\n    gap: var(--sp-md);\n  }\n\n  /* ════════ BUTTONS ════════ */\n  .btn {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--sp-sm);\n    padding: 10px 20px;\n    border-radius: 6px;\n    font-family: var(--font-body);\n    font-weight: 600;\n    font-size: 0.95rem;\n    border: none;\n    cursor: pointer;\n    transition: var(--transition);\n    text-decoration: none;\n  }\n\n  .icon {\n    width: 18px;\n    height: 18px;\n    stroke-linecap: round;\n    stroke-linejoin: round;\n  }\n\n  .btn-primary {\n    background: var(--color-gold);\n    color: var(--color-navy);\n  }\n\n  .btn-primary:hover {\n    background: var(--color-gold-light);\n    transform: translateY(-2px);\n    box-shadow: 0 8px 16px rgba(212, 175, 55, 0.2);\n  }\n\n  .btn-secondary {\n    background: transparent;\n    color: var(--color-gold);\n    border: 2px solid var(--color-gold);\n  }\n\n  .btn-secondary:hover {\n    background: var(--color-gold);\n    color: var(--color-navy);\n  }\n\n  .btn-danger {\n    background: var(--color-danger);\n    color: var(--color-white);\n  }\n\n  .btn-danger:hover {\n    background: #dc2626;\n    transform: translateY(-2px);\n  }\n\n  /* ════════ LAYOUT ════════ */\n  .item-main {\n    display: grid;\n    grid-template-columns: 280px 1fr 320px;\n    gap: var(--sp-lg);\n    max-width: 1400px;\n    margin: 0 auto;\n    padding: var(--sp-xl);\n    align-items: start;\n  }\n\n  /* ════════ SIDEBAR ════════ */\n  .config-sidebar,\n  .rules-sidebar {\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-lg);\n  }\n\n  .config-section,\n  .rules-section {\n    background: var(--color-gray-50);\n    border: 1px solid var(--color-gray-200);\n    border-radius: 8px;\n    padding: var(--sp-md);\n  }\n\n  .section-title {\n    font-family: var(--font-display);\n    font-size: 1.2rem;\n    font-weight: 600;\n    margin: 0 0 var(--sp-md) 0;\n    color: var(--color-navy);\n  }\n\n  .control-stack {\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-md);\n  }\n\n  .control {\n    display: flex;\n    flex-direction: column;\n    gap: var(--sp-xs);\n  }\n\n  .control-label {\n    font-size: 0.85rem;\n    font-weight: 600;\n    color: var(--color-gray-500);\n    text-transform: uppercase;\n    letter-spacing: 0.3px;\n  }\n\n  .control-input,\n  .comments-input {\n    padding: 8px 12px;\n    border: 1px solid var(--color-gray-200);\n    border-radius: 6px;\n    font-family: var(--font-body);\n    font-size: 0.95rem;\n    color: var(--color-navy);\n    transition: var(--transition);\n  }\n\n  .control-input:focus,\n  .comments-input:focus {\n    outline: none;\n    border-color: var(--color-gold);\n    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);\n  }\n\n  .config-divider {\n    border: none;\n    border-top: 1px solid var(--color-gray-200);\n    margin: var(--sp-lg) 0;\n  }\n\n  .config-collapsible {\n    padding: var(--sp-md);\n    background: var(--color-white);\n    border: 1px solid var(--color-gray-200);\n    border-radius: 6px;\n  }\n\n  .config-summary {\n    cursor: pointer;\n    font-weight: 600;\n    color: var(--color-navy);\n    user-select: none;\n  }\n\n  .config-summary:hover {\n    color: var(--color-gold);\n  }\n\n  .config-collapsible[open] > .config-summary {\n    margin-bottom: var(--sp-md);\n  }\n\n  .config-collapsible[open] .control-stack {\n    animation: slideDown 0.3s ease-out;\n  }\n\n  @keyframes slideDown {\n    from {\n      opacity: 0;\n      transform: translateY(-10px);\n    }\n    to {\n      opacity: 1;\n      transform: translateY(0);\n    }\n  }\n\n  /* ════════ ITEM DISPLAY ════════ */\n  .item-display {\n    min-height: 400px;\n  }\n\n  /* ─── CATALOG VIEW ─── */\n  .catalog-view {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    min-height: 500px;\n  }\n\n  .item-card {\n    background: var(--color-white);\n    border: 2px solid var(--color-gray-200);\n    border-radius: 12px;\n    padding: var(--sp-xl);\n    max-width: 400px;\n    cursor: pointer;\n    transition: var(--transition);\n    position: relative;\n    overflow: hidden;\n  }\n\n  .item-card::before {\n    content: '';\n    position: absolute;\n    top: 0;\n    left: 0;\n    right: 0;\n    bottom: 0;\n    background: linear-gradient(135deg, rgba(212, 175, 55, 0) 0%, rgba(212, 175, 55, 0.05) 100%);\n    opacity: 0;\n    transition: opacity 0.3s;\n    pointer-events: none;\n  }\n\n  .item-card:hover {\n    border-color: var(--color-gold);\n    box-shadow: 0 16px 48px rgba(212, 175, 55, 0.15);\n    transform: translateY(-4px);\n  }\n\n  .item-card:hover::before {\n    opacity: 1;\n  }\n\n  .card-meta {\n    margin-bottom: var(--sp-md);\n  }\n\n  .badge {\n    display: inline-block;\n    background: rgba(212, 175, 55, 0.1);\n    color: var(--color-gold);\n    padding: 4px 12px;\n    border-radius: 20px;\n    font-size: 0.8rem;\n    font-weight: 600;\n    text-transform: uppercase;\n    letter-spacing: 0.5px;\n  }\n\n  .card-title {\n    font-family: var(--font-display);\n    font-size: 2rem;\n    font-weight: 700;\n    margin: 0 0 var(--sp-md) 0;\n    color: var(--color-navy);\n    line-height: 1.2;\n  }\n\n  .card-description {\n    color: var(--color-gray-500);\n    font-size: 0.95rem;\n    line-height: 1.6;\n    margin: 0 0 var(--sp-lg) 0;\n  }\n\n  .card-pricing {\n    background: var(--color-gray-50);\n    border-left: 3px solid var(--color-gold);\n    padding: var(--sp-md);\n    margin: var(--sp-lg) 0;\n    border-radius: 4px;\n  }\n\n  .pricing-row {\n    display: flex;\n    justify-content: space-between;\n    font-size: 0.9rem;\n    margin-bottom: 8px;\n  }\n\n  .pricing-row:last-child {\n    margin-bottom: 0;\n  }\n\n  .pricing-label {\n    color: var(--color-gray-500);\n    font-weight: 500;\n  }\n\n  .pricing-value {\n    color: var(--color-navy);\n    font-weight: 700;\n    font-family: var(--font-mono);\n  }\n\n  .card-policy {\n    background: rgba(16, 185, 129, 0.05);\n    border-left: 3px solid v
