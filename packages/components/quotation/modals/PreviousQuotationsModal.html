<div class="quotation-modal" x-data="previousQuotationsController">
  <h3>Cotizaciones Previas</h3>
  <input type="text" placeholder="Buscar" @input="search($el.value)" />
  <ul>
    <template x-for="quotation in items" :key="quotation.id">
      <li>
        <button type="button" @click="selectQuotation(quotation.id)" x-text="quotation.id"></button>
      </li>
    </template>
  </ul>
</div>
