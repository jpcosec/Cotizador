<div class="quotation-modal" x-data="clientSelectorController">
  <header>
    <h3>Seleccionar Cliente</h3>
    <button type="button" @click="cancel()">Cerrar</button>
  </header>

  <input type="text" placeholder="Buscar cliente" @input="search($el.value)" />

  <ul>
    <template x-for="client in filteredClients" :key="client.id">
      <li>
        <button type="button" @click="selectClient(client.id)" x-text="client.nombre"></button>
      </li>
    </template>
  </ul>
</div>
