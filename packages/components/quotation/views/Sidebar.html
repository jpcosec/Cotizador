<aside class="quotation-sidebar" x-data="sidebarController">
  <input type="text" placeholder="Buscar item" @input="search($el.value)" />
  <ul>
    <template x-for="item in filteredItems" :key="item.id">
      <li>
        <button type="button" @click="selectItem(item.id)" x-text="item.name || item.nombre"></button>
      </li>
    </template>
  </ul>
</aside>
