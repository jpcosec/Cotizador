<aside class="sidebar">
    <div class="sidebar-header">
        <h1>🏔️ SF Lodge</h1>
        <p>Cotizador</p>
    </div>
    
    <div class="section-content cliente-section">
        <label style="margin-bottom:8px; display:block; color:#1a1a2e; font-weight:700;">
            👤 Cliente
        </label>
        
        <div x-show="!cliente">
            <button class="btn-small btn-primary" @click="modalCliente = true">
                <i class="fa-solid fa-plus"></i> Seleccionar/Crear Cliente
            </button>
        </div>
        
        <div x-show="cliente" style="display:none;">
            <div class="cliente-info">
                <h4 x-text="cliente?.Nombre_Empresa"></h4>
                <p><strong>RUT:</strong> <span x-text="cliente?.RUT"></span></p>
            </div>
            <div class="cliente-actions">
                <button class="btn-small btn-secondary" @click="cambiarCliente()">
                    <i class="fa-solid fa-repeat"></i> Cambiar
                </button>
            </div>
        </div>
    </div>
    
    <div>
        <div class="search-fixed">
            <div class="form-group mb-0">
                <label>🔍 Buscar item</label>
                <input type="text" 
                       x-model="busquedaCatalogo" 
                       placeholder="Escribe para filtrar..."
                       style="background: #f8fafc;">
            </div>
        </div>
        
        <div class="accordion-area">
            <div x-show="cargando" style="padding: 10px; color: #64748b;">Cargando catálogo...</div>
            
            <div x-show="!cargando && Object.keys(catalogoPorCategoria).length === 0" 
                 style="padding: 20px; text-align: center; color: #94a3b8;">
                No se encontraron items con ese nombre.
            </div>

            <template x-for="(items, categoria) in catalogoPorCategoria" :key="categoria">
                <details class="cat-group" :open="busquedaCatalogo.length > 0">
                    <summary class="cat-header">
                        <span x-text="categoria"></span>
                        <span style="font-size: 0.75rem; color: #94a3b8; float: right;" x-text="Array.isArray(items) ? items.length : 0"></span>
                    </summary>
                    <div class="cat-items">
                        <template x-for="item in (Array.isArray(items) ? items : [])" :key="item.ID_Item || item.itemId || item.id || item.Nombre || item.nombre">
                            <div class="mini-card" @click="agregarItem(item)" :title="item.detalle || item.Default_Glosa || item.Comentarios || item.Nombre || item.nombre || ''">
                                <div>
                                    <h5 x-text="item.Nombre || item.nombre || 'Item'"></h5>
                                    <span x-text="'$' + Number(item.Precio_Base ?? item.precio ?? 0).toLocaleString('es-CL')"></span>
                                </div>
                                <i class="fa-solid fa-plus add-icon"></i>
                            </div>
                        </template>
                    </div>
                </details>
            </template>
        </div>
    </div>
</aside>
