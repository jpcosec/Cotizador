<main class="main">
        <div class="config-panel">
        <div class="config-row">
            <h2 style="margin: 0; color: #2d5a27; font-size: 1.1rem;">
                <i class="fa-solid fa-sliders"></i> Configuración
            </h2>
            
            <div style="display: flex; gap: 8px;">
                <button class="btn-small btn-secondary" @click="abrirBrowserCotizaciones()" title="Cargar Cotización Antigua">
                    <i class="fa-solid fa-upload"></i> Cargar
                </button>
                
                <button class="btn-small btn-secondary" @click="guardarCotizacion()" :disabled="carrito.length === 0" title="Guardar en Base de Datos">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar
                </button>

                <button class="btn-small btn-secondary" @click="copiarDiaCompletoAlSiguiente()" :disabled="carritoFiltrado.length === 0" title="Copiar todo el día al siguiente">
                    <i class="fa-solid fa-forward"></i> Copiar Día
                </button>
                
                <button class="btn-small btn-primary" @click="generarPDF()" :disabled="carrito.length === 0">
                    <span x-text="generandoPDF ? '⏳' : '📄 PDF'"></span>
                </button>

                <button class="btn-small btn-secondary" @click="openDatabaseViewer()" title="Ver base de datos">
                    <i class="fa-solid fa-table"></i> Datos
                </button>
            </div>
        </div>
        <div class="config-grid">
            <div class="form-group mb-0">
                <label>📅 Inicio</label>
                <input type="date" x-model="fechaInicio" @change="generarDias(); syncQuotationSettingsToMachine()">
            </div>
            <div class="form-group mb-0">
                <label>Duración</label>
                <input type="number" min="1" step="1" x-model.number="duracionDias" @change="generarDias(); syncQuotationSettingsToMachine()">
            </div>
            <div class="form-group mb-0">
                <label>Pax Global</label>
                <input type="number" min="1" x-model.number="paxGlobal" @change="syncQuotationSettingsToMachine()">
            </div>
        </div>
    </div>

    <div class="tabs-container">
        <template x-for="dia in dias" :key="dia.numero">
            <button class="tab-btn" 
                    :class="{ 'active': diaSeleccionado === dia.numero }"
                    @click="diaSeleccionado = dia.numero">
                <div class="tab-title" x-text="'Día ' + dia.numero"></div>
                <div class="tab-subtitle" x-text="dia.fechaCorta"></div>
            </button>
        </template>
    </div>

    <div class="timeline" style="padding-top: 15px;">
        
        <div x-show="carritoFiltrado.length === 0" class="timeline-empty">
            <i class="fa-solid fa-calendar-plus" style="font-size: 2rem; color: #cbd5e1; margin-bottom: 10px;"></i>
            <p>El Día <span x-text="diaSeleccionado"></span> está vacío.</p>
            <small>Selecciona items del catálogo a la izquierda.</small>
        </div>
        
        <div x-show="carritoFiltrado.length > 0" class="timeline-container">
            <template x-for="(item, index) in (Array.isArray(carritoFiltrado) ? carritoFiltrado : [])" :key="item.lineId || item.id || (item.ID_Item ? item.ID_Item + '_' + index : index)">
                
                <div class="accordion-item" x-data="{ expanded: false }">
                    
                    <div class="accordion-header" @click="expanded = !expanded">
                        
                        <div class="acc-time">
                            <input type="time"
                                   x-model="item.hora"
                                   @click.stop
                                   @change="actualizarHora(carrito.indexOf(item), $event.target.value)"
                                   class="time-input-small"
                                   title="Cambiar hora">
                        </div>
                        
                        <div class="acc-info">
                            <div class="acc-title" x-text="item.nombre || item.Nombre || 'Item'"></div>
                            <div class="acc-subtitle">
                                <span x-text="'$' + Number(item.total ?? 0).toLocaleString('es-CL')"></span>
                                <span style="margin: 0 5px;">•</span>
                                <span x-text="(item.cantidad || 0) + ' pax'"></span>
                            </div>
                        </div>
                        
                        <div class="acc-toggle">
                            <i class="fa-solid" :class="expanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                        </div>
                    </div>
                    
                    <div class="accordion-body" x-show="expanded" x-collapse>
                        <div class="accordion-layout">
                            <div class="accordion-col-left">
                                <div class="control-group">
                                    <label>Pax</label>
                                    <input type="number"
                                           :value="getLinePax(item)"
                                           @change="actualizarCantidad(carrito.indexOf(item), $event.target.value)"
                                           min="1">
                                </div>
                                <div class="control-group">
                                    <label>Unidades</label>
                                    <input type="number"
                                           :value="getLineUnits(item)"
                                           @change="actualizarCantidadUnidades(carrito.indexOf(item), $event.target.value)"
                                           min="0">
                                </div>
                                <div class="control-group">
                                    <label>Duración (min)</label>
                                    <input type="number"
                                           :value="getLineDuration(item)"
                                           @change="actualizarDuracionLinea(carrito.indexOf(item), $event.target.value)"
                                           min="0" step="15">
                                </div>

                                <div class="line-price-box">
                                    <div class="line-price-row"><span>Unitario</span><strong x-text="'$' + Number(item.precio ?? 0).toLocaleString('es-CL')"></strong></div>
                                    <div class="line-price-row"><span>Total</span><strong x-text="'$' + Number(item.total ?? 0).toLocaleString('es-CL')"></strong></div>
                                </div>
                            </div>

                            <div class="accordion-col-middle">
                                <div class="form-group mb-0">
                                    <label>Comentario</label>
                                    <textarea
                                        class="line-comment-input"
                                        :value="item.comentarios || item.Comentarios || ''"
                                        @change="actualizarComentario(carrito.indexOf(item), $event.target.value)"
                                        rows="5"
                                        placeholder="Comentario de la línea (editable y persistible)"></textarea>
                                </div>
                            </div>

                            <div class="accordion-col-actions">
                                <button class="icon-action danger" @click="eliminarItem(carrito.indexOf(item))" title="Eliminar item" aria-label="Eliminar item">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                                <button class="icon-action" @click="copiarItemAlDiaSiguiente(carrito.indexOf(item))" title="Copiar al día siguiente" aria-label="Copiar al día siguiente">
                                    <i class="fa-solid fa-forward-step"></i>
                                </button>
                                <button class="icon-action" @click="duplicarItemEnDia(carrito.indexOf(item))" title="Duplicar en este día" aria-label="Duplicar en este día">
                                    <i class="fa-solid fa-copy"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </template>
        </div>
    </div>
    
    <div class="summary-bar">
        <div style="text-align: right;">
            <div style="font-size: 0.85rem; color: #64748b;">Neto: <span x-text="'$' + totalNeto.toLocaleString('es-CL')"></span></div>
            <div style="font-size: 1.3rem; font-weight: 800; color: var(--primary);">
                Total: <span x-text="'$' + totalFinal.toLocaleString('es-CL')"></span>
            </div>
        </div>
    </div>
</main>
