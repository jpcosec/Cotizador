<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline Layout Proposal</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --card: #fff;
      --line: #dbe3e8;
      --text: #1f2937;
      --muted: #64748b;
      --brand: #2d5a27;
      --brand-soft: #eef6ec;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #edf2f5 0%, #f8fafb 100%);
      padding: 20px;
    }
    .shell { max-width: 860px; margin: 0 auto; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    .btn.icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
    }
    .ico {
      font-size: 13px;
      line-height: 1;
    }
    .ico.up {
      font-size: 13px;
    }
    .btn.brand { background: var(--brand); color: #fff; border-color: #244721; }
    .btn.danger { border-color: #f7c9c9; color: var(--danger); background: #fff7f7; }

    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
      margin-bottom: 10px;
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid #edf2f5;
    }
    .time {
      width: 90px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 6px;
      background: #f8fafc;
    }
    .name { font-weight: 600; }
    .meta { color: var(--muted); font-size: 13px; }

    .card-body {
      display: grid;
      grid-template-columns: 220px 1fr 34px;
      gap: 20px;
      padding: 10px;
      background: #fbfdff;
      align-items: start;
    }
    .col {
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 0;
    }
    .field { margin-bottom: 8px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 13px;
    }
    .field textarea { min-height: 108px; resize: vertical; }

    .price-box {
      margin-top: 8px;
      background: var(--brand-soft);
      border: 1px solid #d6e9d3;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .actions-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      width: 34px;
    }
    .bin {
      align-self: flex-end;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #f3b5b5;
      background: #fff5f5;
      color: var(--danger);
      cursor: pointer;
      font-size: 15px;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    @media (max-width: 880px) {
      .card-body { grid-template-columns: 1fr; }
      .actions-col { flex-direction: row; flex-wrap: wrap; }
      .bin { align-self: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="toolbar">
      <div>
        <strong>Timeline Proposal</strong>
        <div class="hint">Expanded card with 30/50/20 columns + copy actions</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn">Copiar Día Actual -> Siguiente</button>
        <button class="btn brand">Guardar</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <input class="time" type="time" value="19:30">
        <div>
          <div class="name">Cena Sugerencias Chef (Buffet)</div>
          <div class="meta">Día 2 · Arriendo + Alimentación · $1.290.000 · 35 pax</div>
        </div>
      </div>

      <div class="card-body">
        <div class="col">
          <div class="field">
            <label>Pax</label>
            <input type="number" value="35" min="1">
          </div>
          <div class="field">
            <label>Unidades</label>
            <input type="number" value="1" min="0">
          </div>
          <div class="field">
            <label>Duración (min)</label>
            <input type="number" value="120" min="0" step="30">
          </div>
          <div class="price-box">
            <div class="price-row"><span>Precio unitario</span><strong>$36.857</strong></div>
            <div class="price-row"><span>Total línea</span><strong>$1.290.000</strong></div>
          </div>
        </div>

        <div class="col">
          <div class="field" style="margin-bottom:0;">
            <label>Comentario de línea</label>
            <textarea placeholder="Notas operativas, restricciones, montaje, etc.">Cliente solicita opción vegetariana en 8 pax. Confirmar montaje exterior por clima.</textarea>
          </div>
        </div>

        <div class="col actions-col">
          <button class="bin" title="Eliminar">🗑</button>
          <button class="btn icon" title="Copiar al Día Siguiente" aria-label="Copiar al Día Siguiente"><span class="ico up">⏭</span></button>
          <button class="btn icon" title="Duplicar en este Día" aria-label="Duplicar en este Día"><span class="ico">⧉</span></button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
