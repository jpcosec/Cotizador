<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bundle Smoke</title>
</head>
<body>
  <h1>Quotation Engine Bundle Smoke</h1>
  <button id="add">ADD_ITEM ITEM_CHINOOK</button>
  <pre id="out"></pre>

  <script src="../dist/quotation-engine.iife.js"></script>
  <script>
    const out = document.getElementById('out');
    const actor = window.QuotationEngine.createCotizadorActor({
      clienteId: 'CLI_CORP',
      paxGlobal: 25,
      bootstrap: true
    });

    function render() {
      const snap = actor.getSnapshot();
      out.textContent = JSON.stringify({
        state: snap.value,
        lineCount: snap.context.lineas.length,
        totals: snap.context.totals
      }, null, 2);
    }

    document.getElementById('add').addEventListener('click', () => {
      actor.send({ type: 'ADD_ITEM', itemId: 'ITEM_CHINOOK' });
      render();
    });

    render();
  </script>
</body>
</html>
