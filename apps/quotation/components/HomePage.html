<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SF Lodge Quotation System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .home-page-container {
      text-align: center;
      max-width: 900px;
      width: 100%;
    }

    /* Branding Section */
    .branding {
      margin-bottom: 60px;
      color: white;
    }

    .branding h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .branding p {
      font-size: 1.2rem;
      font-weight: 300;
      opacity: 0.85;
      letter-spacing: 1px;
    }

    .branding .divider {
      height: 2px;
      background: linear-gradient(
        to right,
        transparent,
        #d4af37,
        transparent
      );
      margin: 30px 0;
      opacity: 0.6;
    }

    /* Actions Grid */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-top: 50px;
    }

    .action-button {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 30px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      color: white;
      text-decoration: none;
      outline: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      min-height: 280px;
    }

    .action-button:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .action-button:active {
      transform: translateY(-2px);
    }

    /* Gold Button - New Quotation */
    .action-button.gold {
      background: linear-gradient(135deg, #d4af37 0%, #f1c40f 100%);
      color: #1a1a2e;
    }

    .action-button.gold:hover {
      background: linear-gradient(135deg, #e6c200 0%, #ffd700 100%);
    }

    /* Green Button - Load Previous */
    .action-button.green {
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
      color: white;
    }

    .action-button.green:hover {
      background: linear-gradient(135deg, #229954 0%, #28a745 100%);
    }

    /* Blue Button - View Database */
    .action-button.blue {
      background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
      color: white;
    }

    .action-button.blue:hover {
      background: linear-gradient(135deg, #1f618d 0%, #2874a6 100%);
    }

    /* Button Icon */
    .button-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.9;
    }

    /* Button Label */
    .button-label {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* Button Description */
    .button-description {
      font-size: 0.95rem;
      opacity: 0.85;
      font-weight: 400;
      margin-top: 10px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .branding h1 {
        font-size: 2.5rem;
      }

      .branding p {
        font-size: 1rem;
      }

      .actions-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .action-button {
        min-height: 200px;
        padding: 30px 20px;
      }

      .button-icon {
        font-size: 2.5rem;
      }

      .button-label {
        font-size: 1.1rem;
      }
    }

    @media (max-width: 480px) {
      .branding h1 {
        font-size: 2rem;
      }

      .branding p {
        font-size: 0.9rem;
      }

      .action-button {
        padding: 25px 15px;
        min-height: 180px;
      }

      .button-icon {
        font-size: 2rem;
      }

      .button-label {
        font-size: 1rem;
      }

      .button-description {
        font-size: 0.85rem;
      }
    }

    /* Focus State for Accessibility */
    .action-button:focus {
      outline: 3px solid rgba(255, 255, 255, 0.5);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <div class="home-page-container">
    <!-- Branding Section -->
    <section class="branding">
      <h1>SF LODGE</h1>
      <p>QUOTATION SYSTEM</p>
      <div class="divider"></div>
      <p>Professional Event Catering & Management</p>
    </section>

    <!-- Actions Grid -->
    <section class="actions-grid">
      <!-- New Quotation Button -->
      <button
        class="action-button gold"
        id="new-quotation-btn"
        aria-label="Create a new quotation"
      >
        <div class="button-icon">✎</div>
        <div class="button-label">New Quotation</div>
        <div class="button-description">Start creating a new quotation</div>
      </button>

      <!-- Load Previous Button -->
      <button
        class="action-button green"
        id="load-previous-btn"
        aria-label="Load a previously saved quotation"
      >
        <div class="button-icon">⟲</div>
        <div class="button-label">Load Previous</div>
        <div class="button-description">Retrieve a saved quotation</div>
      </button>

      <!-- View Database Button -->
      <button
        class="action-button blue"
        id="view-database-btn"
        aria-label="View the catalog database"
      >
        <div class="button-icon">⊞</div>
        <div class="button-label">View Database</div>
        <div class="button-description">Access the catalog database</div>
      </button>
    </section>
  </div>
</body>
</html>
