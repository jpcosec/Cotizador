<script>
(function() {
  function fallbackComponent(message) {
    return {
      stage: 'error',
      message,
      init() {},
    };
  }

  window.quotationFlowComponent = function quotationFlowComponent() {
    const engine = window.QuotationEngine;
    if (!engine || typeof engine.createQuotationFlowComponent !== 'function') {
      console.error('QuotationEngine bundle not loaded. Run npm run build first.');
      return fallbackComponent('Runtime bundle missing');
    }
    return engine.createQuotationFlowComponent();
  };
})();
</script>
