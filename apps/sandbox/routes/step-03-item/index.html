<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Step 03 Item Standalone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/packages/components/common/styles/claps-global.css" />
  <style>
    .sandbox-shell {
      max-width: none;
      padding: 0;
    }
  </style>
  <!-- Load json-logic-js as a UMD global for use by coordinator -->
  <script src="/node_modules/json-logic-js/logic.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "xstate": "/node_modules/xstate/dist/xstate.esm.js",
      "json-logic-js": "/packages/components/item/domain/rulesEngine/json-logic-esm.js"
    }
  }
  </script>
</head>
<body class="sandbox-page">
  <main class="sandbox-shell">
    <p><a class="btn btn-small btn-secondary" href="/">Back</a></p>
    <main id="app">
      <div class="sandbox-layout" style="display:grid;grid-template-columns:1fr 380px;gap:0;height:100vh;">
        <div id="item-display"></div>
        <div id="resolver-panel" style="border-left:1px solid #e2e8f0;overflow-y:auto;"></div>
      </div>
    </main>
  </main>

  <script type="module">
    import { mountItemStandalone } from '/packages/components/item/logic/createItemStandaloneComponent.js';

    window.addEventListener('DOMContentLoaded', async () => {
      const root = document.getElementById('app');
      await mountItemStandalone(root);
    });
  </script>
</body>
</html>
