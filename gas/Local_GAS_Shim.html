<script>
(function() {
  const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isLocalhost) return;
  if (window.google && window.google.script && window.google.script.run) return;

  const endpoint = String(window.__LOCAL_GAS_ENDPOINT__ || '/api/google-script-run');

  async function invokeLocalServer(method, args) {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ method, args }),
    });

    const result = await response.json();
    if (!response.ok) {
      throw new Error(result?.error?.message || `Local GAS request failed: ${response.status}`);
    }

    return result;
  }

  function makeCaller() {
    let successHandler = null;
    let failureHandler = null;
    let proxy = null;

    function succeed(result) {
      if (successHandler) successHandler(result);
    }

    function fail(error) {
      if (failureHandler) {
        failureHandler({ message: error && error.message ? error.message : String(error) });
      }
    }

    const caller = {
      withSuccessHandler(handler) {
        successHandler = handler;
        return proxy;
      },
      withFailureHandler(handler) {
        failureHandler = handler;
        return proxy;
      },
      healthcheck() {
        invokeLocalServer('healthcheck', []).then(succeed).catch(fail);
        return proxy;
      },
    };

    proxy = new Proxy(caller, {
      get(target, prop) {
        if (prop in target) return target[prop];
        return function(...args) {
          invokeLocalServer(String(prop), args).then(succeed).catch(fail);
          return proxy;
        };
      },
    });

    return proxy;
  }

  const script = {};
  Object.defineProperty(script, 'run', {
    get() {
      return makeCaller();
    },
  });

  window.google = { script };
})();
</script>
