<script>
(function() {
  // Only run on localhost
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    return;
  }

  // Don't override if google.script already exists
  if (window.google && window.google.script) {
    return;
  }

  function makeCaller() {
    var successHandler = null;
    var failureHandler = null;

    return {
      withSuccessHandler: function(h) {
        successHandler = h;
        return this;
      },
      withFailureHandler: function(h) {
        failureHandler = h;
        return this;
      },
      getCatalogo: function() {
        setTimeout(function() {
          if (successHandler) {
            successHandler(window.localCatalogItems || []);
          }
        }, 0);
      },
      getPricingReferenceData: function() {
        setTimeout(function() {
          if (successHandler) {
            successHandler(window.localPricingReferenceData || {
              PERFILES_PRECIO: [],
              CATEGORIAS: [],
              ITEM_CATALOGO: [],
              COMPOSICION_KIT: [],
              REGLAS_NEGOCIO: []
            });
          }
        }, 0);
      },
      buscarCliente: function(query) {
        setTimeout(function() {
          var q = (query || '').toLowerCase();
          var res = (window.localClientes || []).filter(function(c) {
            return c.Nombre_Empresa.toLowerCase().indexOf(q) !== -1;
          });
          if (successHandler) {
            successHandler(res);
          }
        }, 0);
      },
      crearOObtenerCliente: function(data) {
        setTimeout(function() {
          var cli = Object.assign({ ID_Cliente: 'CLI_LOCAL_' + Date.now() }, data);
          if (successHandler) {
            successHandler(cli);
          }
        }, 0);
      },
      guardarCotizacion: function() {
        setTimeout(function() {
          if (successHandler) {
            successHandler({ success: true, id: 'COT_LOCAL_' + Date.now(), mensaje: 'Cotización guardada localmente' });
          }
        }, 0);
      },
      cargarCotizacion: function() {
        setTimeout(function() {
          if (failureHandler) {
            failureHandler({ message: 'cargarCotizacion no implementado en modo local' });
          }
        }, 0);
      },
      generarPDF: function() {
        setTimeout(function() {
          if (failureHandler) {
            failureHandler({ message: 'generarPDF no implementado en modo local' });
          }
        }, 0);
      }
    };
  }

  window.google = {
    script: {
      run: makeCaller()
    }
  };
})();
</script>
