<section class="quotation-shell">
  <template x-if="stage === 'browse' || stage === 'client'">
    <section class="panel home-panel home-stage">
      <div class="home-hero">
        <div class="home-hero-copy">
          <p class="home-eyebrow">SF Lodge quotation workspace</p>
          <h1 class="home-title">Start a new quotation or reopen an existing one with a cleaner front door.</h1>
          <p class="home-lead">Use the client browser to begin a fresh flow, or jump into the quotation browser to continue previous work.</p>
        </div>

        <div class="home-meta-grid">
          <div class="home-meta-card">
            <span class="home-meta-label">Runtime</span>
            <strong x-text="runtimeMode === 'gas' ? 'GAS Preview' : 'Sandbox'"></strong>
          </div>
          <div class="home-meta-card">
            <span class="home-meta-label">Flow</span>
            <strong>Client -> Basket -> Validation</strong>
          </div>
        </div>
      </div>

      <div class="home-action-grid">
        <button class="home-action-card home-action-card-primary" type="button" @click="startQuotation()">
          <span class="home-action-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
          <span class="home-action-body">
            <strong>Start Quotation</strong>
            <span>Create a new quotation and move directly into the working flow.</span>
          </span>
        </button>

        <button class="home-action-card" type="button" @click="openClientModal()">
          <span class="home-action-icon"><i class="fa-solid fa-user-group"></i></span>
          <span class="home-action-body">
            <strong>Select Client</strong>
            <span>Open the client browser to choose who this quotation belongs to.</span>
          </span>
        </button>

        <button class="home-action-card" type="button" @click="openQuotationSearchModal()">
          <span class="home-action-icon"><i class="fa-solid fa-folder-open"></i></span>
          <span class="home-action-body">
            <strong>Buscar cotizacion</strong>
            <span>Open the quotation browser and continue work that already exists.</span>
          </span>
        </button>
      </div>

      <div class="home-utility-row" x-show="databaseEditorEnabled">
        <div>
          <p class="home-section-label">Admin utility</p>
          <p class="muted home-utility-copy">Open the database editor when you need to review or adjust source data.</p>
        </div>
        <button class="btn btn-small btn-secondary"
                type="button"
                @click="openDatabaseEditor()"
                :disabled="!databaseEditorUrl"
                :title="databaseEditorUrl ? 'Open database editor' : 'Database editor is unavailable in this runtime'">
          Edit Database
        </button>
      </div>

      <div class="home-status-grid">
        <div class="home-status-card" x-show="selectedClient">
          <p class="home-section-label">Selected client</p>
          <strong class="home-status-title" x-text="selectedClient?.nombre"></strong>
          <p class="muted home-status-copy">You can start immediately or switch clients before entering the basket.</p>
        </div>

        <div class="home-status-card" x-show="!selectedClient">
          <p class="home-section-label">Suggested next step</p>
          <strong class="home-status-title">Choose a client first</strong>
          <p class="muted home-status-copy">The client browser gives the flow a clear owner before you build the quotation.</p>
        </div>

        <div class="home-status-card home-status-card-muted">
          <p class="home-section-label">What this screen does</p>
          <p class="muted home-status-copy">This home is intentionally limited to entry actions: create, select client, reopen quotation, and admin access.</p>
        </div>
      </div>

      <p class="error-text" x-show="persistence.error" x-text="persistence.error"></p>
    </section>
  </template>

  <template x-if="stage === 'basket'">
    <section class="workspace">
      <?!= include('Sidebar'); ?>
      <?!= include('Timeline'); ?>
    </section>
  </template>

  <template x-if="stage === 'validation'">
    <section class="panel validation-panel">
      <h2>Validation Preview</h2>
      <p class="muted">
        Client: <strong x-text="selectedClient?.nombre || '-' "></strong>
        · Pax: <strong x-text="settings.paxGlobal"></strong>
        · Date: <strong x-text="settings.fechaInicio"></strong>
      </p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Day</th>
              <th>Item</th>
              <th>Pax</th>
              <th>Units</th>
              <th>Hour</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="row in validation.rows" :key="row.entryId">
              <tr>
                <td x-text="'Dia ' + row.dayIndex"></td>
                <td class="validation-item-cell">
                  <div class="validation-item-trigger">
                    <span x-text="row.name"></span>
                    <span class="validation-rule-count" x-show="(row.activeRules || []).length > 0" x-text="(row.activeRules || []).length"></span>
                    <div class="validation-hover-card">
                      <p class="validation-hover-title" x-text="row.name"></p>
                      <p class="validation-hover-description" x-text="row.description || 'Sin descripcion disponible.'"></p>
                      <div class="validation-hover-rules">
                        <p class="validation-hover-label">Active rules</p>
                        <template x-if="(row.activeRules || []).length === 0">
                          <p class="validation-hover-empty">No active rules for this line.</p>
                        </template>
                        <template x-for="rule in (row.activeRules || [])" :key="rule.id">
                          <div class="validation-hover-rule" :class="rule.type === 'ERROR' ? 'is-error' : 'is-warning'">
                            <strong x-text="rule.type"></strong>
                            <span x-text="rule.message"></span>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                </td>
                <td x-text="row.pax"></td>
                <td x-text="row.unidades"></td>
                <td x-text="row.hora"></td>
                <td x-text="'$' + formatMoney(row.total)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <div class="validation-totals">
        <p>Subtotal: <strong>$<span x-text="formatMoney(validation.totals.subtotal)"></span></strong></p>
        <p>IVA: <strong>$<span x-text="formatMoney(validation.totals.iva)"></span></strong></p>
        <p>Total: <strong>$<span x-text="formatMoney(validation.totals.total)"></span></strong></p>
      </div>

      <div class="validation-actions">
        <button class="btn btn-small btn-secondary" @click="backToBasket()">Back To Basket</button>
        <button class="btn btn-small btn-primary" @click="exportToPdf()">Export to PDF</button>
        <button class="btn btn-small btn-primary" @click="exportToExcel()">Export to Excel</button>
        <button class="btn btn-small btn-primary" @click="confirmAndSave()" :disabled="persistence.isSaving || validation.rows.length === 0">
          <span x-show="!persistence.isSaving">Confirm & Save</span>
          <span x-show="persistence.isSaving">Saving...</span>
        </button>
      </div>
      <p class="error-text" x-show="persistence.error" x-text="persistence.error"></p>
    </section>
  </template>

  <template x-if="stage === 'completed'">
    <section class="panel validation-panel">
      <h2>Quotation Saved</h2>
      <p class="muted">
        Quotation ID:
        <strong x-text="persistence.quotationId || '-' "></strong>
      </p>
      <div class="validation-actions">
        <button class="btn btn-small btn-secondary" @click="backToBasket()">Back To Basket</button>
        <button class="btn btn-small btn-secondary" @click="resetToBrowse()">Go Home</button>
        <button class="btn btn-small btn-primary" @click="exportToPdf()">Export to PDF</button>
        <button class="btn btn-small btn-primary" @click="exportToExcel()">Export to Excel</button>
      </div>
      <p class="error-text" x-show="persistence.error" x-text="persistence.error"></p>
    </section>
  </template>

  <?!= include('Modals'); ?>
  <?!= include('QuotationPrintStyles'); ?>
</section>

<?!= include('theme-quotation'); ?>
