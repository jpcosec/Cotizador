<section class="quotation-shell">
  <template x-if="stage === 'browse' || stage === 'client'">
    <section class="panel home-panel">
      <h2>Quotation Flow</h2>
      <p class="muted">Internal flow ready: select client, configure quotation, build basket by days.</p>
      <div class="home-actions">
        <button class="btn btn-small btn-primary" @click="startQuotation()">Start Quotation</button>
        <button class="btn btn-small btn-secondary" @click="openClientModal()">Select Client</button>
      </div>
      <p class="muted" x-show="selectedClient">
        Selected client: <strong x-text="selectedClient?.nombre"></strong>
      </p>
    </section>
  </template>

  <template x-if="stage === 'basket'">
    <section class="workspace">
      <aside class="sidebar panel">
        <section class="global-context-panel" x-data="{ open: true }">
          <button class="global-context-head" @click="open = !open">
            <span class="global-context-title" x-text="selectedClient?.nombre || 'No client selected'"></span>
            <i class="fa-solid fa-chevron-down" :class="open ? 'open' : ''"></i>
          </button>

          <div class="global-context-body" x-show="open" style="display:none;">
            <div class="client-row">
              <h3>Client</h3>
              <button class="btn btn-small btn-secondary" @click="openClientModal()">Change</button>
            </div>
            <template x-if="selectedClient">
              <div>
                <p class="client-name" x-text="selectedClient.nombre"></p>
                <p class="muted" x-text="selectedClient.rut || '-' "></p>
                <p class="muted" x-text="selectedClient.email || '-' "></p>
              </div>
            </template>
            <template x-if="!selectedClient">
              <p class="muted">No client selected.</p>
            </template>

            <h3>Quotation Settings</h3>
            <div class="config-grid">
              <label>
                <span>Start Date</span>
                <input type="date" :value="settings.fechaInicio" @change="setSetting('fechaInicio', $event.target.value)" />
              </label>
              <label>
                <span>Days</span>
                <input type="number" min="1" :value="settings.duracionDias" @change="setSetting('duracionDias', $event.target.value)" />
              </label>
              <label>
                <span>Pax Global</span>
                <input type="number" min="1" :value="settings.paxGlobal" @change="setSetting('paxGlobal', $event.target.value)" />
              </label>
            </div>
            <div class="settings-actions">
              <button class="btn btn-small btn-secondary" @click="copyDayToNextDay()">Copy Day</button>
              <button class="btn btn-small btn-primary" @click="goValidation()" :disabled="basket.basketEntries.length === 0">Validate</button>
            </div>
          </div>
        </section>

        <section class="catalog-panel">
          <div class="catalog-header">
            <h3>Catalog</h3>
            <input
              type="text"
              placeholder="Search category or item"
              :value="catalog.searchTerm"
              @input="setCatalogSearch($event.target.value)"
            />
          </div>
          <p class="catalog-hint" x-show="draggingCatalogItemId">Drop an item on day tabs or timeline</p>
          <div class="categories-list">
            <template x-for="category in catalog.categories" :key="category.id">
              <article class="category-card">
                <button class="category-head" @click="toggleCategory(category.id)">
                  <span class="category-name" x-text="category.nombre"></span>
                  <i class="fa-solid fa-chevron-down" :class="category.isExpanded ? 'open' : ''"></i>
                </button>
                <div class="category-body" x-show="category.isExpanded" style="display:none;">
                  <template x-if="!category.isLoaded">
                    <p class="muted">Loading...</p>
                  </template>
                  <div x-show="category.isLoaded" x-data="{ get catalogEntries() { return category.catalogEntries || []; } }">
                    
          <template x-if="catalogEntries.length === 0">
            <p class="empty">No catalog entities yet</p>
          </template>
          <template x-for="entry in catalogEntries" :key="entry.id">
            <div class="entity-wrap">
              <article class="mini-card runtime-card catalog-card"
                       :class="(typeof isDraggingCatalogItem === 'function' && isDraggingCatalogItem(entry.state.definition?.id || entry.itemId || entry.state.definition?.ID_Item)) ? 'is-dragging' : ''"
                       :draggable="typeof startCatalogDrag === 'function'"
                       @dragstart="typeof startCatalogDrag === 'function' && startCatalogDrag(entry.state.definition?.id || entry.itemId || entry.state.definition?.ID_Item, $event)"
                       @dragend="typeof endCatalogDrag === 'function' && endCatalogDrag()"
                       x-data="{ showGlosa: false, rulesHover: false }"
                       @mouseenter="showGlosa = true"
                       @mouseleave="showGlosa = false; rulesHover = false">
                <div class="mini-main">
                  <span class="category-badge" x-text="entry.state.definition?.category || 'Sin categoria'"></span>
                  <h5 x-text="entry.state.definition?.name || 'Item'"></h5>
                  <p class="catalog-formula" x-text="entry.state.catalogFormulaHuman || '-' "></p>
                  <div class="glosa-popover"
                       x-show="showGlosa && !rulesHover && (entry.state.definition?.description || '').trim().length > 0"
                       style="display:none;"
                       x-text="entry.state.definition?.description">
                  </div>
                </div>
                <div class="card-actions">
                  <div class="rules-indicator" x-data="{ open: false }" @mouseenter="open = true; rulesHover = true" @mouseleave="open = false; rulesHover = false">
                    <div class="rules-dot" :class="'dot-' + ruleClass(entry.state)">
                      <i class="fa-solid fa-xs" :class="ruleIcon(entry.state)"></i>
                    </div>
                    <div class="rules-popover" x-show="open" style="display:none;">
                      <div class="popover-header">Rules (<span x-text="(entry.state.definition?.rules || []).length"></span>)</div>
                      <template x-if="(entry.state.definition?.rules || []).length === 0">
                        <div class="popover-empty">No rules</div>
                      </template>
                      <template x-for="rule in (entry.state.definition?.rules || [])" :key="rule.ID_Regla">
                        <div class="popover-rule-row"
                             :class="(entry.state.appliedRules || []).some(r => r.id === rule.ID_Regla) ? (rule.Tipo_Accion === 'ERROR' ? 'row-error' : 'row-warn') : ''">
                          <i class="fa-solid fa-xs"
                             :class="(entry.state.appliedRules || []).some(r => r.id === rule.ID_Regla) ? (rule.Tipo_Accion === 'ERROR' ? 'fa-circle-xmark' : 'fa-triangle-exclamation') : 'fa-circle'"></i>
                          <span x-text="rule.Nombre"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                  <button class="icon-action"
                          x-show="typeof shipCatalogEntry === 'function'"
                          @click.stop="shipCatalogEntry(entry.state.definition?.id || entry.itemId || entry.state.definition?.ID_Item)"
                          title="Ship to basket"
                          aria-label="Ship to basket">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                </div>
              </article>
            </div>
          </template>

                  </div>
                </div>
              </article>
            </template>
          </div>
        </section>
      </aside>

      <main class="main panel">
        <header class="timeline-header">
          <span class="timeline-title">
            <i class="fa-regular fa-calendar"></i>
            Day <span x-text="basket.selectedDayIndex"></span>
            <span x-show="settings.fechaInicio">· <span x-text="settings.fechaInicio"></span></span>
          </span>
          <span class="timeline-hint" x-show="!draggingCatalogItemId && basket.basketEntries.length === 0">
            Drag items from catalog into this timeline
          </span>
          <span class="timeline-hint" x-show="draggingCatalogItemId">
            Dropping on a day tab ships directly to that day
          </span>
        </header>

        <section class="day-tabs">
          <template x-for="day in basket.dayOptions" :key="day.dayIndex">
            <button
              class="day-tab"
              :class="basket.selectedDayIndex === day.dayIndex ? 'active' : ''"
              @click="selectDay(day.dayIndex)"
              @dragover.prevent
              @drop.prevent="dropOnDay(day.dayIndex, $event)"
            >
              <strong x-text="day.label"></strong>
            </button>
          </template>
        </section>

        <section class="basket-list"
                 :class="draggingCatalogItemId ? 'drop-active' : ''"
                 @dragover.prevent
                 @drop.prevent="dropOnSelectedDay($event)"
                 x-data="{ get basketEntries() { return basket.basketEntries || []; } }">
          
          <template x-if="basketEntries.length === 0">
            <p class="empty">No basket entities yet</p>
          </template>
          <template x-for="entry in basketEntries" :key="entry.id">
            <article class="accordion-item runtime-card basket-card" x-data="{ expanded: true }">
              <div class="accordion-header" @click="expanded = !expanded">
                <div class="acc-time" x-show="entry.state.showHora">
                  <input
                    type="time"
                    :value="entry.state.overrides?.hora || entry.state.schedule?.hora || globalContext.hora || '09:00'"
                    @click.stop
                    @change="setBasketOverride(entry.id, 'hora', $event.target.value)"
                    class="time-input-small"
                  >
                </div>
                <div class="acc-info">
                  <div class="acc-title" x-text="entry.state.definition?.name || 'Item'"></div>
                  <div class="acc-subtitle" x-text="entry.state.basketLegend || '-' "></div>
                </div>
                <div class="rules-indicator" x-data="{ open: false }" @mouseenter="open = true" @mouseleave="open = false" @click.stop>
                  <div class="rules-dot" :class="'dot-' + ruleClass(entry.state)">
                    <i class="fa-solid fa-xs" :class="ruleIcon(entry.state)"></i>
                  </div>
                  <div class="rules-popover rules-popover-right" x-show="open" style="display:none;">
                    <div class="popover-header">Rules (<span x-text="(entry.state.definition?.rules || []).length"></span>)</div>
                    <template x-if="(entry.state.definition?.rules || []).length === 0">
                      <div class="popover-empty">No rules</div>
                    </template>
                    <template x-for="rule in (entry.state.definition?.rules || [])" :key="rule.ID_Regla">
                      <div class="popover-rule-row"
                           :class="(entry.state.appliedRules || []).some(r => r.id === rule.ID_Regla) ? (rule.Tipo_Accion === 'ERROR' ? 'row-error' : 'row-warn') : ''">
                        <i class="fa-solid fa-xs"
                           :class="(entry.state.appliedRules || []).some(r => r.id === rule.ID_Regla) ? (rule.Tipo_Accion === 'ERROR' ? 'fa-circle-xmark' : 'fa-triangle-exclamation') : 'fa-circle'"></i>
                        <span x-text="rule.Nombre"></span>
                      </div>
                    </template>
                  </div>
                </div>
                <div class="acc-total-pill">
                  $<span x-text="formatMoney(entry.state.total)"></span>
                </div>
                <div class="acc-toggle">
                  <i class="fa-solid" :class="expanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                </div>
              </div>

              <div class="accordion-body" x-show="expanded">
                <div class="accordion-layout">
                  <div class="accordion-col-left">
                    <div class="control-group" x-show="entry.state.showPaxControl" :class="entry.state.isUserSetPax ? 'field-user-set' : ''">
                      <label>Pax <span class="manual-badge" x-show="entry.state.isUserSetPax">manual</span></label>
                      <input type="number" :value="entry.state.quantities?.pax || 0" @change="setBasketOverride(entry.id, 'pax', $event.target.value)" min="0">
                    </div>
                    <div class="control-group" x-show="entry.state.showUnitsControl" :class="entry.state.isUserSetCantidad ? 'field-user-set' : ''">
                      <label>Unidades <span class="manual-badge" x-show="entry.state.isUserSetCantidad">manual</span></label>
                      <input type="number" :value="entry.state.quantities?.cantidad || 0" @change="setBasketOverride(entry.id, 'cantidad', $event.target.value)" min="0">
                    </div>
                    <div class="control-group" x-show="entry.state.showTimeControl" :class="entry.state.isUserSetDuracion ? 'field-user-set' : ''">
                      <label>Duracion (min) <span class="manual-badge" x-show="entry.state.isUserSetDuracion">manual</span></label>
                      <input type="number" :value="entry.state.quantities?.duracionMin || 0" @change="setBasketOverride(entry.id, 'duracionMin', $event.target.value)" min="0" step="15">
                    </div>

                    <div class="line-price-box">
                      <div class="line-price-row" x-show="Number(entry.state.lineRateValue || 0) > 0">
                        <span x-text="entry.state.lineRateLabel || 'Fijo'"></span>
                        <strong x-text="'$' + formatMoney(entry.state.lineRateValue)"></strong>
                      </div>
                      <div class="line-price-row" x-show="(entry.state.lineBaseValue || 0) > 0">
                        <span>Base fija</span>
                        <strong x-text="'$' + formatMoney(entry.state.lineBaseValue)"></strong>
                      </div>
                      <div class="line-price-row total-row">
                        <span>Total</span>
                        <strong x-text="'$' + formatMoney(entry.state.total)"></strong>
                      </div>
                    </div>
                  </div>

                  <div class="accordion-col-middle">
                    <div class="field">
                      <label>Comentario</label>
                      <textarea
                        rows="5"
                        :value="('comentarios' in (entry.state.overrides || {})) ? entry.state.overrides.comentarios : (entry.state.definition?.description || '')"
                        @change="setBasketOverride(entry.id, 'comentarios', $event.target.value)"
                        placeholder="Comentario de la linea..."
                      ></textarea>
                    </div>
                  </div>

                  <div class="accordion-col-actions">
                    <button class="icon-action" title="Reset overrides" aria-label="Reset overrides" @click="resetBasketOverrides(entry.id)"><i class="fa-solid fa-rotate-left"></i></button>
                    <button class="icon-action" title="Copy" @click="typeof copyBasketEntry === 'function' && copyBasketEntry(entry.id)"><i class="fa-solid fa-forward-step"></i></button>
                    <button class="icon-action" title="Duplicate" @click="typeof duplicateBasketEntry === 'function' && duplicateBasketEntry(entry.id)"><i class="fa-solid fa-copy"></i></button>
                    <button class="icon-action danger" title="Remove" aria-label="Remove" @click="destroyRuntimeEntry('basket', entry.id)"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </div>
              </div>
            </article>
          </template>

        </section>

        <footer class="summary-row">
          <div>
            <p class="muted">Entries: <strong x-text="basket.summary.totalEntries || 0"></strong></p>
          </div>
          <div>
            <p class="muted">Subtotal: <strong>$<span x-text="formatMoney(validation.totals.subtotal)"></span></strong></p>
            <p class="total">Total: $<span x-text="formatMoney(validation.totals.total)"></span></p>
          </div>
        </footer>
      </main>
    </section>
  </template>

  <template x-if="stage === 'validation'">
    <section class="panel validation-panel">
      <h2>Validation Preview</h2>
      <p class="muted">
        Client: <strong x-text="selectedClient?.nombre || '-' "></strong>
        · Pax: <strong x-text="settings.paxGlobal"></strong>
        · Date: <strong x-text="settings.fechaInicio"></strong>
      </p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Day</th>
              <th>Item</th>
              <th>Pax</th>
              <th>Units</th>
              <th>Hour</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="row in validation.rows" :key="row.entryId">
              <tr>
                <td x-text="'Dia ' + row.dayIndex"></td>
                <td x-text="row.name"></td>
                <td x-text="row.pax"></td>
                <td x-text="row.unidades"></td>
                <td x-text="row.hora"></td>
                <td x-text="'$' + formatMoney(row.total)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <div class="validation-totals">
        <p>Subtotal: <strong>$<span x-text="formatMoney(validation.totals.subtotal)"></span></strong></p>
        <p>IVA: <strong>$<span x-text="formatMoney(validation.totals.iva)"></span></strong></p>
        <p>Total: <strong>$<span x-text="formatMoney(validation.totals.total)"></span></strong></p>
      </div>

      <div class="validation-actions">
        <button class="btn btn-small btn-secondary" @click="backToBasket()">Back To Basket</button>
        <button class="btn btn-small btn-primary" disabled>Confirm (deferred)</button>
      </div>
    </section>
  </template>

  <div class="modal-overlay" x-show="clientModalOpen" style="display:none;">
    <div class="modal panel" @click.away="closeClientModal()">
      <div class="modal-head">
        <h3>Select Client</h3>
        <button class="btn btn-small btn-secondary" @click="closeClientModal()">Close</button>
      </div>
      <input
        type="text"
        placeholder="Search by name/rut/email"
        :value="clientSearchTerm"
        @input="setClientSearch($event.target.value)"
      />
      <div class="client-list">
        <template x-for="client in filteredClients()" :key="client.id">
          <button class="client-item" @click="selectClient(client.id)">
            <strong x-text="client.nombre"></strong>
            <small x-text="(client.rut || '-') + ' · ' + (client.email || '-')"></small>
          </button>
        </template>
      </div>
    </div>
  </div>
</section>

<style>
  :root {
    --primary: #2d5a27;
    --primary-mid: #3d7a35;
    --primary-bg: #edf5eb;
    --border: #e2e8f0;
    --border-dark: #cbd5e1;
    --bg: #f8fafc;
    --bg-cell: #ffffff;
    --bg-row-alt: #f8fafc;
    --text: #1e293b;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    --mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .quotation-shell {
    padding: 14px;
    max-width: 1500px;
    margin: 0 auto;
    font-family: var(--sans);
    font-size: 14px;
  }
  .panel { background: var(--bg-cell); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .muted { color: var(--text-muted); font-size: 0.81rem; }
  h2, h3 { margin: 0 0 10px; color: var(--text); font-size: 1rem; }

  .home-panel { max-width: 720px; margin: 30px auto; display: grid; gap: 10px; }
  .home-actions { display: flex; gap: 8px; }

  .workspace { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 12px; }
  .sidebar {
    display: grid;
    gap: 10px;
    align-content: start;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .global-context-panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    overflow: hidden;
  }
  .global-context-head {
    width: 100%;
    border: 0;
    background: var(--bg-row-alt);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    cursor: pointer;
    color: var(--text);
  }
  .global-context-title {
    font-size: 0.84rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .global-context-head i {
    font-size: 0.75rem;
    color: var(--text-muted);
    transition: transform 0.2s;
  }
  .global-context-head i.open { transform: rotate(180deg); }
  .global-context-body {
    padding: 10px;
    display: grid;
    gap: 8px;
  }
  .client-row { display: flex; justify-content: space-between; align-items: center; }
  .client-name { margin: 0; font-weight: 700; color: var(--text); font-size: 0.92rem; }

  .catalog-panel { min-height: 0; display: grid; gap: 8px; }
  .catalog-header h3 {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    margin-bottom: 7px;
  }
  .catalog-header input {
    width: 100%;
    border: 1px solid var(--border-dark);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 0.82rem;
    background: var(--bg-cell);
    color: var(--text);
  }
  .catalog-hint {
    font-size: 0.68rem;
    color: var(--text-faint);
    font-style: italic;
    font-family: var(--mono);
  }
  .categories-list { display: grid; gap: 8px; }
  .category-card { border: 1px solid var(--border); border-radius: 8px; overflow: visible; }
  .category-head { width: 100%; border: 0; background: var(--bg-row-alt); display: flex; justify-content: space-between; padding: 8px 10px; cursor: pointer; }
  .category-name { font-weight: 700; color: var(--text); font-size: 0.8rem; }
  .category-head i { transition: transform 0.2s; }
  .category-head i.open { transform: rotate(180deg); }
  .category-body { padding: 8px; border-top: 1px solid var(--border); }

  .main {
    display: grid;
    gap: 10px;
    align-content: start;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .timeline-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border-dark);
    border-radius: 8px;
    background: var(--bg-cell);
    flex-shrink: 0;
  }
  .timeline-title {
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    flex: 1;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .timeline-hint {
    font-family: var(--sans);
    font-size: 0.72rem;
    color: var(--text-faint);
    font-style: italic;
  }
  .config-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .config-grid label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.66rem;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    font-weight: 500;
  }
  input, select, textarea {
    border: 1px solid var(--border-dark);
    border-radius: 6px;
    padding: 7px 9px;
    font: inherit;
    font-size: 0.8rem;
    color: var(--text);
    background: var(--bg-cell);
  }
  .settings-actions { display: flex; justify-content: flex-end; gap: 8px; }

  .day-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .day-tab {
    border: 1px solid var(--border-dark);
    border-radius: 8px;
    background: var(--bg-row-alt);
    padding: 5px 9px;
    cursor: pointer;
    font-size: 0.76rem;
    font-family: var(--mono);
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
  }
  .day-tab.active {
    border-color: var(--primary-mid);
    background: var(--primary-bg);
    color: var(--primary);
  }
  .day-tab:hover {
    border-color: var(--primary-mid);
  }

  .basket-list {
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    background: var(--bg);
    transition: border-color 0.15s, background 0.15s;
  }
  .basket-list.drop-active {
    border-color: var(--primary-mid);
