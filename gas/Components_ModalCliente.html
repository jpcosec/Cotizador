<template x-teleport="body">
    <div class="modal-overlay"
         x-show="modalCliente"
         x-transition.opacity>

        <div class="modal modal-lg" @click.away="cerrarModalCliente()">
            <div class="modal-header-row">
                <h3 style="margin: 0;">Seleccionar Cliente</h3>
                <button class="btn-small btn-secondary" @click="cerrarModalCliente()">Cerrar</button>
            </div>

            <div class="form-group">
                <label>Buscar por nombre, RUT o email</label>
                <input
                    type="text"
                    x-model="busquedaCliente"
                    @input.debounce.250ms="buscarClientes()"
                    @keydown.arrow-down.prevent="moveClientSelection(1)"
                    @keydown.arrow-up.prevent="moveClientSelection(-1)"
                    @keydown.enter.prevent="selectHighlightedClient()"
                    placeholder="Ej: Empresa SPA, 76.123.456-7 o contacto@empresa.cl"
                >
                <small style="color: var(--secondary);" x-show="busquedaCliente.length < 2">Escribe al menos 2 caracteres.</small>
                <small style="color: var(--secondary);" x-show="busquedaCliente.length >= 2">
                    <span x-text="filteredClientes.length"></span> resultados.
                </small>
            </div>

            <div class="modal-two-col">
                <div class="client-results-list">
                    <template x-for="(cli, idx) in filteredClientes" :key="cli.ID_Cliente || cli.RUT || cli.Nombre_Empresa || idx">
                        <button
                            class="client-result-row"
                            :class="{ 'active': idx === focusClientIndex }"
                            @mouseenter="focusClientIndex = idx"
                            @click="seleccionarCliente(cli)">
                            <strong x-text="cli.Nombre_Empresa || cli.nombre || 'Cliente'"></strong>
                            <small>
                                <span x-text="cli.RUT || cli.rut || '-' "></span>
                                ·
                                <span x-text="cli.Email || cli.email || 'Sin email'"></span>
                            </small>
                        </button>
                    </template>
                    <div x-show="filteredClientes.length === 0 && busquedaCliente.length >= 2" style="padding: 12px; color: var(--secondary);">
                        No se encontraron clientes.
                    </div>
                </div>

                <div class="client-preview-card">
                    <h4 style="margin: 0 0 8px 0;">Vista previa</h4>
                    <template x-if="highlightedClient">
                        <div>
                            <div><strong x-text="highlightedClient.Nombre_Empresa || highlightedClient.nombre || '-' "></strong></div>
                            <div><strong>RUT:</strong> <span x-text="highlightedClient.RUT || highlightedClient.rut || '-' "></span></div>
                            <div><strong>Email:</strong> <span x-text="highlightedClient.Email || highlightedClient.email || '-' "></span></div>
                            <div><strong>Tel:</strong> <span x-text="highlightedClient.Telefono || highlightedClient.telefono || '-' "></span></div>
                        </div>
                    </template>
                    <template x-if="!highlightedClient">
                        <div style="color: var(--secondary);">Selecciona un cliente para revisar su detalle.</div>
                    </template>
                </div>
            </div>

            <details class="inline-toggle" style="margin-top: 16px;">
                <summary>Crear cliente nuevo</summary>
                <div style="margin-top: 10px;">
                    <div class="form-group">
                        <label>Nombre Empresa *</label>
                        <input type="text" x-model="nuevoCliente.nombre" placeholder="Ej: Empresa SPA">
                    </div>
                    <div class="form-group">
                        <label>RUT *</label>
                        <input type="text" x-model="nuevoCliente.rut" placeholder="76.123.456-7">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" x-model="nuevoCliente.email" placeholder="contacto@empresa.cl">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" x-model="nuevoCliente.telefono" placeholder="+569...">
                    </div>
                    <div class="form-group">
                        <label>Nombre Contacto</label>
                        <input type="text" x-model="nuevoCliente.contacto" placeholder="Persona a cargo">
                    </div>
                    <div style="text-align: right;">
                        <button class="btn-small btn-primary" @click="crearCliente()">Guardar y Usar</button>
                    </div>
                </div>
            </details>

            <div class="modal-footer-row">
                <button class="btn-small btn-secondary" @click="cerrarModalCliente()">Cancelar</button>
                <button class="btn-small btn-primary" @click="selectHighlightedClient()" :disabled="!highlightedClient">Usar Selección</button>
            </div>
        </div>
    </div>
</template>
