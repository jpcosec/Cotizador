<style>
    /* =========================================
       RESET & BASE
       ========================================= */
    :root {
        --primary: #2d5a27;      /* Verde Bosque */
        --primary-light: #e6f0e4;
        --secondary: #64748b;    /* Gris Azulado */
        --accent: #d97706;       /* Ámbar */
        --bg-light: #f8fafc;
        --border: #e2e8f0;
        --text: #1e293b;
        --sidebar-width: 350px;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        color: var(--text);
        background: #f1f5f9;
        height: 100vh;
        overflow: hidden;
    }

    [x-cloak] { display: none !important; }

    /* =========================================
       LAYOUT PRINCIPAL
       ========================================= */
    .container {
        display: flex;
        height: 100vh;
        width: 100vw;
    }

    /* =========================================
       SIDEBAR (Izquierda) - ¡ESTOS ERAN LOS QUE FALTABAN!
       ========================================= */
    .sidebar {
        width: var(--sidebar-width);
        background: white;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        z-index: 10;
        box-shadow: 2px 0 5px rgba(0,0,0,0.05);
    }

    .sidebar-header {
        padding: 20px;
        background: var(--primary);
        color: white;
    }
    .sidebar-header h1 { margin: 0; font-size: 1.2rem; }
    .sidebar-header p { margin: 0; opacity: 0.8; font-size: 0.8rem; }

    /* El último div del sidebar ocupa el resto del espacio */
    .sidebar > div:last-child {
        overflow-y: auto;
        flex: 1;
        padding-bottom: 50px;
    }

    .section-content {
        padding: 15px;
        border-bottom: 1px solid var(--border);
    }

    .cliente-section {
        background: var(--primary-light);
        border-bottom: 1px solid #bfdbbe;
    }

    /* =========================================
       MAIN / TIMELINE (Derecha)
       ========================================= */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        overflow: hidden;
        position: relative;
    }

    /* Panel de Configuración Superior (Nuevo) */
    .config-panel {
        background: white;
        padding: 15px 20px;
        border-bottom: 1px solid var(--border);
    }
    .config-row {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .config-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .mb-0 { margin-bottom: 0 !important; }

    /* Tabs de Días (Nuevo) */
    .tabs-container {
        display: flex;
        overflow-x: auto;
        background: #f1f5f9;
        padding: 0;
        border-bottom: 1px solid var(--border);
        scrollbar-width: none; /* Firefox */
    }
    .tabs-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    .tab-btn {
        flex: 1;
        min-width: 90px;
        padding: 10px 5px;
        background: #f1f5f9;
        border: none;
        border-right: 1px solid #e2e8f0;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
    }
    .tab-btn:hover { background: #e2e8f0; }
    
    .tab-btn.active {
        background: white;
        border-bottom-color: var(--primary);
        color: var(--primary);
    }
    .tab-title { font-weight: 700; font-size: 0.9rem; }
    .tab-subtitle { font-size: 0.75rem; opacity: 0.7; }

    /* Barra de contexto del día */
    .day-context-bar {
        background: #fffbe6;
        border: 1px solid #ffe58f;
        border-radius: 6px;
        padding: 8px 15px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .time-input-small {
        padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.9rem;
    }

    /* Área del Timeline */
    .timeline {
        flex: 1;
        overflow-y: auto;
        padding: 15px 30px;
        position: relative;
    }

    .timeline-empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--secondary);
    }

    /* Acordeones de Items */
.accordion-item {
        background: white;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 10px;
        overflow: hidden;
        transition: box-shadow 0.2s;
    }
    .accordion-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    .accordion-header {
        display: flex;
        align-items: center;
        padding: 8px 12px; /* Reducido un poco el padding vertical para ajustar mejor el input */
        cursor: pointer;
        background: white;
    }
    .accordion-header:hover { background: #fafafa; }

    /* CAMBIO PRINCIPAL AQUÍ */
    .acc-time {
        margin-right: 12px;
        width: auto; /* Dejar que el input defina el ancho */
        flex-shrink: 0;
    }
    
    /* El estilo del input pequeño dentro del header */
    .time-input-small {
        padding: 5px; 
        border: 1px solid #cbd5e1; 
        border-radius: 4px; 
        font-size: 0.85rem;
        background: #f8fafc;
        color: var(--text);
        cursor: text;
        width: 85px; /* Ancho fijo suficiente para la hora */
    }
    .time-input-small:focus {
        outline: 2px solid var(--primary-light);
        border-color: var(--primary);
        background: white;
    }

    .acc-info { flex: 1; }
    .acc-title { font-weight: 600; color: var(--text); font-size: 0.95rem; }
    .acc-subtitle { font-size: 0.8rem; color: var(--secondary); margin-top: 2px; }
    .acc-toggle { color: #cbd5e1; font-size: 0.9rem; }
    .accordion-body {
        background: #f8fafc;
        border-top: 1px solid var(--border);
        padding: 12px;
    }

    .accordion-layout {
        display: grid;
        grid-template-columns: 220px 1fr 34px;
        gap: 18px;
        align-items: start;
    }
    .accordion-col-left,
    .accordion-col-middle,
    .accordion-col-actions {
        background: transparent;
        border: none;
        padding: 0;
    }
    .accordion-col-left {
        display: grid;
        gap: 8px;
    }
    .accordion-col-middle {
        min-width: 0;
    }
    .accordion-col-actions {
        width: 34px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
    }
    .control-group { width: 100%; }
    .control-group label { display: block; font-size: 0.75rem; color: var(--secondary); margin-bottom: 3px; }
    .control-group input { width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; }

    .line-price-box {
        margin-top: 2px;
        background: var(--primary-light);
        border: 1px solid #bfdbbe;
        border-radius: 8px;
        padding: 7px 8px;
    }
    .line-price-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.78rem;
        color: var(--secondary);
        margin-bottom: 2px;
    }
    .line-price-row strong {
        color: var(--text);
        font-size: 0.83rem;
    }

    .line-comment-input {
        width: 100%;
        min-height: 108px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 8px;
        font-size: 0.9rem;
        resize: vertical;
    }

    .icon-action {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid #d6dee6;
        background: white;
        color: var(--secondary);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
    }
    .icon-action:hover {
        background: #f1f5f9;
    }
    .icon-action.danger {
        border-color: #fecaca;
        color: #ef4444;
        background: #fff5f5;
    }
    .icon-action.danger:hover { background: #fee2e2; }

    @media (max-width: 980px) {
        .accordion-layout {
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .accordion-col-actions {
            width: auto;
            flex-direction: row;
            justify-content: flex-end;
        }
    }

    /* Barra de totales flotante abajo */
    .summary-bar {
        background: white;
        border-top: 1px solid var(--border);
        padding: 15px 30px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        z-index: 20;
    }

    /* =========================================
       COMPONENTES UI GLOBALES
       ========================================= */
    
    .btn, .btn-small {
        border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
        display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .btn { padding: 10px 20px; font-size: 1rem; background: var(--primary); color: white; }
    .btn:hover { background: #1e3a1a; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

    .btn-small { padding: 6px 12px; font-size: 0.85rem; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: white; border: 1px solid #cbd5e1; color: var(--text); }
    .btn-secondary:hover { background: #f1f5f9; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--secondary); margin-bottom: 4px; }
    .form-group input, .form-group select {
        width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.95rem;
    }

    /* Acordeón del Catálogo (Sidebar) */
    .search-fixed {
        padding: 15px; border-bottom: 1px solid var(--border); background: white;
    }
    .accordion-area { margin-top: 15px; padding: 0 15px; }
    .cat-group { margin-bottom: 5px; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; }
    .cat-header {
        background: #f8fafc; padding: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
    }
    .cat-items { padding: 0; background: white; }
    
    .mini-card {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
    }
    .mini-card:hover { background: var(--primary-light); }
    .mini-card h5 { margin: 0; font-size: 0.9rem; color: var(--text); }
    .mini-card span { font-size: 0.8rem; color: var(--secondary); }
    .add-icon { color: var(--primary); opacity: 0; }
    .mini-card:hover .add-icon { opacity: 1; }

    /* Modal (Fallback) */
    .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .modal {
        background: white; border-radius: 8px; width: 100%; max-width: 500px;
        padding: 20px;
        box-shadow: 0 20px 25px rgba(0,0,0,0.1);
    }

    .modal-lg { max-width: 860px; max-height: 90vh; overflow: auto; }
    .modal-xl { max-width: 1120px; max-height: 90vh; overflow: auto; }
    .modal-header-row, .modal-footer-row {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .modal-header-row { margin-bottom: 12px; }
    .modal-footer-row { margin-top: 12px; }
    .modal-two-col {
        display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px;
    }
    .client-results-list {
        border: 1px solid var(--border);
        border-radius: 8px;
        max-height: 280px;
        overflow-y: auto;
    }
    .client-result-row {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid #edf2f7;
        background: white;
        padding: 9px 10px;
        cursor: pointer;
    }
    .client-result-row:hover,
    .client-result-row.active {
        background: #f2f8f1;
    }
    .client-result-row strong {
        display: block;
        font-size: 0.9rem;
        color: var(--text);
    }
    .client-result-row small {
        font-size: 0.78rem;
        color: var(--secondary);
    }
    .client-preview-card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f8fafc;
        padding: 10px;
        font-size: 0.9rem;
    }
    .inline-toggle {
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
        padding: 10px;
    }
    .inline-toggle summary {
        cursor: pointer;
        font-weight: 600;
    }
    .modal-filters-grid {
        display: grid;
        grid-template-columns: 1.7fr 1fr 1fr;
        gap: 8px;
    }
    .quotations-table-wrap {
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        max-height: 430px;
        overflow: auto;
    }
    .quotations-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
    }
    .quotations-table th,
    .quotations-table td {
        padding: 8px;
        border-bottom: 1px solid #edf2f7;
        text-align: left;
        background: white;
    }
    .quotations-table th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f8fafc;
    }
    .quotations-table .row-selected td {
        background: #edf7ec;
    }

    @media (max-width: 900px) {
        .modal-two-col,
        .modal-filters-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
