<main class="main">
        <div class="config-panel">
        <div class="config-row">
            <h2 style="margin: 0; color: #2d5a27; font-size: 1.1rem;">
                <i class="fa-solid fa-sliders"></i> Configuración
            </h2>
            
            <div style="display: flex; gap: 8px;">
                <button class="btn-small btn-secondary" @click="cargarCotizacion()" title="Cargar Cotización Antigua">
                    <i class="fa-solid fa-upload"></i> Cargar
                </button>
                
                <button class="btn-small btn-secondary" @click="guardarCotizacion()" :disabled="carrito.length === 0" title="Guardar en Base de Datos">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar
                </button>
                
                <button class="btn-small btn-primary" @click="generarPDF()" :disabled="carrito.length === 0">
                    <span x-text="generandoPDF ? '⏳' : '📄 PDF'"></span>
                </button>
            </div>
        </div>
        <div class="config-grid">
            <div class="form-group mb-0">
                <label>📅 Inicio</label>
                <input type="date" x-model="fechaInicio" @change="generarDias()">
            </div>
            <div class="form-group mb-0">
                <label>Duración</label>
                <select x-model.number="duracionDias" @change="generarDias()">
                    <option value="1">1 Día</option>
                    <option value="2">2 Días</option>
                    <option value="3">3 Días</option>
                    <option value="4">4 Días</option>
                    <option value="5">5 Días</option>
                    <option value="10">10 Días</option>
                </select>
            </div>
        </div>
    </div>

    <div class="tabs-container">
        <template x-for="dia in dias" :key="dia.numero">
            <button class="tab-btn" 
                    :class="{ 'active': diaSeleccionado === dia.numero }"
                    @click="diaSeleccionado = dia.numero">
                <div class="tab-title" x-text="'Día ' + dia.numero"></div>
                <div class="tab-subtitle" x-text="dia.fechaCorta"></div>
            </button>
        </template>
    </div>

    <div class="timeline" style="padding-top: 15px;">
        
        <div x-show="carritoFiltrado.length === 0" class="timeline-empty">
            <i class="fa-solid fa-calendar-plus" style="font-size: 2rem; color: #cbd5e1; margin-bottom: 10px;"></i>
            <p>El Día <span x-text="diaSeleccionado"></span> está vacío.</p>
            <small>Selecciona items del catálogo a la izquierda.</small>
        </div>
        
        <div x-show="carritoFiltrado.length > 0" class="timeline-container">
            <template x-for="(item, index) in carritoFiltrado" :key="index">
                
                <div class="accordion-item" x-data="{ expanded: false }">
                    
                    <div class="accordion-header" @click="expanded = !expanded">
                        
                        <div class="acc-time">
                            <input type="time" 
                                   x-model="item.hora" 
                                   @click.stop 
                                   class="time-input-small"
                                   title="Cambiar hora">
                        </div>
                        
                        <div class="acc-info">
                            <div class="acc-title" x-text="item.Nombre"></div>
                            <div class="acc-subtitle">
                                <span x-text="'$' + item.total.toLocaleString('es-CL')"></span>
                                <span style="margin: 0 5px;">•</span>
                                <span x-text="item.cantidad + ' pax'"></span>
                            </div>
                        </div>
                        
                        <div class="acc-toggle">
                            <i class="fa-solid" :class="expanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                        </div>
                    </div>
                    
                    <div class="accordion-body" x-show="expanded" x-collapse>
                        <div class="accordion-controls">
                            <div class="control-group">
                                <label>Pax:</label>
                                <input type="number" 
                                       :value="item.cantidad" 
                                       @change="actualizarCantidad(carrito.indexOf(item), $event.target.value)"
                                       min="1">
                            </div>
                            <div class="control-group">
                                <label>Precio Unit:</label>
                                <input type="text" :value="'$' + (item.Precio_Base || 0).toLocaleString('es-CL')" disabled style="background: #f1f5f9;">
                            </div>
                            <button class="btn-delete" @click="eliminarItem(carrito.indexOf(item))">
                                <i class="fa-solid fa-trash"></i> Eliminar
                            </button>
                        </div>
                    </div>

                </div>
            </template>
        </div>
    </div>
    
    <div class="summary-bar">
        <div style="text-align: right;">
            <div style="font-size: 0.85rem; color: #64748b;">Neto: <span x-text="'$' + totalNeto.toLocaleString('es-CL')"></span></div>
            <div style="font-size: 1.3rem; font-weight: 800; color: var(--primary);">
                Total: <span x-text="'$' + totalFinal.toLocaleString('es-CL')"></span>
            </div>
        </div>
    </div>
</main>
