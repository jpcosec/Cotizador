<section class="main" x-show="isMachineInCompleted()" style="display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div style="width: 100%; max-width: 720px; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 28px; text-align: center;">
        <h2 style="margin-top: 0; color: var(--primary);">Cotizacion guardada exitosamente</h2>

        <div style="margin: 18px 0; display: grid; gap: 10px; text-align: left;">
            <div><strong>ID Cotizacion:</strong> <code x-text="quotationSnapshot?.ID_Cotizacion || quotationSnapshot?.cotizacionId || '-' "></code></div>
            <div><strong>Cliente:</strong> <span x-text="selectedClientName"></span></div>
            <div><strong>Total:</strong> <span x-text="formatCurrency(totalsSnapshot.total)"></span></div>
            <div><strong>Fecha de creacion:</strong> <span x-text="completionDateText"></span></div>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px;">
            <button class="btn-small btn-primary" @click="crearNuevaCotizacion()">Crear Nueva</button>
            <button class="btn-small btn-secondary" @click="verCotizacionesAnteriores()">Ver Anteriores</button>
        </div>
    </div>
</section>
