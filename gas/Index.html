<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador SF Lodge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <?!= include('Styles_Global'); ?>
</head>
<body>
    <div x-data="cotizadorApp()" x-cloak>
        <section x-show="useStateMachine && isMachineInBrowse()" style="padding: 28px; max-width: 920px; margin: 0 auto;">
            <h2 style="margin-bottom: 8px; color: var(--primary);">Bienvenido al Cotizador</h2>
            <p style="margin-top: 0; color: var(--secondary);">Inicia una cotizacion nueva o carga una existente.</p>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px;">
                <button class="btn-small btn-primary" @click="modalCliente = true">Seleccionar Cliente</button>
                <button class="btn-small btn-secondary" @click="cargarCotizacion()">Cargar Anterior</button>
            </div>
        </section>

        <section x-show="useStateMachine && isMachineInInitialize()" style="padding: 28px; max-width: 920px; margin: 0 auto;">
            <h2 style="margin-bottom: 8px; color: var(--primary);">Inicializando Cotizacion</h2>
            <p style="margin-top: 0; color: var(--secondary);">Selecciona cliente y configura fecha, dias y pax para continuar.</p>
        </section>

        <section x-show="!useStateMachine || isMachineInBasket()" class="container">
            <?!= include('Components_Sidebar'); ?>
            <?!= include('Components_Timeline'); ?>
        </section>

        <section x-show="useStateMachine && isMachineInValidation()">
            <?!= include('Components_ValidationSummary'); ?>
        </section>

        <section x-show="useStateMachine && isMachineInCompleted()">
            <?!= include('Components_CompletionSuccess'); ?>
        </section>

        <section x-show="useStateMachine && isMachineInError()" style="padding: 28px; max-width: 920px; margin: 0 auto;">
            <h2 style="margin-bottom: 8px; color: #b91c1c;">Error en la Cotizacion</h2>
            <p style="margin-top: 0; color: var(--secondary);">Revisa el detalle e intenta nuevamente.</p>
            <p style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px;" x-text="errors?.[0]?.message || 'Error desconocido'"></p>
            <button class="btn-small btn-secondary" @click="crearNuevaCotizacion()">Volver al Inicio</button>
        </section>

        <?!= include('Components_ModalCliente'); ?>
    </div>
    
    <?!= include('Bundle_Runtime'); ?>
    <?!= include('Local_XState_ActorLoader'); ?>
    <?!= include('Local_GAS_Shim'); ?>
    <?!= include('Bridge_AlpineXState'); ?>
    <?!= include('Stores_App'); ?>
</body>
</html>
