<script>
function cotizadorApp() {
    return {
        // --- ESTADO ---
        cliente: null,
        modalCliente: false,
        focusClientIndex: 0,
        busquedaCliente: '',
        clientesEncontrados: [],
        nuevoCliente: { nombre: '', rut: '', email: '', telefono: '', contacto: '' },
        modalCotizaciones: false,
        cotizacionesLoading: false,
        previousQuotations: [],
        selectedQuotationId: '',
        filtroCotizaciones: { texto: '', desde: '', estado: '' },
        
        catalogo: [],
        busquedaCatalogo: '', // Variable para el filtro del sidebar
        cargando: true,
        
        fechaInicio: new Date().toISOString().split('T')[0],
        duracionDias: 3,
        diaSeleccionado: 1,
        horaInicio: '09:00',
        dias: [],
        
        carrito: [],
        paxGlobal: 10,
        filtrarDia: null,
        generandoPDF: false,
        bridge: null,
        useStateMachine: false,
        machineState: null,
        totalsSnapshot: { subtotal: 0, taxes: [], total: 0 },
        errors: [],
        messages: [],
        databaseOpen: false,
        selectedRowData: null,
        databaseViewerOpen: false,
        databaseViewerLoading: false,
        databaseViewerTab: 'items',
        databaseViewerSearch: '',
        databaseViewerData: {
            CATEGORIAS: [],
            ITEM_CATALOGO: [],
            COMPOSICION_KIT: [],
            REGLAS_NEGOCIO: []
        },
        
        // --- INIT ---
        init() {
            this.registerAlpineStore();
            this.generarDias();
            this.initXStateBridge();
        },

        registerAlpineStore() {
            if (typeof window === 'undefined' || !window.Alpine || typeof window.Alpine.store !== 'function') {
                return;
            }

            if (!window.Alpine.store('cotizadorApp')) {
                window.Alpine.store('cotizadorApp', this);
            }
        },

        initXStateBridge(attempt) {
            var currentAttempt = attempt || 0;
            if (typeof window === 'undefined' || typeof window.AlpineXStateBridge !== 'function') {
                this.useStateMachine = false;
                this.cargarCatalogo();
                return;
            }

            var actorFactory = null;
            var useBootstrapOptions = false;
            if (typeof window.createCotizadorActor === 'function') {
                actorFactory = window.createCotizadorActor;
                useBootstrapOptions = true;
            } else if (window.QuotationXState && typeof window.QuotationXState.createActor === 'function') {
                actorFactory = window.QuotationXState.createActor;
            }

            if (!actorFactory) {
                if (currentAttempt < 10) {
                    var self = this;
                    setTimeout(function() {
                        self.initXStateBridge(currentAttempt + 1);
                    }, 200);
                } else {
                    this.useStateMachine = false;
                    console.warn('Machine not available, using local mode');
                    this.cargarCatalogo();
                }
                return;
            }

            try {
                var actor = useBootstrapOptions ? actorFactory({ bootstrap: false }) : actorFactory();
                if (!actor || typeof actor.getSnapshot !== 'function') return;

                this.bridge = new window.AlpineXStateBridge(actor, this, {
                    autoStart: true,
                    syncLineasAsCarrito: true
                }).start();
                this.useStateMachine = true;
                this.cargarCatalogo();
            } catch (e) {
                console.warn('No se pudo inicializar AlpineXStateBridge. Se mantiene modo local.', e);
                this.useStateMachine = false;
                this.cargarCatalogo();
            }
        },

        isMachineInBrowse() {
            return this.useStateMachine
                && this.machineState?.includes('quotation_workflow.browse');
        },

        isMachineInInitialize() {
            return this.useStateMachine
                && this.machineState?.includes('quotation.initialize');
        },

        isMachineInBasket() {
            return this.useStateMachine
                && this.machineState?.includes('quotation.basket');
        },

        isMachineInValidation() {
            return this.useStateMachine
                && this.machineState?.includes('quotation.validation');
        },

        isMachineInCompleted() {
            return this.useStateMachine
                && this.machineState?.includes('quotation.completed');
        },

        isMachineInError() {
            return this.useStateMachine
                && this.machineState?.includes('quotation.error');
        },

        get quotationSnapshot() {
            return this.quotation && this.quotation.cotizacion ? this.quotation.cotizacion : null;
        },

        formatCurrency(value) {
            var amount = Number(value) || 0;
            return '$' + amount.toLocaleString('es-CL');
        },

        normalizeDatabaseViewerData(data) {
            var source = data || {};
            return {
                CATEGORIAS: Array.isArray(source.CATEGORIAS) ? source.CATEGORIAS : [],
                ITEM_CATALOGO: Array.isArray(source.ITEM_CATALOGO) ? source.ITEM_CATALOGO : [],
                COMPOSICION_KIT: Array.isArray(source.COMPOSICION_KIT) ? source.COMPOSICION_KIT : [],
                REGLAS_NEGOCIO: Array.isArray(source.REGLAS_NEGOCIO) ? source.REGLAS_NEGOCIO : []
            };
        },

        openDatabaseViewer(tab) {
            if (tab) this.databaseViewerTab = tab;
            this.databaseViewerOpen = true;
            this.loadDatabaseViewerData();
        },

        closeDatabaseViewer() {
            this.databaseViewerOpen = false;
        },

        loadDatabaseViewerData() {
            var self = this;
            self.databaseViewerLoading = true;

            google.script.run
                .withSuccessHandler(function(data) {
                    self.databaseViewerData = self.normalizeDatabaseViewerData(data);
                    self.databaseViewerLoading = false;
                })
                .withFailureHandler(function(err) {
                    self.databaseViewerData = self.normalizeDatabaseViewerData({});
                    self.databaseViewerLoading = false;
                    console.warn('No se pudo cargar datos del visor de base', err);
                })
                .getPricingReferenceData();
        },

        prettyJson(value) {
            if (value === null || value === undefined || value === '') return '-';
            if (typeof value === 'string') return value;
            try {
                return JSON.stringify(value);
            } catch (e) {
                return String(value);
            }
        },

        get categoryMap() {
            var map = {};
            var categories = this.databaseViewerData && Array.isArray(this.databaseViewerData.CATEGORIAS)
                ? this.databaseViewerData.CATEGORIAS
                : [];
            categories.forEach(function(c) {
                if (c && c.ID_Categoria) map[c.ID_Categoria] = c;
            });
            return map;
        },

        get itemMap() {
            var map = {};
            var items = this.databaseViewerData && Array.isArray(this.databaseViewerData.ITEM_CATALOGO)
                ? this.databaseViewerData.ITEM_CATALOGO
                : [];
            items.forEach(function(i) {
                if (i && i.ID_Item) map[i.ID_Item] = i;
            });
            return map;
        },

        get filteredDatabaseItems() {
            var search = (this.databaseViewerSearch || '').toLowerCase().trim();
            var rows = this.databaseViewerData && Array.isArray(this.databaseViewerData.ITEM_CATALOGO)
                ? this.databaseViewerData.ITEM_CATALOGO
                : [];
            var categoryMap = this.categoryMap;

            return rows.filter(function(row) {
                if (!search) return true;
                var categoryName = (categoryMap[row.ID_Categoria] && categoryMap[row.ID_Categoria].Nombre) || row.ID_Categoria || '';
                var haystack = [row.ID_Item, row.Nombre, categoryName, row.Default_Glosa].join(' ').toLowerCase();
                return haystack.indexOf(search) !== -1;
            });
        },

        get filteredDatabaseCategories() {
            var search = (this.databaseViewerSearch || '').toLowerCase().trim();
            var rows = this.databaseViewerData && Array.isArray(this.databaseViewerData.CATEGORIAS)
                ? this.databaseViewerData.CATEGORIAS
                : [];

            return rows.filter(function(row) {
                if (!search) return true;
                var haystack = [row.ID_Categoria, row.Nombre].join(' ').toLowerCase();
                return haystack.indexOf(search) !== -1;
            });
        },

        get filteredDatabaseCompositions() {
            var search = (this.databaseViewerSearch || '').toLowerCase().trim();
            var rows = this.databaseViewerData && Array.isArray(this.databaseViewerData.COMPOSICION_KIT)
                ? this.databaseViewerData.COMPOSICION_KIT
                : [];
            var itemMap = this.itemMap;

            return rows.filter(function(row) {
                if (!search) return true;
                var parentName = (itemMap[row.ID_Item_Padre] && itemMap[row.ID_Item_Padre].Nombre) || '';
                var childName = (itemMap[row.ID_Item_Hijo] && itemMap[row.ID_Item_Hijo].Nombre) || '';
                var haystack = [row.ID_Item_Padre, parentName, row.ID_Item_Hijo, childName, row.Modo_Precio].join(' ').toLowerCase();
                return haystack.indexOf(search) !== -1;
            });
        },

        get filteredDatabaseRules() {
            var search = (this.databaseViewerSearch || '').toLowerCase().trim();
            var rows = this.databaseViewerData && Array.isArray(this.databaseViewerData.REGLAS_NEGOCIO)
                ? this.databaseViewerData.REGLAS_NEGOCIO
                : [];

            return rows.filter(function(row) {
                if (!search) return true;
                var haystack = [
                    row.ID_Regla,
                    row.Etapa,
                    row.Hook,
                    row.Tipo_Accion,
                    row.Descripcion,
                    row.Prioridad
                ].join(' ').toLowerCase();
                return haystack.indexOf(search) !== -1;
            });
        },

        get selectedClientName() {
            if (!this.cliente) return '-';
            return this.cliente.Nombre_Empresa || this.cliente.nombre || this.cliente.ID_Cliente || String(this.cliente);
        },

        get completionDateText() {
            return new Date().toLocaleDateString('es-CL');
        },

        get filteredClientes() {
            var rows = Array.isArray(this.clientesEncontrados) ? this.clientesEncontrados : [];
            var query = (this.busquedaCliente || '').trim().toLowerCase();
            if (!query) return rows;
            return rows.filter(function(cli) {
                var haystack = [
                    cli.ID_Cliente,
                    cli.Nombre_Empresa,
                    cli.nombre,
                    cli.RUT,
                    cli.rut,
                    cli.Email,
                    cli.email
                ].join(' ').toLowerCase();
                return haystack.indexOf(query) !== -1;
            });
        },

        get highlightedClient() {
            var rows = this.filteredClientes;
            if (!rows.length) return null;
            var idx = Math.max(0, Math.min(this.focusClientIndex || 0, rows.length - 1));
            return rows[idx] || null;
        },

        get filteredPreviousQuotations() {
            var rows = Array.isArray(this.previousQuotations) ? this.previousQuotations.slice() : [];
            var filter = this.filtroCotizaciones || {};
            var text = (filter.texto || '').toLowerCase().trim();
            var status = (filter.estado || '').trim();
            var fromDate = (filter.desde || '').trim();

            rows = rows.filter(function(row) {
                if (status && String(row.estado || '') !== status) return false;
                if (fromDate) {
                    var rowDate = String(row.fechaEvento || '').slice(0, 10);
                    if (!rowDate || rowDate < fromDate) return false;
                }
                if (!text) return true;
                var haystack = [
                    row.cotizacionId,
                    row.clienteNombre,
                    row.clienteId,
                    row.estado,
                    row.fechaEvento,
                    row.updatedAt
                ].join(' ').toLowerCase();
                return haystack.indexOf(text) !== -1;
            });

            rows.sort(function(a, b) {
                return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
            });

            return rows;
        },

        syncClientToMachine(cli) {
            if (!this.useStateMachine || !this.bridge || !cli) return false;
            if (this.isMachineInBasket()) return true;

            var started = this.bridge.send('START_NEW_QUOTATION');
            if (!started) return false;

            this.bridge.send('CREATE_NEW');
            this.bridge.send('QUOTATION_INITIALIZED', {
                clienteId: cli.ID_Cliente || 'CLI_CORP',
                paxGlobal: this.paxGlobal || 10,
                fechaEvento: this.fechaInicio,
                duracionDias: this.duracionDias || 1,
                cotizacionId: 'COT_UI_' + Date.now()
            });
            return true;
        },
        
        // --- LÓGICA DE NEGOCIO ---
        generarDias() {
            if (!this.fechaInicio) return;
            var inicio = new Date(this.fechaInicio + 'T00:00:00');
            this.dias = [];
            for (var i = 0; i < this.duracionDias; i++) {
                var f = new Date(inicio);
                f.setDate(f.getDate() + i);
                this.dias.push({
                    numero: i + 1,
                    fecha: f.toISOString().split('T')[0],
                    fechaCorta: f.getDate() + '/' + (f.getMonth() + 1)
                });
            }
        },
        
        obtenerFechaDia(num) {
            var d = this.dias.find(d => d.numero === num);
            return d ? d.fecha : this.fechaInicio;
        },

        normalizeCatalogItem(raw) {
            var item = raw || {};
            var categoriaObj = item._categoria || null;
            var categoriaNombre = item.categoria
                || (categoriaObj && categoriaObj.Nombre)
                || item.Categoria
                || item.ID_Categoria
                || 'Varios';
            var categoriaId = item.ID_Categoria
                || (categoriaObj && categoriaObj.ID_Categoria)
                || item.categoria
                || null;
            var detalle = item.Default_Glosa
                || item.detalle
                || item.Detalle
                || item.Comentarios
                || item.comentarios
                || '';

            return {
                ...item,
                ID_Item: item.ID_Item || item.itemId || item.id || null,
                Nombre: item.Nombre || item.nombre || item.ID_Item || item.itemId || 'Item',
                Precio_Base: Number(item.Precio_Base ?? item.precio ?? 0) || 0,
                detalle: detalle,
                Default_Glosa: detalle,
                ID_Categoria: categoriaId,
                _categoria: categoriaObj || {
                    ID_Categoria: categoriaId,
                    Nombre: categoriaNombre
                }
            };
        },

        resolveItemComment(item) {
            if (!item) return '';
            return String(
                item.comentarios
                || item.Comentarios
                || item.detalle
                || item.Default_Glosa
                || ''
            ).trim();
        },

        normalizeCatalogo(items) {
            var out = [];
            (items || []).forEach((item) => {
                var normalized = this.normalizeCatalogItem(item);
                if (normalized.ID_Item) out.push(normalized);
            });
            return out;
        },

        hydrateMachineStoreFromReference(reference) {
            if (!this.useStateMachine || !this.bridge) return;
            var actor = this.bridge.actor;
            if (!actor || typeof actor.getSnapshot !== 'function') return;

            var snap = actor.getSnapshot();
            var store = snap && snap.context ? snap.context.store : null;
            if (!store || typeof store.seed !== 'function') return;

            var tableNames = [
                'PERFILES_PRECIO',
                'CATEGORIAS',
                'ITEM_CATALOGO',
                'COMPOSICION_KIT',
                'REGLAS_NEGOCIO'
            ];

            tableNames.forEach(function(tableName) {
                var rows = reference && Array.isArray(reference[tableName]) ? reference[tableName] : null;
                if (rows) {
                    store.seed(tableName, rows);
                }
            });
        },
        
        cargarCatalogo() {
            var self = this;

            function finishCatalogLoad(data) {
                self.catalogo = self.normalizeCatalogo(data || []);
                self.cargando = false;
            }

            function loadCatalogOnly() {
                google.script.run
                    .withSuccessHandler(finishCatalogLoad)
                    .withFailureHandler(function() {
                        self.catalogo = [];
                        self.cargando = false;
                    })
                    .getCatalogo();
            }

            self.cargando = true;
            if (this.useStateMachine && this.bridge) {
                google.script.run
                    .withSuccessHandler(function(reference) {
                        self.hydrateMachineStoreFromReference(reference || {});
                        loadCatalogOnly();
                    })
                    .withFailureHandler(function() {
                        loadCatalogOnly();
                    })
                    .getPricingReferenceData();
                return;
            }

            loadCatalogOnly();
        },
        
        // --- CLIENTE ---
        buscarClientes() {
            if (this.busquedaCliente.length < 2) {
                this.clientesEncontrados = [];
                this.focusClientIndex = 0;
                return;
            }
            var self = this;
            google.script.run.withSuccessHandler(function(res) {
                self.clientesEncontrados = res || [];
                self.focusClientIndex = 0;
            }).buscarCliente(this.busquedaCliente);
        },

        moveClientSelection(step) {
            var rows = this.filteredClientes;
            if (!rows.length) return;
            var current = Number(this.focusClientIndex || 0);
            this.focusClientIndex = Math.max(0, Math.min(current + step, rows.length - 1));
        },

        selectHighlightedClient() {
            var cli = this.highlightedClient;
            if (cli) this.seleccionarCliente(cli);
        },
        
        seleccionarCliente(cli) {
            this.cliente = cli;
            this.syncClientToMachine(cli);
            this.cerrarModalCliente();
        },
        
        crearCliente() {
            var self = this;
            if(!this.nuevoCliente.nombre || !this.nuevoCliente.rut) {
                alert("Nombre y RUT son obligatorios");
                return;
            }
            google.script.run.withSuccessHandler(function(cli) {
                self.seleccionarCliente(cli);
            }).crearOObtenerCliente(this.nuevoCliente);
        },
        
        cerrarModalCliente() {
            this.modalCliente = false;
            this.focusClientIndex = 0;
            this.busquedaCliente = '';
            this.clientesEncontrados = [];
            this.nuevoCliente = { nombre: '', rut: '', email: '', telefono: '', contacto: '' };
        },
        
        cambiarCliente() {
            if (this.useStateMachine && this.bridge) {
                this.bridge.send('RETURN_TO_BROWSE');
            }
            this.cliente = null;
            this.modalCliente = true;
        },
        
        // --- CARRITO ---
        agregarItem(item) {
            if (!this.cliente) {
                alert('Select client first');
                this.modalCliente = true;
                return;
            }

            if (this.useStateMachine && this.bridge) {
                var stateItemId = item.ID_Item || item.itemId || item.id || item.nombre;
                if (stateItemId) {
                    var comment = this.resolveItemComment(item);
                    var sent = this.bridge.send('ADD_ITEM', {
                        itemId: stateItemId,
                        overrides: {
                            Override_Pax: this.paxGlobal,
                            dia: this.diaSeleccionado,
                            hora: this.horaInicio,
                            Comentarios: comment
                        }
                    });
                    if (sent) return;
                }
            }

            var localComment = this.resolveItemComment(item);

            this.carrito.push({
                nombre: item.Nombre || item.nombre,
                categoria: (item._categoria && item._categoria.Nombre) || item.categoria || item.ID_Categoria || 'Varios',
                precio: item.Precio_Base || item.precio || 0,
                cantidad: this.paxGlobal,
                dia: this.diaSeleccionado,
                fecha: this.obtenerFechaDia(this.diaSeleccionado),
                hora: this.horaInicio,
                comentarios: localComment,
                Comentarios: localComment,
                total: (item.Precio_Base || item.precio || 0) * this.paxGlobal
            });
            
            this.carrito.sort((a,b) => {
                if (a.dia !== b.dia) return a.dia - b.dia;
                return a.hora.localeCompare(b.hora);
            });
        },
        
        actualizarCantidad(idx, val) {
            var cant = parseInt(val) || 1;

            if (this.useStateMachine && this.bridge && this.carrito[idx]) {
                var lineId = this.carrito[idx].lineId || this.carrito[idx].id;
                if (lineId) {
                    var sent = this.bridge.send('UPDATE_ITEM', {
                        lineId: lineId,
                        overrides: { Override_Pax: cant }
                    });
                    if (sent) return;
                }
            }

            this.carrito[idx].cantidad = cant;
            this.carrito[idx].total = this.carrito[idx].precio * cant;
        },

        actualizarComentario(idx, val) {
            var comentario = String(val || '');

            if (this.useStateMachine && this.bridge && this.carrito[idx]) {
                var lineId = this.carrito[idx].lineId || this.carrito[idx].id;
                if (lineId) {
                    var sent = this.bridge.send('UPDATE_ITEM', {
                        lineId: lineId,
                        overrides: { Comentarios: comentario }
                    });
                    if (sent) return;
                }
            }

            if (!this.carrito[idx]) return;
            this.carrito[idx].comentarios = comentario;
            this.carrito[idx].Comentarios = comentario;
        },
        
        eliminarItem(idx) {
            if (this.useStateMachine && this.bridge && this.carrito[idx]) {
                var lineId = this.carrito[idx].lineId || this.carrito[idx].id;
                if (lineId) {
                    var sent = this.bridge.send('REMOVE_ITEM', { lineId: lineId });
                    if (sent) return;
                }
            }

            this.carrito.splice(idx, 1);
        },
        
        formatearBadge(item) {
            try {
               var fechaStr = item.fecha.split('-').reverse().join('/');
               return "Día " + item.dia + " • " + fechaStr + " • " + item.hora;
            } catch(e) {
               return "Día " + item.dia + " • " + item.hora;
            }
        },
        
        // --- COMPUTED PROPERTIES (FILTROS PODEROSOS) ---
        
        get catalogoPorCategoria() {
            if (!this.catalogo) return {};
            
            var g = {};
            var busqueda = this.busquedaCatalogo.toLowerCase(); // Texto del input
            
            this.catalogo.forEach(function(i) {
                var nombre = (i.Nombre || i.nombre || '').toLowerCase();
                // FILTRO: Si hay búsqueda, verificamos si el nombre coincide
                if (busqueda && nombre.indexOf(busqueda) === -1) {
                    return; // Si no coincide, saltamos este item
                }
                
                var c = (i._categoria && i._categoria.Nombre) || i.categoria || i.ID_Categoria || 'Varios';
                if (!g[c]) g[c] = [];
                g[c].push(i);
            });
            
            return g;
        },
        
        get carritoFiltrado() {
            if (!this.carrito) return [];
            return this.carrito.filter(item => item.dia === this.diaSeleccionado);
        },
        
        get diasUnicos() { // Mantenemos por compatibilidad aunque usamos tabs
            if (!this.carrito) return [];
            var unicos = [];
            this.carrito.forEach(i => { if(unicos.indexOf(i.dia) === -1) unicos.push(i.dia); });
            return unicos.sort((a,b) => a-b);
        },
        
        get totalNeto() {
            if (this.useStateMachine && this.totalsSnapshot && this.totalsSnapshot.subtotal) {
                return this.totalsSnapshot.subtotal;
            }
            if (!this.carrito) return 0;
            return this.carrito.reduce((sum, i) => sum + (i.total || 0), 0);
        },

        get totalFinal() {
            if (this.useStateMachine && this.totalsSnapshot && this.totalsSnapshot.total) {
                return this.totalsSnapshot.total;
            }
            return Math.round(this.totalNeto * 1.19);
        },

        // --- ACCIONES DE PERSISTENCIA ---

        guardarCotizacion() {
            if (this.carrito.length === 0) return alert('Carrito vacío');
            if (!this.cliente) { this.modalCliente = true; return; }

            if (this.useStateMachine && this.bridge) {
                this.syncClientToMachine(this.cliente);
                this.bridge.send('ADVANCE_TO_VALIDATION');
                return;
            }

            // Llamada al Backend
            google.script.run
                .withSuccessHandler((res) => {
                    if(res.success) {
                        alert('✅ ' + res.mensaje + '\nID: ' + res.id);
                        // Opcional: Guardar el ID en el estado local si quieres editar luego
                        // this.cotizacionActualID = res.id;
                    }
                })
                .withFailureHandler((e) => alert('Error: ' + e.message))
                .guardarCotizacion(this.cliente, this.carrito);
        },

        confirmarYGuardar() {
            if (!this.useStateMachine || !this.bridge) {
                this.guardarCotizacion();
                return;
            }

            this.bridge.send('VALIDATE_AND_SAVE');
        },

        volverAlCarrito() {
            if (this.useStateMachine && this.bridge) {
                this.bridge.send('BACK_TO_BASKET');
            }
        },

        crearNuevaCotizacion() {
            if (this.useStateMachine && this.bridge) {
                this.bridge.send('RETURN_TO_BROWSE');
                this.cliente = null;
                return;
            }

            this.cliente = null;
            this.carrito = [];
        },

        verCotizacionesAnteriores() {
            this.abrirBrowserCotizaciones();
        },

        parseCachedQuotationRows(cacheRows, clientRows) {
            var rows = Array.isArray(cacheRows) ? cacheRows : [];
            var clients = Array.isArray(clientRows) ? clientRows : [];
            var clientMap = {};
            clients.forEach(function(cli) {
                if (cli && cli.ID_Cliente) clientMap[cli.ID_Cliente] = cli;
            });

            return rows.map(function(row) {
                var snapshotRaw = row && row.Snapshot_JSON;
                var snapshot = null;
                if (typeof snapshotRaw === 'string') {
                    try {
                        snapshot = JSON.parse(snapshotRaw);
                    } catch (e) {
                        snapshot = null;
                    }
                } else if (snapshotRaw && typeof snapshotRaw === 'object') {
                    snapshot = snapshotRaw;
                }

                var cot = snapshot && snapshot.cotizacion ? snapshot.cotizacion : null;
                if (!cot) return null;

                var clienteId = cot.ID_Cliente || null;
                var cliente = clientMap[clienteId] || null;
                return {
                    cotizacionId: row.ID_Cotizacion || cot.ID_Cotizacion,
                    estado: cot.Estado || 'Borrador',
                    clienteId: clienteId,
                    clienteNombre: (cliente && cliente.Nombre_Empresa) || clienteId || '-',
                    fechaEvento: cot.Fecha_Evento || null,
                    total: snapshot && snapshot.totals ? Number(snapshot.totals.total || 0) : 0,
                    updatedAt: row.Updated_At || null,
                };
            }).filter(Boolean);
        },

        loadPreviousQuotations() {
            this.cotizacionesLoading = true;

            if (this.useStateMachine && this.bridge && this.bridge.actor && typeof this.bridge.actor.getSnapshot === 'function') {
                var snap = this.bridge.actor.getSnapshot();
                var context = snap && snap.context ? snap.context : null;
                var store = context && context.store ? context.store : null;

                if (store && typeof store.findAll === 'function') {
                    var cacheRows = store.findAll('CACHE_COTIZACION', {}) || [];
                    var clientRows = store.findAll('CLIENTES', {}) || [];
                    this.previousQuotations = this.parseCachedQuotationRows(cacheRows, clientRows);
                    this.cotizacionesLoading = false;
                    return;
                }

                if (context && Array.isArray(context.previousQuotations) && context.previousQuotations.length) {
                    this.previousQuotations = context.previousQuotations;
                    this.cotizacionesLoading = false;
                    return;
                }
            }

            this.previousQuotations = [];
            this.cotizacionesLoading = false;
        },

        abrirBrowserCotizaciones() {
            this.modalCotizaciones = true;
            this.selectedQuotationId = '';
            this.loadPreviousQuotations();
        },

        cerrarModalCotizaciones() {
            this.modalCotizaciones = false;
        },

        recargarCotizaciones() {
            this.loadPreviousQuotations();
        },

        cargarCotizacionDesdeLista(id) {
            if (!id) return;
            this.selectedQuotationId = id;
            this.cargarCotizacion(id);
        },

        cargarCotizacion(cotizacionId) {
            var id = cotizacionId || '';
            if (!id) {
                this.abrirBrowserCotizaciones();
                return;
            }

            if (this.useStateMachine && this.bridge) {
                this.cargando = true;
                var loaded = this.bridge.loadQuotation
                    ? this.bridge.loadQuotation(id)
                    : this.bridge.send('LOAD_QUOTATION', { cotizacionId: id });
                this.cargando = false;

                if (!loaded) {
                    alert('No se pudo enviar evento LOAD_QUOTATION.');
                    return;
                }

                var cot = this.quotation && this.quotation.cotizacion ? this.quotation.cotizacion : null;
                if (!cot || String(cot.ID_Cotizacion) !== String(id)) {
                    alert('Error: cotización no encontrada en el estado de máquina.');
                    return;
                }

                this.fechaInicio = cot.Fecha_Evento || this.fechaInicio;
                this.duracionDias = cot.Duracion_Dias || this.duracionDias;
                this.paxGlobal = this.quotation.paxGlobal || this.paxGlobal;
                this.generarDias();
                this.diaSeleccionado = 1;

                var localCli = null;
                if (Array.isArray(window.localClientes)) {
                    localCli = window.localClientes.find(function(c) {
                        return String(c.ID_Cliente) === String(cot.ID_Cliente);
                    }) || null;
                }
                this.cliente = localCli || this.cliente || { ID_Cliente: cot.ID_Cliente, Nombre_Empresa: cot.ID_Cliente };
                this.modalCotizaciones = false;
                alert('✅ Cotización cargada desde XState.');
                return;
            }

            this.cargando = true;
            
            var self = this;
            google.script.run
                .withSuccessHandler(function(res) {
                    self.cargando = false;
                    
                    if(res && res.success) {
                        // 1. Cargar Cliente
                        self.cliente = res.cliente;
                        
                        // 2. Cargar Fecha Inicio (Backend ahora la calcula bien)
                        if (res.fechaInicio) {
                            self.fechaInicio = res.fechaInicio;
                        }

                        // 3. Cargar Carrito
                        self.carrito = res.carrito || [];
                        
                        // ===============================================
                        // 4. AUTO-AJUSTE DE DURACIÓN (Lo que faltaba)
                        // ===============================================
                        if (self.carrito.length > 0) {
                            var maxDiaEncontrado = 1;
                            
                            // Recorremos el carrito buscando el día más alto
                            self.carrito.forEach(function(item) {
                                var diaItem = parseInt(item.dia) || 1;
                                if (diaItem > maxDiaEncontrado) {
                                    maxDiaEncontrado = diaItem;
                                }
                            });
                            
                            // Actualizamos la duración del viaje al máximo encontrado
                            // (Si el viaje dura 4 días, el select se pondrá en 4 o se ajustará internamente)
                            self.duracionDias = maxDiaEncontrado;
                            
                            // IMPORTANTE: Regenerar el array de días para que aparezcan los Tabs
                            self.generarDias();
                            
                            // Seleccionar el Día 1 para empezar
                            self.diaSeleccionado = 1;
                        }
                        
                        self.modalCotizaciones = false;
                        alert('✅ Cotización cargada correctamente.');
                    } else {
                        alert('Error: Respuesta inválida o vacía del servidor.');
                    }
                })
                .withFailureHandler(function(e) {
                    self.cargando = false;
                    alert('Error al cargar: ' + e.message);
                })
                .cargarCotizacion(id);
        },


        // --- PDF (FLUJO MODIFICADO) ---
        generarPDF() {
            if (this.carrito.length === 0) return;
            if (!this.cliente) { this.modalCliente = true; return; }
            
            this.generandoPDF = true;

            // PASO 1: Guardar primero para asegurar consistencia
            google.script.run
                .withSuccessHandler((resGuardado) => {
                    if (resGuardado.success) {
                        console.log('Guardado OK, generando PDF para ID:', resGuardado.id);
                        
                        // PASO 2: Generar PDF desde el ID guardado
                        google.script.run
                            .withSuccessHandler((url) => {
                                window.open(url);
                                this.generandoPDF = false;
                            })
                            .withFailureHandler((e) => {
                                alert('Error generando PDF: ' + e.message);
                                this.generandoPDF = false;
                            })
                            .generarPDF(resGuardado.id); // Enviamos solo el ID
                    }
                })
                .withFailureHandler((e) => {
                    alert('Error al guardar previo al PDF: ' + e.message);
                    this.generandoPDF = false;
                })
                .guardarCotizacion(this.cliente, this.carrito);
        }
    };
}
</script>
