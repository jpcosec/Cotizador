<template x-teleport="body">
    <div x-show="databaseViewerOpen" x-transition.opacity
         style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 99998; display: flex; align-items: center; justify-content: center; padding: 16px;">
        <div @click.away="closeDatabaseViewer()"
             style="width: min(1200px, 100%); max-height: 90vh; overflow: hidden; background: #fff; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column;">

            <div style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                <div>
                    <h3 style="margin: 0; color: var(--primary);">Visor de Base de Datos</h3>
                    <small style="color: var(--secondary);"
                           x-text="databaseViewerTab ? databaseViewerTab + ' · ' + filteredDatabaseRows.length + ' filas' : 'Sin tabla seleccionada'"></small>
                </div>
                <button class="btn-small btn-secondary" @click="closeDatabaseViewer()">Cerrar</button>
            </div>

            <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                <template x-for="table in databaseViewerTables" :key="table">
                    <button class="btn-small"
                            :class="databaseViewerTab === table ? 'btn-primary' : 'btn-secondary'"
                            @click="databaseViewerTab = table"
                            x-text="table"></button>
                </template>
                <input type="text" x-model="databaseViewerSearch" placeholder="Filtrar..."
                       style="margin-left: auto; min-width: 200px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;" />
                <button class="btn-small btn-secondary" @click="loadDatabaseViewerData()">Recargar</button>
            </div>

            <div style="padding: 12px 16px; overflow: auto; flex: 1;">
                <div x-show="databaseViewerLoading" style="padding: 12px; color: var(--secondary);">Cargando datos...</div>

                <div x-show="!databaseViewerLoading && databaseViewerTables.length === 0"
                     style="padding: 24px; text-align: center; color: var(--secondary);">Sin datos cargados.</div>

                <div x-show="!databaseViewerLoading && databaseViewerTables.length > 0 && databaseViewerColumns.length > 0"
                     style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 0.82rem;">
                        <thead>
                            <tr style="background: var(--bg-light); text-align: left;">
                                <template x-for="col in databaseViewerColumns" :key="col">
                                    <th style="padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;"
                                        x-text="col"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="(row, idx) in filteredDatabaseRows" :key="idx">
                                <tr :style="idx % 2 === 0 ? '' : 'background: #fafafa'">
                                    <template x-for="col in databaseViewerColumns" :key="col">
                                        <td style="padding: 6px 10px; border-bottom: 1px solid var(--border); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                                            :title="prettyJson(row[col])"
                                            x-text="prettyJson(row[col])"></td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</template>
