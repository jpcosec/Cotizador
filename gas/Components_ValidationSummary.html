<section class="main" x-show="isMachineInValidation()" style="padding: 24px; overflow-y: auto;">
    <div style="max-width: 980px; margin: 0 auto; background: white; border: 1px solid var(--border); border-radius: 10px; padding: 24px;">
        <h2 style="margin: 0 0 16px; color: var(--primary);">Resumen de Cotizacion</h2>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 20px;">
            <div><strong>Cliente:</strong> <span x-text="selectedClientName"></span></div>
            <div><strong>Fecha evento:</strong> <span x-text="quotationSnapshot?.Fecha_Evento || fechaInicio"></span></div>
            <div><strong>Pax:</strong> <span x-text="quotationSnapshot?.Pax_Global || paxGlobal"></span></div>
        </div>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: var(--bg-light); text-align: left;">
                        <th style="padding: 10px; border-bottom: 1px solid var(--border);">Articulo</th>
                        <th style="padding: 10px; border-bottom: 1px solid var(--border);">Cantidad</th>
                        <th style="padding: 10px; border-bottom: 1px solid var(--border);">Precio Unitario</th>
                        <th style="padding: 10px; border-bottom: 1px solid var(--border);">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="(linea, index) in carrito" :key="linea.lineId || linea.id || index">
                        <tr>
                            <td style="padding: 10px; border-bottom: 1px solid var(--border);" x-text="linea.nombre"></td>
                            <td style="padding: 10px; border-bottom: 1px solid var(--border);" x-text="linea.cantidad"></td>
                            <td style="padding: 10px; border-bottom: 1px solid var(--border);" x-text="formatCurrency(linea.precio)"></td>
                            <td style="padding: 10px; border-bottom: 1px solid var(--border);" x-text="formatCurrency(linea.total || (linea.cantidad * linea.precio))"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-top: 18px;">
            <div><strong>Subtotal:</strong> <span x-text="formatCurrency(totalsSnapshot.subtotal)"></span></div>
            <div><strong>IVA:</strong> <span x-text="formatCurrency((totalsSnapshot.taxes && totalsSnapshot.taxes[0] && totalsSnapshot.taxes[0].monto) || (totalsSnapshot.total - totalsSnapshot.subtotal))"></span></div>
            <div style="font-size: 1.2rem; color: var(--primary);"><strong>Total:</strong> <span x-text="formatCurrency(totalsSnapshot.total)"></span></div>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
            <button class="btn-small btn-primary" @click="confirmarYGuardar()">Confirmar y Guardar</button>
            <button class="btn-small btn-secondary" @click="volverAlCarrito()">Volver al Carrito</button>
        </div>
    </div>
</section>
