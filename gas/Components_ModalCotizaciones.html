<template x-teleport="body">
    <div class="modal-overlay" x-show="modalCotizaciones" x-transition.opacity>
        <div class="modal modal-xl" @click.away="cerrarModalCotizaciones()">
            <div class="modal-header-row">
                <h3 style="margin: 0;">Cotizaciones Anteriores</h3>
                <button class="btn-small btn-secondary" @click="cerrarModalCotizaciones()">Cerrar</button>
            </div>

            <div class="modal-filters-grid">
                <div class="form-group mb-0">
                    <label>Buscar</label>
                    <input type="text" x-model="filtroCotizaciones.texto" placeholder="ID, cliente o estado">
                </div>
                <div class="form-group mb-0">
                    <label>Desde</label>
                    <input type="date" x-model="filtroCotizaciones.desde">
                </div>
                <div class="form-group mb-0">
                    <label>Estado</label>
                    <select x-model="filtroCotizaciones.estado">
                        <option value="">Todos</option>
                        <option value="Borrador">Borrador</option>
                        <option value="Enviada">Enviada</option>
                        <option value="Aprobada">Aprobada</option>
                        <option value="Finalizada">Finalizada</option>
                    </select>
                </div>
            </div>

            <div class="quotations-table-wrap">
                <table class="quotations-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Evento</th>
                            <th>Estado</th>
                            <th style="text-align: right;">Total</th>
                            <th>Actualizado</th>
                            <th style="text-align: right;">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="q in filteredPreviousQuotations" :key="q.cotizacionId">
                            <tr :class="{ 'row-selected': selectedQuotationId === q.cotizacionId }">
                                <td x-text="q.cotizacionId"></td>
                                <td x-text="q.clienteNombre || q.clienteId || '-' "></td>
                                <td x-text="q.fechaEvento || '-' "></td>
                                <td x-text="q.estado || '-' "></td>
                                <td style="text-align: right;" x-text="formatCurrency(Number(q.total || 0))"></td>
                                <td x-text="q.updatedAt || '-' "></td>
                                <td style="text-align: right;">
                                    <button class="btn-small btn-primary" @click="cargarCotizacionDesdeLista(q.cotizacionId)">Cargar</button>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="!cotizacionesLoading && filteredPreviousQuotations.length === 0">
                            <td colspan="7" style="text-align:center; color: var(--secondary); padding: 18px;">
                                No hay cotizaciones disponibles en caché.
                            </td>
                        </tr>
                        <tr x-show="cotizacionesLoading">
                            <td colspan="7" style="text-align:center; color: var(--secondary); padding: 18px;">
                                Cargando cotizaciones...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="modal-footer-row">
                <small style="color: var(--secondary);">
                    <span x-text="filteredPreviousQuotations.length"></span> cotizaciones visibles
                </small>
                <div style="display:flex; gap:8px;">
                    <button class="btn-small btn-secondary" @click="recargarCotizaciones()">Recargar</button>
                    <button class="btn-small btn-secondary" @click="cerrarModalCotizaciones()">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</template>
