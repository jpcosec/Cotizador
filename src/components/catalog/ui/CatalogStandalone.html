<section class="catalog-shell">
  <header class="panel controls-panel">
    <div class="controls-row">
      <label class="search-control">
        <span>Search category</span>
        <input type="text" x-model="searchTerm" placeholder="Type category name" />
      </label>

      <div class="actions-row">
        <button class="btn btn-small btn-secondary" @click="expandAll()">Expand all</button>
        <button class="btn btn-small btn-secondary" @click="collapseAll()">Collapse all</button>
      </div>
    </div>

    <div class="context-grid">
      <label>
        <span>Pax Global</span>
        <input type="number" min="0" :value="globalContext.paxGlobal" @input="setContextField('paxGlobal', $event.target.value)" />
      </label>
      <label>
        <span>Dia</span>
        <input type="number" min="1" :value="globalContext.dia" @input="setContextField('dia', $event.target.value)" />
      </label>
      <label>
        <span>Hora</span>
        <input type="time" :value="globalContext.hora" @input="setContextField('hora', $event.target.value)" />
      </label>
    </div>
  </header>

  <section class="panel summary-panel">
    <h2>Catalog Summary</h2>
    <div class="summary-grid">
      <article>
        <p class="label">Categories</p>
        <p class="value" x-text="catalogSummary.categoryCount || 0"></p>
      </article>
      <article>
        <p class="label">Expanded</p>
        <p class="value" x-text="catalogSummary.expandedCount || 0"></p>
      </article>
      <article>
        <p class="label">Loaded</p>
        <p class="value" x-text="catalogSummary.loadedCount || 0"></p>
      </article>
      <article>
        <p class="label">Warnings</p>
        <p class="value" x-text="catalogSummary.categoriesWithWarnings || 0"></p>
      </article>
      <article>
        <p class="label">Errors</p>
        <p class="value" x-text="catalogSummary.categoriesWithErrors || 0"></p>
      </article>
    </div>
  </section>

  <section class="panel categories-panel">
    <h2>Categories</h2>
    <template x-if="filteredCategories().length === 0">
      <p class="empty-state">No categories match the current search.</p>
    </template>

    <div class="categories-list">
      <template x-for="category in filteredCategories()" :key="category.id">
        <article class="category-card" :class="category.hasErrors ? 'category-error' : (category.hasWarnings ? 'category-warn' : '')">
          <button class="category-header" @click="toggleCategory(category.id)">
              <div class="category-left">
                <span class="category-icon" x-text="category.icono || '•'"></span>
                <div>
                  <p class="category-name" x-text="category.nombre"></p>
                </div>
              </div>
            <div class="category-right">
              <i class="fa-solid fa-chevron-down" :class="category.isExpanded ? 'open' : ''"></i>
            </div>
          </button>

          <div class="category-body" x-show="category.isExpanded" style="display:none;">
            <template x-if="!category.isLoaded">
              <p class="empty-state">Loading category runtime...</p>
            </template>

            <template x-if="category.isLoaded && category.catalogEntries.length === 0">
              <p class="empty-state">No active items in this category.</p>
            </template>

            <div class="item-list"
                 x-show="category.isLoaded && category.catalogEntries.length > 0"
                 x-data="{ get catalogEntries() { return category.catalogEntries || []; } }">
              <!-- ITEM_CATALOG_RUNTIME -->
            </div>

            <template x-if="category.loadErrors.length > 0">
              <div class="load-errors">
                <template x-for="error in category.loadErrors" :key="`${error.itemId}-${error.message}`">
                  <p class="error-line" x-text="`${error.itemId}: ${error.message}`"></p>
                </template>
              </div>
            </template>
          </div>
        </article>
      </template>
    </div>
  </section>
</section>
