<section class="basket-shell">
  <header class="panel controls-panel">
    <div class="controls-row">
      <label class="ship-control">
        <span>Catalog item</span>
        <select :value="selectedItemId" @change="selectItem($event.target.value)">
          <template x-for="item in itemOptions" :key="item.id">
            <option :value="item.id" x-text="`${item.nombre} (${item.categoria})`"></option>
          </template>
        </select>
      </label>

      <button class="btn btn-small btn-primary" @click="shipSelectedItem()">
        <i class="fa-solid fa-box-open"></i>
        Ship to selected day
      </button>
    </div>

    <div class="context-grid">
      <label>
        <span>Pax Global</span>
        <input type="number" min="0" :value="globalContext.paxGlobal" @input="setContextField('paxGlobal', $event.target.value)" />
      </label>
      <label>
        <span>Hora</span>
        <input type="time" :value="globalContext.hora" @input="setContextField('hora', $event.target.value)" />
      </label>
      <label>
        <span>Duracion Min</span>
        <input type="number" min="0" step="15" :value="globalContext.duracionMin" @input="setContextField('duracionMin', $event.target.value)" />
      </label>
    </div>
  </header>

  <section class="panel days-panel">
    <h2>Days</h2>
    <div class="day-tabs">
      <template x-for="day in (basketState.days || [])" :key="day.dayIndex">
        <button
          class="day-tab"
          :class="day.dayIndex === selectedDayIndex ? 'is-active' : ''"
          @click="selectDay(day.dayIndex)"
        >
          <span x-text="day.label"></span>
          <small x-text="`${day.entryCount} entries`"></small>
        </button>
      </template>
    </div>
  </section>

  <section class="panel basket-summary-panel">
    <h2>Basket Summary</h2>
    <div class="summary-grid">
      <article>
        <p class="label">Days</p>
        <p class="value" x-text="basketState.summary?.dayCount || 0"></p>
      </article>
      <article>
        <p class="label">Total Entries</p>
        <p class="value" x-text="basketState.summary?.totalEntries || 0"></p>
      </article>
      <article>
        <p class="label">Days With Warnings</p>
        <p class="value" x-text="basketState.summary?.daysWithWarnings || 0"></p>
      </article>
      <article>
        <p class="label">Days With Errors</p>
        <p class="value" x-text="basketState.summary?.daysWithErrors || 0"></p>
      </article>
    </div>
  </section>

  <section class="panel selected-day-panel">
    <h2 x-text="selectedDayState?.label || 'Selected Day'"></h2>
    <div class="item-list">
      <!-- BASKET_RUNTIME -->
    </div>
  </section>

  <section class="panel transfer-panel">
    <h2>Move Entries</h2>
    <template x-if="basketEntries.length === 0">
      <p class="empty">No entries to move in selected day.</p>
    </template>
    <div class="transfer-list">
      <template x-for="entry in basketEntries" :key="entry.id">
        <div class="transfer-row">
          <span class="transfer-title" x-text="entry.state.definition?.name || entry.name || entry.itemId"></span>
          <select :value="defaultMoveTarget(entry.id)" @change="setMoveTarget(entry.id, $event.target.value)">
            <template x-for="day in moveTargetsFor(entry.id)" :key="day.dayIndex">
              <option :value="day.dayIndex" x-text="day.label"></option>
            </template>
          </select>
          <button class="btn btn-small btn-secondary" @click="moveEntry(entry.id)">Move</button>
        </div>
      </template>
    </div>
  </section>
</section>
