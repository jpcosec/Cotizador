<section class="category-shell">
  <header class="panel controls-panel">
    <div class="control-group">
      <label for="category-select">Category</label>
      <select id="category-select" :value="selectedCategoryId" @change="selectCategory($event.target.value)">
        <template x-for="option in categoryOptions" :key="option.id">
          <option :value="option.id" x-text="`${option.nombre} (${option.itemCount})`"></option>
        </template>
      </select>
    </div>

    <div class="control-grid">
      <label>
        <span>Pax Global</span>
        <input type="number" min="0" :value="globalContext.paxGlobal" @input="setContextField('paxGlobal', $event.target.value)" />
      </label>
      <label>
        <span>Dia</span>
        <input type="number" min="1" :value="globalContext.dia" @input="setContextField('dia', $event.target.value)" />
      </label>
      <label>
        <span>Hora</span>
        <input type="time" :value="globalContext.hora" @input="setContextField('hora', $event.target.value)" />
      </label>
    </div>
  </header>

  <section class="panel aggregate-panel">
    <h2 x-text="categoryState.nombre || 'Category'"></h2>
    <div class="aggregate-grid">
      <article>
        <p class="label">Items</p>
        <p class="value" x-text="categoryState.itemCount || 0"></p>
      </article>
      <article>
        <p class="label">Subtotal</p>
        <p class="value" x-text="formatMoney(categoryState.subtotal)"></p>
      </article>
      <article>
        <p class="label">Warnings</p>
        <p class="value" x-text="categoryState.ruleWarnings?.length || 0"></p>
      </article>
      <article>
        <p class="label">Errors</p>
        <p class="value" x-text="categoryState.ruleErrors?.length || 0"></p>
      </article>
    </div>

    <template x-if="(categoryState.loadErrors || []).length > 0">
      <div class="load-errors">
        <h3>Load errors</h3>
        <template x-for="error in categoryState.loadErrors" :key="`${error.itemId}-${error.message}`">
          <p class="error-line" x-text="`${error.itemId}: ${error.message}`"></p>
        </template>
      </div>
    </template>
  </section>

  <section class="panel items-panel">
    <h2>Category Items</h2>
    <template x-if="(categoryState.items || []).length === 0">
      <p class="empty-state">No active items in this category.</p>
    </template>

    <div class="item-list">
      <!-- ITEM_CATALOG_RUNTIME -->
    </div>
  </section>
</section>
