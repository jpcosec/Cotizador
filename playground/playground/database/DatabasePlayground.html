<div x-data="databasePlaygroundComponent()" class="db-playground">

  <!-- ── Table Tabs ─────────────────────────────────────────────────────── -->
  <div class="db-tabs">
    <template x-for="table in tables" :key="table">
      <button
        class="db-tab"
        :class="{ 'db-tab--active': ctx.activeTable === table }"
        @click="selectTable(table)"
        x-text="table.replace(/_/g, ' ')"
      ></button>
    </template>
  </div>

  <!-- ── Toolbar ────────────────────────────────────────────────────────── -->
  <div class="db-toolbar">

    <!-- Tag filter chips -->
    <div class="db-filters" x-show="tagOptions.length > 0">
      <template x-for="tag in tagOptions" :key="tag">
        <button
          class="db-chip"
          :class="{ 'db-chip--active': ctx.tagFilters?.includes(tag) }"
          @click="toggleFilter(tag)"
          x-text="tag"
        ></button>
      </template>
    </div>

    <div class="db-toolbar__right">
      <button class="btn btn-small btn-primary" @click="addRow()" x-show="state === 'browsing'">
        + Add row
      </button>
      <span class="db-count-pill" x-text="rowCount + ' rows'"></span>
    </div>
  </div>

  <!-- ── Pending Row (addingRow state) ──────────────────────────────────── -->
  <div class="db-pending-row" x-show="state === 'addingRow' && ctx.pendingRow" x-cloak>
    <h4>New row</h4>
    <div class="db-pending-fields">
      <template x-for="col in activeColumns" :key="col.name">
        <div class="db-pending-field" x-show="col.type !== 'PK'">
          <label x-text="col.name"></label>
          <input
            class="db-input"
            :class="{ 'db-input--error': ctx.pendingRow?.errors?.[col.name] }"
            :value="ctx.pendingRow?.fields?.[col.name] ?? ''"
            @input="updatePendingField(col.name, $el.value)"
            :placeholder="col.desc"
          />
          <span class="db-field-error" x-show="ctx.pendingRow?.errors?.[col.name]"
            x-text="ctx.pendingRow?.errors?.[col.name]">
          </span>
        </div>
      </template>
    </div>
    <div class="db-pending-actions">
      <button class="btn btn-small btn-primary" @click="commitAdd()">Save</button>
      <button class="btn btn-small btn-secondary" @click="cancelAdd()">Cancel</button>
    </div>
  </div>

  <!-- ── Table ──────────────────────────────────────────────────────────── -->
  <div class="db-table-wrap">
    <table class="db-table">
      <thead>
        <tr>
          <template x-for="col in activeColumns" :key="col.name">
            <th @click="sort(col.name)" style="cursor:pointer">
              <span x-text="col.name + sortIndicator(col.name)"></span>
            </th>
          </template>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in filteredRows" :key="rowId(row)">
          <tr :class="{ 'db-row--delete-pending': isPendingDelete(rowId(row)) }">
            <template x-for="col in activeColumns" :key="col.name">
              <td>
                <!-- Inline edit input -->
                <template x-if="isEditing(rowId(row), col.name)">
                  <div>
                    <input
                      class="db-input"
                      :class="{ 'db-input--error': ctx.editTarget?.error }"
                      :value="ctx.editTarget?.buffer"
                      @input="updateBuffer($el.value)"
                      @keydown.enter="commitEdit()"
                      @keydown.escape="cancelEdit()"
                      x-init="$el.focus()"
                    />
                    <span class="db-field-error" x-show="ctx.editTarget?.error"
                      x-text="ctx.editTarget?.error">
                    </span>
                  </div>
                </template>
                <!-- Display value -->
                <template x-if="!isEditing(rowId(row), col.name)">
                  <span
                    class="db-cell"
                    :title="formatCell(row[col.name])"
                    @dblclick="dblClickCell(rowId(row), col.name, row[col.name])"
                    x-text="formatCell(row[col.name])"
                  ></span>
                </template>
              </td>
            </template>
            <!-- Row actions -->
            <td class="db-row-actions">
              <template x-if="!isPendingDelete(rowId(row))">
                <button
                  class="btn btn-small btn-danger-outline"
                  @click="deleteRow(rowId(row))"
                  title="Delete row"
                >✕</button>
              </template>
              <template x-if="isPendingDelete(rowId(row))">
                <span>
                  <button class="btn btn-small btn-danger" @click="deleteRow(rowId(row))">Confirm</button>
                  <button class="btn btn-small btn-secondary" @click="cancelDelete()">Cancel</button>
                </span>
              </template>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

</div>
