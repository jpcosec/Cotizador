<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>I-1: Database Browser</title>
  <link rel="stylesheet" href="/packages/components/common/styles/claps-global.css" />
  <style>
    /* ── Page layout — render edge-to-edge width ─────────────── */
    body.sandbox-page {
      padding: 0;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    .sandbox-shell {
      max-width: none;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #app {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .db-playground {
      font-size: 13px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ── Tabs ────────────────────────────────────────────────── */
    .db-tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
    .db-tab {
      padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px;
      background: #f8fafc; cursor: pointer; font-size: 12px; font-family: monospace;
    }
    .db-tab--active { background: #1e40af; color: #fff; border-color: #1e40af; }

    /* ── Toolbar ─────────────────────────────────────────────── */
    .db-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .db-toolbar__right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .db-filters { display: flex; gap: 4px; flex-wrap: wrap; }
    .db-chip {
      padding: 3px 10px; border-radius: 12px; border: 1px solid #94a3b8;
      font-size: 11px; background: #f1f5f9; cursor: pointer;
    }
    .db-chip--active { background: #dbeafe; border-color: #3b82f6; color: #1d4ed8; }
    .db-count-pill {
      background: #e2e8f0; border-radius: 10px; padding: 2px 8px;
      font-size: 11px; color: #475569;
    }

    /* ── Table ───────────────────────────────────────────────── */
    .db-table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .db-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .db-table thead th {
      background: #f1f5f9; padding: 8px 10px; text-align: left;
      font-family: monospace; font-size: 11px; white-space: nowrap;
      border-bottom: 2px solid #e2e8f0; user-select: none;
    }
    .db-table thead th:hover { background: #e2e8f0; }
    .db-table tbody tr:nth-child(even) { background: #fafafa; }
    .db-table tbody tr:hover { background: #eff6ff; }
    .db-table td { padding: 6px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    .db-row--delete-pending { background: #fef2f2 !important; }
    .db-row-actions { white-space: nowrap; }

    /* ── Cell ────────────────────────────────────────────────── */
    .db-cell {
      display: inline-block; max-width: 240px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: default;
    }
    .db-cell:hover { text-decoration: underline dotted #94a3b8; }

    /* ── Inline edit ─────────────────────────────────────────── */
    .db-input {
      border: 1px solid #3b82f6; border-radius: 4px;
      padding: 3px 6px; font-size: 12px; width: 180px; outline: none;
    }
    .db-input--error { border-color: #ef4444; }
    .db-field-error { color: #ef4444; font-size: 11px; display: block; margin-top: 2px; }

    /* ── Pending row ─────────────────────────────────────────── */
    .db-pending-row {
      border: 2px solid #22c55e; border-left: 4px solid #16a34a;
      border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; background: #f0fdf4;
    }
    .db-pending-row h4 { margin: 0 0 10px; font-size: 13px; color: #15803d; }
    .db-pending-fields { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .db-pending-field { display: flex; flex-direction: column; gap: 3px; }
    .db-pending-field label { font-size: 11px; font-family: monospace; color: #475569; }
    .db-pending-actions { margin-top: 12px; display: flex; gap: 8px; }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn-danger-outline {
      background: transparent; border: 1px solid #ef4444; color: #ef4444;
    }
    .btn-danger-outline:hover { background: #fef2f2; }
    .btn-danger { background: #ef4444; color: #fff; border: none; }
    .btn-danger:hover { background: #dc2626; }

    [x-cloak] { display: none !important; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "xstate": "/node_modules/xstate/dist/xstate.esm.js"
    }
  }
  </script>
</head>
<body class="sandbox-page">
  <main class="sandbox-shell">
    <div style="display:flex;align-items:center;gap:12px;margin:16px 16px 12px">
      <a class="btn btn-small btn-secondary" href="/">← Back</a>
      <h2 style="margin:0">I-1: Database Browser</h2>
      <span style="font-size:12px;color:#64748b">Double-click any cell to edit · Delete has confirm step</span>
    </div>

    <div id="app">Loading database…</div>
  </main>

  <script type="module">
    import { mountDatabasePlayground } from '/apps/sandbox/playground/database/mountDatabasePlayground.js';

    window.addEventListener('DOMContentLoaded', async () => {
      await mountDatabasePlayground(document.getElementById('app'));
    });
  </script>
</body>
</html>
