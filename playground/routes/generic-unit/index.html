<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sandbox - GenericUnit Runtime Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="/node_modules/json-logic-js/logic.js"></script>
  <script type="importmap">
  {
    "imports": {
      "xstate": "/node_modules/xstate/dist/xstate.esm.js",
      "json-logic-js": "/src/components/item/domain/rulesEngine/json-logic-esm.js"
    }
  }
  </script>
  <style>
    :root {
      --ink: #122033;
      --muted: #5d6b80;
      --line: rgba(18, 32, 51, 0.12);
      --paper: rgba(255, 252, 246, 0.82);
      --warm: #fff3dd;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --signal: #c2410c;
      --shadow: 0 24px 60px rgba(18, 32, 51, 0.12);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.18), transparent 32%),
        radial-gradient(circle at right center, rgba(194, 65, 12, 0.18), transparent 24%),
        linear-gradient(180deg, #f6efe2 0%, #f7f9fb 100%);
    }

    .page-shell {
      width: min(1240px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      margin-bottom: 18px;
    }

    .generic-lab {
      display: grid;
      gap: 18px;
    }

    .lab-hero,
    .lab-panel,
    .unit-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .lab-hero,
    .lab-panel,
    .unit-card {
      padding: 22px;
    }

    .lab-hero {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
    }

    .lab-kicker,
    .panel-label {
      margin: 0 0 8px;
      color: var(--signal);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 0.98;
      max-width: 12ch;
    }

    h2 {
      font-size: 1.35rem;
    }

    h3 {
      font-size: 1.1rem;
    }

    .lab-copy {
      color: var(--muted);
      max-width: 62ch;
      margin-top: 10px;
      line-height: 1.5;
    }

    .lab-copy.small {
      font-size: 0.92rem;
      margin-top: 6px;
    }

    .lab-actions,
    .scenario-actions,
    .stage-strip,
    .unit-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lab-btn,
    .stage-pill {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .lab-btn:hover,
    .stage-pill:hover {
      transform: translateY(-1px);
    }

    .lab-btn.primary,
    .stage-pill.is-active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: #f5fffd;
    }

    .lab-btn.ghost,
    .stage-pill {
      background: rgba(255, 255, 255, 0.8);
      border-color: var(--line);
      color: var(--ink);
    }

    .lab-grid,
    .unit-grid {
      display: grid;
      gap: 18px;
    }

    .lab-grid {
      grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr);
    }

    .unit-grid {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .panel-chip,
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 7px 10px;
      background: var(--warm);
      color: var(--signal);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-row span,
    .boundary-row span,
    .unit-stats dd {
      color: var(--muted);
    }

    .status-success {
      color: var(--accent-strong);
    }

    .status-pending {
      color: var(--signal);
    }

    .status-error {
      color: #991b1b;
    }

    .unit-card[data-variant="signal"] {
      background: linear-gradient(180deg, rgba(255, 243, 221, 0.92), rgba(255, 252, 246, 0.88));
    }

    .unit-card[data-variant="projection"] {
      background: linear-gradient(180deg, rgba(229, 250, 247, 0.92), rgba(255, 252, 246, 0.88));
    }

    .unit-card[data-variant="container"] {
      background: linear-gradient(180deg, rgba(231, 236, 255, 0.92), rgba(255, 252, 246, 0.88));
    }

    .nested-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .nested-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.72);
    }

    .panel-head.compact {
      margin-bottom: 10px;
    }

    .nested-stats {
      grid-template-columns: 1fr;
      margin: 10px 0 12px;
    }

    .unit-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .unit-stats div {
      padding: 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
    }

    .unit-stats dt {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .unit-stats dd {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
    }

    .json-viewer,
    .json-mini {
      margin: 0;
      padding: 16px;
      border-radius: 18px;
      background: rgba(18, 32, 51, 0.92);
      color: #d9efe9;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.83rem;
      overflow: auto;
      line-height: 1.45;
    }

    .json-mini {
      min-height: 120px;
    }

    @media (max-width: 900px) {
      .page-shell {
        width: min(100vw - 20px, 1000px);
      }

      .lab-hero,
      .lab-grid {
        grid-template-columns: 1fr;
      }

      .unit-stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <a class="back-link" href="/playground/index.html">← Back to playgrounds</a>
    <div id="app">Loading GenericUnit Runtime Lab...</div>
  </main>

  <script type="module">
    import { mountGenericUnitPlayground } from '/playground/playground/generic-unit/mountGenericUnitPlayground.js';

    window.addEventListener('DOMContentLoaded', async () => {
      const root = document.getElementById('app');
      await mountGenericUnitPlayground(root);
    });
  </script>
</body>
</html>
