id: editor_cotizacion
label: Editor Cotizacion
purpose: Main quotation construction surface.
entry_signals:
  - client_confirmed
  - load_existing_quotation
exit_signals:
  - validate_quotation
  - back_to_home
capabilities:
  - edit_global_context
  - move_items_in_time
  - edit_basket_items
  - duplicate_or_copy_items
boundaries:
  - Persistence
  - Export
  - Store
stages:
  - id: sidebar_catalogo
    label: Sidebar / Catalogo
    purpose: Browse available units and edit global context.
    units:
      - QuotationFlow
      - GlobalContext
      - Catalog
      - Category
      - Item(catalog)
      - Store
    containers:
      - Catalog
    transitions:
      - on: select_day
        to: selector_dia
        kind: forward
      - on: drag_item_to_timeline
        to: editor_tiempo
        kind: forward
  - id: selector_dia
    label: Selector Dia
    purpose: Choose the active day for editing.
    units:
      - QuotationFlow
      - DaySelector
      - Basket
      - BasketDay
    containers:
      - Basket
      - BasketDay
    transitions:
      - on: day_selected
        to: editor_tiempo
        kind: forward
      - on: back_to_catalog
        to: sidebar_catalogo
        kind: back
  - id: editor_tiempo
    label: Editor Tiempo
    purpose: Place, move, and resize quotation items in time.
    units:
      - QuotationFlow
      - TimelineEditor
      - Basket
      - BasketDay
      - Item(basket)
      - PricingEngine
      - RulesEngine
      - Store
    containers:
      - Basket
      - BasketDay
    transitions:
      - on: open_basket_editor
        to: editor_canasta
        kind: forward
      - on: validate_quotation
        to: acciones_item
        kind: forward
  - id: editor_canasta
    label: Editor Canasta
    purpose: Edit item comments and quantity/time overrides.
    units:
      - QuotationFlow
      - Basket
      - BasketDay
      - Item(basket)
      - PricingEngine
      - RulesEngine
    containers:
      - Basket
      - BasketDay
    transitions:
      - on: return_to_timeline
        to: editor_tiempo
        kind: back
      - on: validate_quotation
        to: acciones_item
        kind: forward
  - id: acciones_item
    label: Acciones Item / Grupo
    purpose: Copy, duplicate, or remove item/group structures before validation.
    units:
      - QuotationFlow
      - Basket
      - BasketDay
      - Item(basket)
      - TimelineEditor
    containers:
      - Basket
      - BasketDay
    transitions:
      - on: continue_to_validation
        to: validation_exit
        kind: forward
      - on: keep_editing
        to: editor_tiempo
        kind: back
  - id: validation_exit
    label: Salida a Validacion
    purpose: Hand off the composed quotation into the validator flow.
    units:
      - QuotationFlow
      - ValidationSummary
    transitions:
      - on: open_validator
        to: external_validador
        kind: external
