title: Component x View-Stage Matrix
description: >-
  Canonical source for the bi-hierarchical component/view-stage matrix.
  Rows are component hierarchy. Columns are views and their ordered stages.
  Filled cells indicate participation of a component in a given stage.
views:
  - id: quotation
    label: Quotation View
    stages:
      - id: browse
        label: browse
      - id: client
        label: client
      - id: basket
        label: basket
      - id: validation
        label: validation
      - id: completed
        label: completed
  - id: admin
    label: Admin View
    stages:
      - id: list
        label: list
      - id: edit
        label: edit
      - id: audit
        label: audit
component_types:
  core:
    label: Core unit
    color: "#f59e0b"
  boundary:
    label: Boundary unit
    color: "#60a5fa"
  engine:
    label: Decision engine
    color: "#ec4899"
  admin:
    label: Admin unit
    color: "#14b8a6"
components:
  - name: QuotationFlow
    type: core
    status: overloaded
    stages:
      quotation: [browse, client, basket, validation, completed]
    children:
      - name: Persistence
        type: boundary
        status: real
        stages:
          quotation: [browse, validation, completed]
          admin: [list, edit, audit]
      - name: Store
        type: boundary
        status: split
        stages:
          quotation: [browse, client, basket]
      - name: ClientSelection
        type: core
        status: partial
        stages:
          quotation: [client]
      - name: Catalog
        type: core
        status: real
        stages:
          quotation: [basket]
        children:
          - name: Category
            type: core
            status: real
            stages:
              quotation: [basket]
            children:
              - name: Item
                mode: catalog
                type: core
                status: strong
                stages:
                  quotation: [basket]
      - name: Basket
        type: core
        status: real
        stages:
          quotation: [basket, validation]
        children:
          - name: BasketDay
            type: core
            status: real
            stages:
              quotation: [basket, validation]
            children:
              - name: Item
                mode: basket
                type: core
                status: strong
                stages:
                  quotation: [basket, validation]
      - name: PricingEngine
        type: engine
        status: distributed
        stages:
          quotation: [basket, validation]
      - name: ValidationSummary
        type: core
        status: partial
        stages:
          quotation: [validation]
      - name: Export
        type: boundary
        status: partial
        stages:
          quotation: [validation]
  - name: AdminPanel
    type: admin
    status: real
    stages:
      admin: [list, edit, audit]
    children:
      - name: PackEditor
        type: admin
        status: real
        stages:
          admin: [edit]
      - name: AuditLog
        type: admin
        status: real
        stages:
          admin: [audit]
