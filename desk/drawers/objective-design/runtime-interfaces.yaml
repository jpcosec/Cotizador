title: Runtime Interfaces
description: >-
  Code-facing runtime contracts for the core recursive architecture:
  AppShell -> View -> Container -> Container and/or Item.

interfaces:
  View:
    purpose: First orchestration layer above containers.
    owns:
      - view_id
      - stage_id
      - visible_units
      - child registration
      - stage transitions
      - aggregated projection for UI
    receives:
      - navigation signals
      - user intent signals
      - persistence/export capabilities
      - store boundary
      - child snapshots
      - child emitted signals
    emits:
      - stage_changed
      - visible_units_changed
      - container_signal
      - persistence_request
      - export_request
      - ui_projection_changed
    methods:
      - id: initialize
        signature: initialize(context, boundaries)
        returns: void
      - id: transition
        signature: transition(signal)
        returns: next_stage
      - id: registerChild
        signature: registerChild(unit_id, unit_type, handlers)
        returns: void
      - id: routeSignal
        signature: routeSignal(signal, target?)
        returns: void
      - id: getProjection
        signature: getProjection()
        returns: view_projection

  Container:
    purpose: Recursive composition unit that groups child containers and/or items.
    owns:
      - local context
      - child collection
      - local ordering/grouping structure
      - aggregated child state
    receives:
      - state mutations from parent view/container
      - context patches
      - store results
      - child snapshots
      - child rule/quantity/pricing signals
    emits:
      - child_signal
      - aggregate_changed
      - upward_snapshot
      - store_query_request
    methods:
      - id: initialize
        signature: initialize(context, boundaries)
        returns: void
      - id: registerChildContainer
        signature: registerChildContainer(container_id, handlers)
        returns: void
      - id: registerChildItem
        signature: registerChildItem(item_id, handlers)
        returns: void
      - id: applyMutation
        signature: applyMutation(signal)
        returns: void
      - id: propagateContext
        signature: propagateContext(patch)
        returns: void
      - id: aggregate
        signature: aggregate()
        returns: aggregate_snapshot
      - id: getProjection
        signature: getProjection()
        returns: container_projection
    rules:
      - A container may contain containers, items, or both.
      - A container never computes global pricing for children directly.
      - A container aggregates child outputs upward.

  Item:
    purpose: Atomic commercial/runtime unit.
    owns:
      - definition
      - local context
      - local overrides
      - local quantities
      - local pricing results
      - local rule activations
    receives:
      - context patches
      - override mutations
      - mode changes
      - rule signals
      - resolved definitions/store data
    emits:
      - quantity_changed
      - pricing_changed
      - rules_changed
      - availability_changed
      - upward_snapshot
    methods:
      - id: initialize
        signature: initialize(definition, context, boundaries)
        returns: void
      - id: applyMutation
        signature: applyMutation(signal)
        returns: void
      - id: computeQuantities
        signature: computeQuantities(context, overrides)
        returns: quantity_snapshot
      - id: computePricing
        signature: computePricing(quantity_snapshot)
        returns: pricing_snapshot
      - id: evaluateRules
        signature: evaluateRules(quantity_snapshot, pricing_snapshot)
        returns: rules_snapshot
      - id: getProjection
        signature: getProjection()
        returns: item_projection
    rules:
      - Item computes pricing locally from quantities.
      - Item evaluates rules locally from context, quantities, and pricing.
      - Item never aggregates sibling totals.

invariants:
  - View orchestrates stages and visible units.
  - Containers recurse.
  - Items compute locally.
  - Aggregation moves upward.
  - Context, quantity signals, and rule signals may move downward and upward.
