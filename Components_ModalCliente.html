<template x-teleport="body">
    <div class="modal-overlay" 
         x-show="modalCliente" 
         style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99999; display: flex; justify-content: center; align-items: center;"
         x-transition.opacity>
        
        <div class="modal" @click.away="cerrarModalCliente()" style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h3>Seleccionar Cliente</h3>
            
            <div class="form-group">
                <input type="text" x-model="busquedaCliente" @input.debounce.300ms="buscarClientes()" placeholder="Buscar por nombre o RUT...">
            </div>
            
            <div style="margin: 10px 0; max-height: 150px; overflow-y: auto; border: 1px solid #eee;">
                <template x-for="cli in clientesEncontrados" :key="cli.ID_Cliente">
                    <div @click="seleccionarCliente(cli)" style="padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; hover:background: #f9f9f9;">
                        <strong x-text="cli.Nombre_Empresa"></strong> - <small x-text="cli.RUT"></small>
                    </div>
                </template>
                <div x-show="clientesEncontrados.length === 0 && busquedaCliente.length > 2" style="padding:10px; color:gray;">No se encontraron clientes.</div>
            </div>
            
            <hr>
            <h4>O Nuevo Cliente:</h4>
            
            <div class="form-group">
                <label>Nombre Empresa *</label>
                <input type="text" x-model="nuevoCliente.nombre" placeholder="Ej: Empresa SPA">
            </div>
            <div class="form-group">
                <label>RUT *</label>
                <input type="text" x-model="nuevoCliente.rut" placeholder="76.123.456-7">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" x-model="nuevoCliente.email" placeholder="contacto@empresa.cl">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" x-model="nuevoCliente.telefono" placeholder="+569...">
            </div>
            <div class="form-group">
                <label>Nombre Contacto</label>
                <input type="text" x-model="nuevoCliente.contacto" placeholder="Persona a cargo">
            </div>
            
            <div style="margin-top: 15px; text-align: right;">
                <button class="btn-small btn-secondary" @click="cerrarModalCliente()">Cancelar</button>
                <button class="btn-small btn-primary" @click="crearCliente()">Guardar y Usar</button>
            </div>
        </div>
    </div>
</template>
